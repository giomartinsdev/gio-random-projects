openapi: 3.0.3
info:
  title: domain-api
  description: >
    Event-driven CRUD API para o contexto financeiro. Reads are synchronous
    (straight from Postgres). Writes are either accepted asynchronously
    — they publish a command onto the event bus and return 202, applied
    by domain-worker — or, for the few callers that must not proceed
    until the write is durable, sent through POST /sync, which blocks
    until the worker's audit row lands.
  version: "2.0.0"
servers:
  - url: /
security:
  - apiKeyAuth: []
paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /commands:
    post:
      summary: Asynchronous envelope write (the default)
      description: >
        Decodes the bare {action, payload} envelope and publishes it with a
        fresh server-side id, answering 202 immediately. The domain-worker
        applies it. This is the house default write path (§4.1); use /sync
        only when the caller must not proceed until the write is durable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "202":
          description: Published; applied asynchronously by domain-worker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /sync:
    post:
      summary: Synchronous write (the exception)
      description: >
        Republishes the given command and blocks until domain-worker's
        audit_log row for it lands. Use only when the caller cannot
        proceed without the write applied — every other write should use
        its own async (202) route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "200":
          description: Applied; entity_id carries the affected row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The worker rejected the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "429":
          $ref: "#/components/responses/RateLimited"
        "504":
          description: Timed out waiting; the command stays queued.

  # Financeiro (docs/finance-system-spec.md §4.2): projeções de leitura sobre
  # as tabelas finance_* que o domain-worker escreve. A finance-api relaya
  # estes GETs; dinheiro sempre volta como string decimal canônica (§3.4 nº1).
  /finance/daily-summary:
    get:
      tags: [finance]
      summary: Resumo do dia (GET §4.2 GetDailySummaryQuery)
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, example: "2026-10-04" } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/monthly-dashboard:
    get:
      tags: [finance]
      summary: Dashboard do mês (§4.2 GetMonthlyDashboardQuery)
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: string, example: "2026-10" } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/category-breakdown:
    get:
      tags: [finance]
      summary: Despesas por categoria no mês (§4.2 GetCategoryBreakdownQuery)
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: string, example: "2026-10" } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/cash-flow-history:
    get:
      tags: [finance]
      summary: Fluxo de caixa por dia do mês (§4.2 GetCashFlowHistoryQuery)
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: string, example: "2026-10" } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Required on every route except /healthz, /openapi.yaml and
        /docs. A valid key also exempts the request from the per-IP
        rate limit that otherwise applies to unauthenticated attempts.
  parameters:
    ClubID:
      name: clubId
      in: path
      required: true
      schema: { type: string }
    PlayerID:
      name: playerId
      in: path
      required: true
      schema: { type: string }
  requestBodies:
    Input:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Accepted:
      description: Accepted; applied asynchronously by domain-worker.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Accepted"
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Command:
      type: object
      required: [action]
      properties:
        action:
          type: string
          example: club.upsert
        payload:
          type: object
          additionalProperties: true
    SyncResult:
      type: object
      properties:
        command_id: { type: string }
        status:
          type: string
          enum: [written, failed, queued]
        entity_id: { type: string }
        error: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
    Accepted:
      type: object
      properties:
        command_id: { type: string }
        status:
          type: string
          example: accepted
