[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-openfinance-worker"
version = "0.1.0"
description = "Conector Open Finance do financeiro: sincroniza contas e transações do Polp/Celcoin para o ledger via finance-api. Sem banco, sem broker."
requires-python = ">=3.12"
# httpx fala com o Polp (provedor) e com a finance-api. Nenhum driver de banco,
# nenhum broker: o worker é um poller, não dono de persistência (§1.1).
dependencies = [
    "httpx>=0.27",
    "finance-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "testcontainers>=4.0", "docker>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/finance_openfinance_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
