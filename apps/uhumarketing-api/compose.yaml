# Stack do uhumarketing: Postgres + API + SPA.
#
#   cp .env.example .env
#   docker compose up -d --build
#   open http://localhost:8080
#
# O navegador fala SÓ com o `web` (nginx): ele serve a SPA e faz proxy de
# /api, /webhooks e /healthz para o `api`. Mesma origem, sem CORS, e o callback
# do webhook que o operador cola na Meta é o mesmo host que ele abre.
#
# O `api` continua publicado na 8195 para depuração (`curl /healthz`), mas não
# é necessário para o produto: em deploy, exponha apenas o `web` (ou ponha o
# proxy TLS na frente dele).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uhu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uhu}
      POSTGRES_DB: ${POSTGRES_DB:-uhumarketing}
    # Sem porta publicada: nada fora do compose precisa falar com o banco. Para
    # inspecionar do host, use `docker compose exec postgres psql`.
    volumes:
      - uhumarketing-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uhu} -d ${POSTGRES_DB:-uhumarketing}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8195"
    ports:
      # Só em loopback: útil para `curl localhost:8195/healthz` no servidor.
      - "127.0.0.1:${API_PORT:-8195}:8195"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-uhu}:${POSTGRES_PASSWORD:-uhu}@postgres:5432/${POSTGRES_DB:-uhumarketing}?sslmode=disable
      HTTP_ADDR: :8195
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Nada sai para a Meta por padrão. Ver README, "Modo live, passo a passo".
      META_MODE: ${META_MODE:-dry-run}
      # Chave que cifra o token de WhatsApp de cada conta. Obrigatória em live.
      CHANNEL_SECRET: ${CHANNEL_SECRET:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-uhu-dev-verify}
      # URL pública deste stack (https://uhu.seudominio.com). É o que a tela
      # mostra como callback do webhook; sem ela, a tela não oferece callback.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-2}
      # /dev/reset e afins: desligado por padrão. Ligue só em ambiente de teste.
      ALLOW_DEV_ACTIONS: ${ALLOW_DEV_ACTIONS:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8195/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ../uhumarketing-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      API_UPSTREAM: http://api:8195
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  uhumarketing-postgres:
