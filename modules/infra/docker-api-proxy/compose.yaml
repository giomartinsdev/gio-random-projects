# See proxy.py's own module docstring for the full "why" — this exists
# purely to work around a still-open bug in
# kreuzwerker/terraform-provider-docker (reported upstream, no fix
# released as of writing).
#
# network_mode: host is required so 127.0.0.1:2376 in proxy.py actually
# reaches dockerd's TCP listener on the host — same reasoning as
# infra/cloudflared's own network_mode: host.
services:
  docker-api-proxy:
    build: .
    container_name: docker-api-proxy
    restart: unless-stopped
    network_mode: host
