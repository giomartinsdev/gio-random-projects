# The pull-based half of apps-deploy.yml's CD: CI pushes
# registry.giomartins.dev/<app>:latest, this polls and redeploys any
# running container labeled com.centurylinklabs.watchtower.enable=true
# (see modules/apps/compose.prod.yaml) — no inbound access to
# gio-server required, unlike a push-based deploy would need.
services:
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-60}
      # containrrr/watchtower's Docker client negotiates a hardcoded old
      # API version (1.25) that this host's Docker Engine (1.54) rejects
      # outright — confirmed live via "client version 1.25 is too old"
      # in its logs. Forcing a modern version here is the documented fix.
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
