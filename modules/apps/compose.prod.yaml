# Production overlay: pulls the images .github/workflows/apps-deploy.yml
# already builds and pushes to registry.giomartins.dev — not a local
# build. Deploy with:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# The watchtower label is what lets modules/infra/watchtower pick these
# two up for automatic redeploys; nothing else on the host carries it.
services:
  api:
    image: registry.giomartins.dev/api:latest
    pull_policy: always
    build: !reset null
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  worker:
    image: registry.giomartins.dev/worker:latest
    pull_policy: always
    build: !reset null
    labels:
      com.centurylinklabs.watchtower.enable: "true"
