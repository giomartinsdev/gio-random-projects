[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-whatsapp-worker"
version = "0.1.0"
description = "Worker conversacional do financeiro: consome eventos do Evolution API e fala com a finance-api. Sem banco."
requires-python = ">=3.12"
# aio-pika fala o RabbitMQ do persistence: consome `evolution.messages.upsert`
# (a Evolution publica) e os eventos de domínio `finance.*`. httpx fala a
# finance-api. Nenhum driver de banco, nenhum publicador de comando (§1.1).
dependencies = [
    "aio-pika>=9.4",
    "httpx>=0.27",
    "finance-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-bdd>=8.0", "pytest-asyncio>=0.23", "testcontainers>=4.0", "docker>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/finance_whatsapp_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
