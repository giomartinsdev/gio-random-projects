[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-api"
version = "0.1.0"
description = "The finance bounded context's ACL: validates the worker's commands, translates them to the house {action,payload} envelope and relays to domain-api. No database, no broker."
requires-python = ">=3.12"
# finance-contracts is NOT on PyPI: it is the vendored package sitting at
# packages/finance-contracts in this repo, and the CI installs it from that
# path in the same pip invocation as this app (python-ci-cd.yml). Declaring
# it here is what documents the dependency; the path form is the install.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # Telemetry is optional at runtime (empty OTEL_EXPORTER_OTLP_ENDPOINT
    # turns it off) but the packages are a normal dependency, same as the
    # Go services carrying their otel exporters in go.mod.
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    # Imported directly by src/finance_api/presentation/schemas.py. It arrived
    # transitively through fastapi, which is why the omission was invisible --
    # but a module the source imports is a dependency of the source, and
    # relying on another package's transitive pins is how a fastapi upgrade
    # breaks the app at import time.
    "pydantic>=2.0",
    # Google SSO do SPA (§5): google-auth verifica o ID token do Google
    # Identity Services contra o JWKS do Google; PyJWT assina o cookie de
    # sessão (o mesmo desenho do clubs-api, que usa idtoken+jwt/v5). Nenhum
    # dos dois fala banco nem broker — a regra de isolamento (§1.1) continua.
    "google-auth>=2.30",
    "PyJWT>=2.8",
    "finance-contracts",
]

[project.optional-dependencies]
# pyyaml is a TEST-ONLY dependency: tests/test_isolation.py imports it to read
# stacks/finance.yml for the §12.6 static check. It is not a runtime dependency
# of the app (the image never parses YAML) -- but it must be declared, because
# the CI installs the app's own metadata and nothing else: undeclared, the
# three §12.6 tests fail in CI while passing on any machine whose global
# environment happens to have PyYAML (a green that depends on the laptop).
dev = ["pytest>=8.0", "pytest-bdd>=8.0", "testcontainers>=4.0", "docker>=7.0", "pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/finance_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
