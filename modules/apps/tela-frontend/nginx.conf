server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that isn't a real static file falls back to
    # index.html so client-side routes (/r/abacate98suco) survive a hard
    # reload or a direct link, instead of 404ing against nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
