[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clubs-ingest"
version = "0.1.0"
description = "Worker: EA Pro Clubs API -> domain-api. No database of its own."
requires-python = ">=3.12"
# pandas is the dependency of the vendored source client (fc27_api.py);
# curl_cffi is what makes its calls pass the source's CDN check -- the CDN
# fingerprints the TLS/HTTP2 handshake, so a browser-impersonating transport is
# required from the VPS's datacenter IP (stdlib urllib gets a 403 there).
dependencies = [
    "pandas>=2.0",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
# The vendored MIT client ships inside the package (clubs_ingest/fc27_api.py)
# with its licence beside it, because the image installs only the wheel.
packages = ["src/clubs_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
