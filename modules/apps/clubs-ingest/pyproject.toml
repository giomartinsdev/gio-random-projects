[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clubs-ingest"
version = "0.1.0"
description = "Worker: EA Pro Clubs API -> domain-api. No database of its own."
requires-python = ">=3.12"
# pandas is the only dependency of the vendored source client (fc27_api.py),
# which speaks urllib -- exactly what passes the source's CDN check.
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
# The vendored MIT client ships inside the package (clubs_ingest/fc27_api.py)
# with its licence beside it, because the image installs only the wheel.
packages = ["src/clubs_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
