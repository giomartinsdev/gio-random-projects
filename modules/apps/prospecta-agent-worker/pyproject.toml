[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prospecta-agent-worker"
version = "0.1.0"
description = "Núcleo agêntico do Prospecta: consome eventos do domínio e do Evolution, orquestra os agentes, chama o 9router e envia pela Evolution. Sem porta, sem banco."
requires-python = ">=3.12"
# aio-pika fala o RabbitMQ do persistence (exchange `domain.events` e
# `evolution.messages.upsert`). httpx fala o 9router e a Evolution/prospecta-api.
# pydantic valida os contratos. prospecta-contracts é o contrato único,
# importado de packages/, nunca copiado. Nenhum driver de banco, nenhum
# publicador de banco (§1.1).
# curl_cffi é o transporte do web.scrape/enrich: CDNs que fingerprintam TLS
# recusam httpx com 403; curl_cffi impersona o Chrome (mesma técnica do
# clubs-ingest/fc27_api.py). Continua opcional em runtime -- httpx é o fallback
# -- mas vai na imagem para o scrape funcionar em produção.
dependencies = [
    "aio-pika>=9.4",
    "curl_cffi>=0.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "prospecta-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-bdd>=8.0", "pytest-asyncio>=0.23", "testcontainers>=4.0", "docker>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/prospecta_agent_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
