# bet-runner on the home network -- the whole point of this deploy: the
# bookmaker sites block the VPS's datacenter ASN (Betano's compliance
# wall answered every run with "Access to this page is restricted due
# to security and compliance measures"), so the Chrome that places the
# bets has to come from a residential IP. This machine IS the
# residential IP.
#
# Same container the VPS used to run (modules/apps/bet-runner's
# Dockerfile, built here instead of pulled from the registry), pointed
# at bet-api over its public hostname: /internal/* is guarded only by
# RUNNER_API_KEY -- the same shared secret it used on the apps network.
# One bet at a time, browser profiles in a named volume so the
# bookmaker login survives restarts.
#
# Secrets live in ~/.config/bet-runner-home/.env (OUTSIDE this repo --
# nothing credential-shaped belongs in the working tree):
#   RUNNER_API_KEY=...        from the vault's bet item, or the old VPS
#                             container's env while it still existed
#   BET_API_URL=https://bet-api.giomartins.dev
#   DRY_RUN=1                 (flip to 0 only once receipts look right)
name: bet-runner-home

services:
  runner:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: bet-runner:home
    container_name: bet-runner
    restart: unless-stopped
    env_file:
      # Absolute path on purpose: the .env must not live inside the repo.
      - /Users/gio/.config/bet-runner-home/.env
    volumes:
      - bet-runner-profiles:/data
    # Chromium's demands, same as the terraform module set for the VPS:
    # real memory headroom and a /dev/shm the default 64MB would crush.
    mem_limit: 2g
    shm_size: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bet-runner-profiles: