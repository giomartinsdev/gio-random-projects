# Local dev only — builds domain-api/ and domain-worker/ from source.
# Production pulls prebuilt images from the registry instead; see
# modules/infra/README.md and .github/workflows/apps-deploy.yml.
#
# Requires POSTGRES_PASSWORD, RABBITMQ_PASSWORD and DOMAIN_API_KEYS — no
# defaults, same "refuse to boot without it" pattern as the rest of this
# repo's infra.
services:
  domain-api:
    build: ./domain-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-domain}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-domain}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-domain}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      HTTP_ADDR: :8000
      DOMAIN_API_KEYS: ${DOMAIN_API_KEYS}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-1}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-5}

  domain-worker:
    build: ./domain-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-domain}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-domain}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-domain}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-domain}
    volumes:
      - domain-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-domain}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - domain-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  domain-postgres-data:
  domain-rabbitmq-data:
