server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that isn't a real static file falls back to
    # index.html so react-router's client-side routes (e.g. /posts/foo,
    # a hard refresh or direct link) don't 404 against nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
