server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx:alpine's stock mime.types has no .mjs entry, so it falls
    # back to application/octet-stream -- browsers refuse to
    # `import()` a module served with that content-type. pdfjs-dist's
    # worker (react-pdf's PDF.js dependency) is shipped as .mjs and
    # loaded via dynamic import when it can't start as a real Worker,
    # so without this, PDF rendering fails with "Failed to fetch
    # dynamically imported module". Scoped as default_type in its own
    # location (not a second `types{}` block) -- a `types{}` block
    # here would REPLACE the whole inherited mime.types table instead
    # of adding to it, breaking every other file's content-type.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # SPA: any path that isn't a real static file falls back to
    # index.html so react-router's client-side routes (e.g. /posts/foo,
    # a hard refresh or direct link) don't 404 against nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
