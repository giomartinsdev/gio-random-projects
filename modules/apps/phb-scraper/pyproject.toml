[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phb-scraper"
version = "0.1.0"
description = "Scraper worker: a source's public offers API -> raw_deals."
requires-python = ">=3.12"
# Same dependency set as pld-scraper -- see its pyproject for why
# scrapling's optional deps are spelled out here.
dependencies = [
    "scrapling==0.4.15",
    "curl_cffi>=0.7",
    "browserforge",
    "msgspec",
    "playwright",
    "patchright",
]

[dev-dependencies]
pytest = ">=8.0"

[tool.hatch.build.targets.wheel]
packages = ["src/phb_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]