# nginx da SPA do uhumarketing.
#
# A imagem oficial roda envsubst neste arquivo no start, então API_UPSTREAM é
# resolvido em runtime (aponta para o serviço `api` do compose por padrão) —
# a mesma imagem serve em qualquer host sem rebuild.
#
# A ordem importa: /api, /webhooks e /healthz vão para a API antes do fallback
# da SPA. Sem isso, um POST /api/v1/... receberia index.html e o app quebraria
# com "JSON inválido".

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip nos assets; o bundle é JS/CSS grande e o custo é zero.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome podem ser cacheados para sempre. O index.html
    # NÃO pode: é ele que aponta para o hash novo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /webhooks/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
    }

    # SPA com rotas por hash: qualquer caminho desconhecido cai no index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
