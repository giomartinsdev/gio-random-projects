openapi: 3.0.3
info:
  title: domain-api
  description: >
    Event-driven CRUD API for the FC Clubs Hub. Reads are synchronous
    (straight from Postgres). Writes are either accepted asynchronously
    — they publish a command onto the event bus and return 202, applied
    by domain-worker — or, for the few callers that must not proceed
    until the write is durable, sent through POST /sync, which blocks
    until the worker's audit row lands.
  version: "2.0.0"
servers:
  - url: /
security:
  - apiKeyAuth: []
paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /commands:
    post:
      summary: Asynchronous envelope write (the default)
      description: >
        Decodes the bare {action, payload} envelope and publishes it with a
        fresh server-side id, answering 202 immediately. The domain-worker
        applies it. This is the house default write path (§4.1); use /sync
        only when the caller must not proceed until the write is durable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "202":
          description: Published; applied asynchronously by domain-worker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /sync:
    post:
      summary: Synchronous write (the exception)
      description: >
        Republishes the given command and blocks until domain-worker's
        audit_log row for it lands. Use only when the caller cannot
        proceed without the write applied — every other write should use
        its own async (202) route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Command"
      responses:
        "200":
          description: Applied; entity_id carries the affected row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The worker rejected the command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "429":
          $ref: "#/components/responses/RateLimited"
        "504":
          description: Timed out waiting; the command stays queued.

  /clubs:
    get:
      tags: [clubs]
      summary: List clubs (local directory)
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [clubs]
      summary: Upsert a club (ingest door)
      requestBody: { $ref: "#/components/requestBodies/Input" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /clubs/search:
    get:
      tags: [clubs]
      summary: Search clubs already known to the hub
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /clubs/{clubId}:
    get:
      tags: [clubs]
      summary: Get one club
