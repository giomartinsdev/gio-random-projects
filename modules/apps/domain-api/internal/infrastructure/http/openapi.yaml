      requestBody: { $ref: "#/components/requestBodies/Input" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /search-pending:
    get:
      tags: [sync]
      summary: Pending source searches (consumed by the ingest worker)
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /search-run/result:
    post:
      tags: [sync]
      summary: Publish a source-search result (ingest worker)
      requestBody: { $ref: "#/components/requestBodies/Input" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # Financeiro (docs/finance-system-spec.md §4.2): projeções de leitura sobre
  # as tabelas finance_* que o domain-worker escreve. A finance-api relaya
  # estes GETs; dinheiro sempre volta como string decimal canônica (§3.4 nº1).
  /finance/daily-summary:
    get:
      tags: [finance]
      summary: Resumo do dia (GET §4.2 GetDailySummaryQuery)
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, example: "2026-10-04" } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/monthly-dashboard:
    get:
      tags: [finance]
      summary: Dashboard do mês (§4.2 GetMonthlyDashboardQuery)
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: string, example: "2026-10" } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/category-breakdown:
    get:
      tags: [finance]
      summary: Despesas por categoria no mês (§4.2 GetCategoryBreakdownQuery)
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: string, example: "2026-10" } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /finance/cash-flow-history:
    get:
      tags: [finance]
      summary: Fluxo de caixa por dia do mês (§4.2 GetCashFlowHistoryQuery)
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: string, example: "2026-10" } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /source-status:
    get:
      tags: [health]
      summary: Public slice of source health ("is EA responding?")
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/status:
    get:
      tags: [health]
      summary: Worker/admin status
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/ingest:
    get:
      tags: [health]
      summary: Ingest worker health
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [health]
      summary: Save ingest worker health (async)
      requestBody: { $ref: "#/components/requestBodies/Input" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Required on every route except /healthz, /openapi.yaml and
        /docs. A valid key also exempts the request from the per-IP
        rate limit that otherwise applies to unauthenticated attempts.
  parameters:
    ClubID:
      name: clubId
      in: path
      required: true
      schema: { type: string }
    PlayerID:
      name: playerId
      in: path
      required: true
      schema: { type: string }
  requestBodies:
    Input:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Accepted:
      description: Accepted; applied asynchronously by domain-worker.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Accepted"
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Command:
      type: object
      required: [action]
      properties:
        action:
          type: string
          example: club.upsert
        payload:
          type: object
          additionalProperties: true
    SyncResult:
      type: object
      properties:
        command_id: { type: string }
        status:
          type: string
          enum: [written, failed, queued]
        entity_id: { type: string }
        error: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
    Accepted:
      type: object
      properties:
        command_id: { type: string }
        status:
          type: string
          example: accepted
