openapi: 3.0.3
info:
  title: domain-api
  description: >
    Event-driven CRUD API. Reads are synchronous (straight from
    Postgres). Writes (POST/PUT/DELETE) are accepted asynchronously —
    they publish a command onto the event bus and return 202; the
    change is applied by domain-worker and won't be visible on a GET
    until it's processed.
  version: "1.0.0"
servers:
  - url: /
security:
  - apiKeyAuth: []
paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /users:
    get:
      summary: List users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Create a user (async — returns 202, not the created row)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a user by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      summary: Update a user (async — returns 202)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      summary: Delete a user (async — returns 202)
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /posts:
    get:
      summary: List published posts
      description: >
        Optional ?q= narrows the list to published posts whose title,
        excerpt or body contains the (case-insensitive, escaped,
        substring) query. Shape is identical with or without q.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Create a post (async — returns 202, not the created row)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreateInput"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /posts/slug/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a published post by slug
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /posts/id/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: >
        Get any post by id, drafts included — not for public browsing
        (no status filter). Exists so post-api can look up a post's
        current author_id before forwarding an edit/delete command;
        post-api itself already enforces ownership before calling
        this.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /posts/author/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List one author's posts (published AND drafts)
      description: >
        Trusted-caller read for post-api's profile views: returns the
        author's drafts too, so post-api must filter them from any
        response not addressed to the owner. Empty list for an author
        with no posts (never 404).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Update a post (async — returns 202)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdateInput"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      summary: >
        Delete a post (async — returns 202). Unusually for a DELETE,
        takes a JSON body: the caller (post-api) already validated
        author_id owns this post and passes it through here for the
        aggregate to check again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostDeleteInput"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /rooms:
    get:
      summary: List every room
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Create a room (async — returns 202, not the created row)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateInput"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /rooms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a room by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      summary: >
        Update a room — page turns AND open/close both go through
        this (async — returns 202). Bookclub-specific rules like
        "only the host may turn the page" are enforced by bookclub-api
        before it ever calls here, not by this aggregate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdateInput"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      summary: >
        Delete a room (async — returns 202). Takes a JSON body, same
        reasoning as DELETE /posts/{id}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomDeleteInput"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /rooms/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: >
        Server-Sent Events stream of this room's domain events
        (room.updated, message.created). Server-to-server only —
        bookclub-api's own process is the one subscriber, relaying
        onward to its browser WebSocket clients; a browser EventSource
        can't attach the required X-API-Key header itself.
      responses:
        "200":
          description: text/event-stream, never closes on its own
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /messages:
    get:
      summary: List a room's chat message history
      parameters:
        - name: room_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Send a chat message (async — returns 202, not the created row)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreateInput"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /deals:
    get:
      summary: List recently scraped deals
      description: >
        Newest first by posted_at (the source's own publish date),
        falling back to scraped_at. ?source= narrows to one source;
        ?limit= (1..200, default 50) caps the page.
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Deal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Ingest a scraped deal (async — returns 202, not the stored row)
      description: >
        Publishing a deal.upsert command; domain-worker decides insert
        vs update (identity is source + source_deal_id) and only a
        genuine insert ever raises deal.created downstream. Re-polls of
        the same deal are updates and are free of announcements.
        202 means "heard, queued", not "stored".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealUpsertInput"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /deals/{source}/{sourceDealID}:
    parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
      - name: sourceDealID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get one deal by its source identity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Deal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Required on every /users route. A valid key also exempts the
        request from the per-IP rate limit that otherwise applies to
        unauthenticated (401) attempts.
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
        title:
          type: string
        slug:
          type: string
        body_markdown:
          type: string
        excerpt:
          type: string
        cover_image_url:
          type: string
        type:
          type: string
          enum: [article, course]
        status:
          type: string
          enum: [draft, published]
        source:
          type: string
          enum: [native, imported]
        source_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
    PostCreateInput:
      type: object
      required: [author_id, title, body_markdown]
      properties:
        author_id:
          type: string
        title:
          type: string
        body_markdown:
          type: string
        excerpt:
          type: string
        cover_image_url:
          type: string
        type:
          type: string
          enum: [article, course]
        status:
          type: string
          enum: [draft, published]
    PostUpdateInput:
      type: object
      required: [author_id]
      properties:
        author_id:
          type: string
        title:
          type: string
        body_markdown:
          type: string
        excerpt:
          type: string
        cover_image_url:
          type: string
        status:
          type: string
          enum: [draft, published]
    PostDeleteInput:
      type: object
      required: [author_id]
      properties:
        author_id:
          type: string
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        host_id:
          type: string
        title:
          type: string
        document_id:
          type: string
        kind:
          type: string
          enum: [book, class]
          description: >
            Partitions this one shared aggregate between callers --
            "book" (bookclub-api's PDF rooms) or "class" (classroom-api's
            live screen/camera + notepad rooms). Defaults to "book" when
            omitted on create, matching every room created before this
            field existed.
        current_page:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoomCreateInput:
      type: object
      required: [host_id, title]
      properties:
        host_id:
          type: string
        title:
          type: string
        document_id:
          type: string
          description: Optional -- "" for classroom-api's rooms (no document).
        kind:
          type: string
          enum: [book, class]
          description: Optional, defaults to "book".
    RoomUpdateInput:
      type: object
      required: [host_id]
      properties:
        host_id:
          type: string
        title:
          type: string
        current_page:
          type: integer
        status:
          type: string
    RoomDeleteInput:
      type: object
      required: [host_id]
      properties:
        host_id:
          type: string
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        user_id:
          type: string
        user_name:
          type: string
        body:
          type: string
        requested_page:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
    MessageCreateInput:
      type: object
      required: [room_id, user_id, body]
      properties:
        room_id:
          type: string
          format: uuid
        user_id:
          type: string
        user_name:
          type: string
        body:
          type: string
        requested_page:
          type: integer
    Deal:
      type: object
      properties:
        source:
          type: string
        source_deal_id:
          type: string
        title:
          type: string
        url:
          type: string
        store:
          type: string
          nullable: true
        price_cents:
          type: integer
          nullable: true
        old_price_cents:
          type: integer
          nullable: true
        posted_at:
          type: string
          format: date-time
          nullable: true
        scraped_at:
          type: string
          format: date-time
        payload:
          type: object
          description: The source's own JSON, stored verbatim.
          additionalProperties: true
    DealUpsertInput:
      type: object
      required: [source, source_deal_id, title, url]
      properties:
        source:
          type: string
        source_deal_id:
          type: string
        title:
          type: string
        url:
          type: string
        store:
          type: string
          nullable: true
        price_cents:
          type: integer
          nullable: true
        old_price_cents:
          type: integer
          nullable: true
        posted_at:
          type: string
          format: date-time
          nullable: true
        scraped_at:
          type: string
          format: date-time
          nullable: true
        payload:
          type: object
          nullable: true
          additionalProperties: true
    Error:
      type: object
      properties:
        error:
          type: string
  responses:
    Accepted:
      description: Command accepted — applied asynchronously
      content:
        application/json:
          schema:
            type: object
            properties:
              command_id:
                type: string
                format: uuid
              status:
                type: string
                example: accepted
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: User not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many unauthenticated requests from this IP
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
