[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deals-common"
version = "0.1.0"
description = "Shared bits for the deals workers: HTTP client, raw-deal model, normalization, telemetry, the worker loop."
requires-python = ">=3.12"
dependencies = [
    # NOT here on purpose: scrapling's own runtime deps. scrapling 0.4.15
    # marks them optional but its fetchers import them unconditionally --
    # the consuming app's pyproject lists them explicitly instead, so
    # this package stays installable on its own (e.g. inside test venvs).
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[dev-dependencies]
pytest = ">=8.0"

[tool.hatch.build.targets.wheel]
packages = ["src/deals_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]