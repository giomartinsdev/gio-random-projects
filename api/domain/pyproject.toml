[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ".."

[[tool.mypy.overrides]]
module = "sqlmodel.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
# api/shared/ lives one level up (it's shared with sibling services, see
# api/README.md) — Docker COPYs it in at build time, but locally it's a
# sibling dir pytest/mypy won't find on their own without this.
pythonpath = [".."]
