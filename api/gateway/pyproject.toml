[tool.ruff]
target-version = "py314"
line-length = 100
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "T20", "SIM", "N", "Q", "RUF",
    "ASYNC", "S", "PTH", "ERA", "PL", "PERF", "ANN", "ARG", "RET", "TCH",
]
ignore = [
    "E501",  # line length — formatter handles this
    "S603",  # subprocess without shell=True
    "S607",  # starting a process with a partial path
    "B008",  # FastAPI's own DI idiom is Depends(...) as a default arg
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101", "PLR2004", "ANN"]
# Real container host/port come back from testcontainers at runtime,
# never hardcoded — see api/domain/pyproject.toml's identical note.
"app/tests/steps/**" = ["S101", "PLR2004", "ANN", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["app"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# api/shared/ lives one level up (Docker COPYs it in at build time, see
# api/README.md) — needs the parent dir on the search path same as
# pytest's pythonpath below. A per-directory executionEnvironments
# override was tried for app/tests here too and silently dropped this
# inherited setting for files under it (confirmed by testing against
# api/domain) — kept as one global setting instead.
extraPaths = [".."]

[[tool.pyright.executionEnvironments]]
# pytest-bdd step functions are only ever called by the @given/@when/@then
# decorator + scenarios() machinery, never referenced by name directly —
# reportUnusedFunction can't see that and flags every single one.
# extraPaths repeated here — a nested executionEnvironments block does
# NOT inherit the top-level one (see the note on `extraPaths` above).
root = "app/tests/steps"
reportUnusedFunction = false
# "." (not just "..") — the nested root above changes where imports
# resolve from, and app.* itself stopped resolving without the project
# root explicitly back on the path (confirmed against api/domain).
extraPaths = [".", ".."]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
# api/shared/ lives one level up (it's shared with sibling services, see
# api/README.md) — Docker COPYs it in at build time, but locally it's a
# sibling dir pytest/pyright won't find on their own without this.
pythonpath = [".."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]
