[tool.ruff]
target-version = "py312"
line-length = 100
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "T20", "SIM", "N", "Q", "RUF",
    "ASYNC", "S", "PTH", "ERA", "PL", "PERF", "ANN", "ARG", "RET", "TCH",
]
ignore = [
    "E501",  # line length — formatter handles this
    "S603",  # subprocess without shell=True
    "S607",  # starting a process with a partial path
    "B008",  # FastAPI's own DI idiom is Depends(...) as a default arg
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101", "PLR2004", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# api/shared/ lives one level up (Docker COPYs it in at build time, see
# api/README.md) — needs the parent dir on the search path same as
# pytest's pythonpath below. A per-directory executionEnvironments
# override was tried for app/tests here too and silently dropped this
# inherited setting for files under it (confirmed by testing against
# api/domain) — kept as one global setting instead.
extraPaths = [".."]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
# api/shared/ lives one level up (it's shared with sibling services, see
# api/README.md) — Docker COPYs it in at build time, but locally it's a
# sibling dir pytest/pyright won't find on their own without this.
pythonpath = [".."]
