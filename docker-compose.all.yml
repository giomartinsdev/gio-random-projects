# Convenience umbrella — brings up every infra subsystem at once via
# `docker compose -f docker-compose.all.yml up -d` from the repo root.
# Named .all.yml (not docker-compose.yml) on purpose: Openship auto-detects
# a root docker-compose.yml as THE project compose file, and its parser
# doesn't resolve `include:` — a plain docker-compose.yml here made it see
# zero services and fail every deploy. Each subsystem still deploys
# independently in Openship, pointed at its own subfolder.
include:
  - infra/cloudflared/docker-compose.yml
