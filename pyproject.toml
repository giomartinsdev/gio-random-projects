[tool.ruff]
target-version = "py314"
line-length = 100
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "T20", "SIM", "N", "Q", "RUF",
    "ASYNC", "S", "PTH", "ERA", "PL", "PERF", "ANN", "ARG", "RET", "TCH",
]
ignore = [
    "E501",  # line length — formatter handles this
    "S603",  # subprocess without shell=True
    "S607",  # starting a process with a partial path
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["flows"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["flows"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Absolute imports like `from flows.user_crud_test.client import ...`
# only resolve if the repo root itself is on the search path — pyright
# doesn't add the pyproject.toml's own directory to it automatically.
extraPaths = ["."]
# Prefect's @flow/@task and pytest-bdd's @given/@when/@then don't ship
# precise decorator typing — every decorated function trips this
# regardless of how the function itself is annotated, so it adds no
# real signal here.
reportUntypedFunctionDecorator = false

# pytest-bdd step functions are only ever called by the decorator/pytest
# machinery, never referenced by name — reportUnusedFunction can't see
# that and flags every single one. Scoped to each flow's tests/steps/
# dir specifically (not all of flows/) so this still catches genuine
# dead code everywhere else. Add one entry per new flow's steps dir.
[[tool.pyright.executionEnvironments]]
root = "flows/greeting/tests/steps"
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
root = "flows/user_crud_test/tests/steps"
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
root = "flows/bus_gps_poller/tests/steps"
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
root = "flows/brt_gps_poller/tests/steps"
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
root = "flows/vehicle_position_archiver/tests/steps"
reportUnusedFunction = false

[tool.pytest.ini_options]
# Tests live inside each flow's own tests/ folder (flows/<flow>/tests/),
# not a top-level tests/ dir — they're that flow's tests, not the repo's.
testpaths = ["flows"]
addopts = "--cov=flows --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["flows"]
omit = [
    "flows/*/tests/*",
    # A meta-import-hook instrumentation shim (wraps every flows.* method
    # in an OTel span at import time, see its own module docstring) —
    # every real test already exercises it implicitly just by importing
    # flows.* modules, but its exception-recording and async-wrapper
    # branches only fire for failures/coroutines none of the current
    # scenarios happen to trigger. Testing those branches would mean
    # asserting against OTel span internals, not this repo's own
    # behavior — not worth the fixture weight for what it'd catch.
    "flows/shared/auto_trace.py",
]
