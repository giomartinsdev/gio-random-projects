# observability — Prometheus, Loki, Tempo, Grafana e o coletor Alloy.
#
# ## O `alloy` (antigo `alloy-logs`)
#
# Entrou no diretório em 2026-10-23, quando deixou de ser só logs. Hoje ele é o
# coletor único de log, trace e métrica do cluster: `otelcol.receiver.otlp`
# (grpc 4317 + http 4318), `loki.source.kubernetes` e `loki.source.docker`.
#
# O nome do Deployment continua `alloy-logs` por histórico, mas o **Service** se
# chama `alloy` — é o nome que todos os apps já usam em
# `OTEL_EXPORTER_OTLP_ENDPOINT`. O Service saiu de `bridges/` no mesmo dia, ao
# ganhar selector (ver `alloy-service.yaml`).
#
# O container `alloy` em Docker FOI DESCOMISSIONADO em 2026-10-24, junto com o
# daemon: o `hostPath: /var/run/docker.sock` que ele montava deixou de existir.
# O `alloy-logs` (pods, via API do Kubernetes) é a única fonte de logs agora.
#
# ## O que ficou de fora
#
# Nada de observabilidade. O que ainda está em Docker (`ingress`, `registry`,
# `9router`, `tela-*`, `maus`) está descrito em `k8s/MIGRATION.md`.
#
# ## Estado
#
# `replicas: 0` em todos: os volumes têm dados reais (Prometheus 883M/15d,
# Loki 979M/7d, Tempo 233M/72h, Grafana 50M com grafana.db) e a cópia precisa ser
# feita com o container parado, num passo controlado. Subir vazio perderia o
# histórico e, no caso do Grafana, os usuários e dashboards criados na UI.
#
# ## Os nomes dos Services são os do Compose
#
# `prometheus`, `loki`, `tempo`, `grafana`. O alloy em Docker já fala
# `http://prometheus:9090`, `http://loki:3100` e `tempo:4317` — e continuará
# falando, sem editar o config dele. No cluster esses nomes são ClusterIP.
# (Do Docker, alcançar ClusterIP funciona; é a ponte que já está provada.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - prometheus.yaml
  - loki.yaml
  - tempo.yaml
  - grafana.yaml
  - dashboard.yaml
  - cluster-dashboard.yaml
  - alloy-logs.yaml
  - alloy-service.yaml
  - kube-state-metrics.yaml

commonLabels:
  app.kubernetes.io/part-of: giomartins

# Os quatro estão em 1: os volumes foram copiados com os containers parados e o
# procedimento religa o Docker antes de o pod subir, então o rollback segue de
# pé. Prometheus foi o primeiro a subir e provou o caminho (8.841 séries,
# 28.258 chunks, histórico do dia anterior legível).
#
# Rodar em paralelo ao container Docker é inofensivo: cada um tem o seu
# armazenamento, e o alloy ainda escreve no do Docker. O pod fica com o
# histórico até a cópia ser atualizada no cutover.
patches:
  - target:
      kind: Deployment
      name: prometheus
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: loki
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: tempo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
