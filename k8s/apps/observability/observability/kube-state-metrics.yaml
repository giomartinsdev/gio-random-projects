# kube-state-metrics — o estado DESEJADO dos objetos, que o cadvisor não sabe.
#
# ## Por que este componente existe
#
# O kubelet/cadvisor expõe consumo (CPU, memória, rede, restart de container):
# o que aconteceu. O kube-state-metrics expõe o objeto do Kubernetes: quantas
# réplicas o Deployment quer, quantas estão prontas, quantas já subiram alguma
# vez, se o PVC está Bound, se o Job falhou. São perguntas diferentes, e um
# dashboard de cluster que só tem consumo não responde "isto está saudável?".
#
# ## Por que não o chart do Helm
#
# O chart instala ServiceAccount, ClusterRole, Deployment e Service. Aqui são
# ~90 linhas de YAML versionado, com o mesmo resultado e sem mais uma
# dependência de release para auditar. O RBAC é o mínimo dos coletores
# habilitados abaixo.
#
# ## O que NÃO está habilitado
#
# `certificatesigningrequests`, `leases`, `storageclasses`, `volumeattachments`.
# São caros (uma série por objeto, por cluster) e não têm painel neste
# dashboard. Reabilitar é só tirar do --resources; o RBAC já cobre.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
rules:
  # Leitura. `list` + `watch` é como o informer funciona: um list inicial e
  # watch incremental. Sem `watch`, o kube-state-metrics lista uma vez e o
  # cluster "congela" no estado daquele instante.
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - resourcequotas
      - replicationcontrollers
      - limitranges
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - endpoints
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          # Digest, não tag: um `v2.13.0` pode ser republicado, um digest não.
          # arm64 explícito (o mirror do registry.k8s.io é multi-arch e o k3s
          # é arm64).
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics@sha256:888486e7e0a53aa7293b223bddc8db077c4bb7f7b41140f32aa04880a10c6c24
          args:
            - "--port=8080"
            - "--telemetry-port=8081"
            # Só os recursos com painel. Cada um adiciona séries: com os 30+
            # habilitados por padrão, um cluster pequeno gera dezenas de
            # milhares de séries e o Prometheus (limite 512Mi) sofre.
            - "--resources=nodes,pods,deployments,replicasets,statefulsets,daemonsets,jobs,cronjobs,persistentvolumeclaims,persistentvolumes,services,ingresses,namespaces"
            # `--metric-labels-allowlist` exporta labels do objeto como labels
            # da métrica. Sem isto, `kube_pod_info` tem o pod mas não o
            # `app.kubernetes.io/name` — e o dashboard não consegue agrupar
            # por app.
            - "--metric-labels-allowlist=pods=[app.kubernetes.io/name,app],namespaces=[kubernetes.io/metadata.name],deployments=[app.kubernetes.io/name,app],persistentvolumeclaims=[app.kubernetes.io/name,app]"
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: telemetry
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # Medido: ~25Mi em regime com os recursos acima. 128Mi é folga
              # para o pico do list inicial (que carrega todo o cluster de uma
              # vez antes do primeiro watch).
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
    - name: telemetry
      port: 8081
      targetPort: telemetry
