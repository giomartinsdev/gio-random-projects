# prometheus — métricas, recebidas por remote-write do alloy e por OTLP.
#
# Config copiada de stacks/observability/prometheus.yml SEM alteração. Os
# targets são `alloy:12345`, `grafana:3000`, `loki:3100`, `tempo:3200` e
# `localhost:9090` — todos resolvem no cluster porque cada Service tem
# exatamente o nome do Compose. É o retorno do "DNS como interruptor".
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: alloy
        static_configs:
          - targets: ["alloy:12345"]

      - job_name: grafana
        static_configs:
          - targets: ["grafana:3000"]

      - job_name: loki
        static_configs:
          - targets: ["loki:3100"]

      - job_name: tempo
        static_configs:
          - targets: ["tempo:3200"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]

      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter:9100"]
        # O node-exporter é o ÚNICO lugar com disco/memória/load do HOST: o k3s
        # não habilita o coletor `node` do kubelet. Sem ele, "o disco está
        # enchendo?" é pergunta sem resposta.
        #
        # O filtro de mountpoint fica no EXPORTER
        # (`--collector.filesystem.mount-points-include`), não aqui. Um `keep`
        # neste job descartaria toda série sem label `mountpoint` — CPU,
        # memória e load — e só o filesystem chegaria no Prometheus. Medido.

      # ## O kubelet `/metrics` — os volumes dos PVCs
      #
      # Diferente do cadvisor: este endpoint tem `kubelet_volume_stats_*`, o
      # disco REAL de cada PVC (usado, disponível, inodes) reportado pelo
      # kubelet. É o que responde "o volume do postgres está enchendo?".
      #
      # O `/metrics` do kubelet no k3s não traz `node_cpu_*`/`node_memory_*`
      # (coletor de nó desabilitado) — para isso serve o node-exporter. Aqui só
      # interessam as métricas de volume.
      - job_name: kubelet
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets: ["10.0.0.209:10250"]
        metric_relabel_configs:
          # O `/metrics` do kubelet tem ~1000 séries de apiserver/etcd/runtime
          # que ninguém aqui usa. Manter só volume_stats e log filesystem.
          - source_labels: [__name__]
            regex: "kubelet_volume_stats_.*|kubelet_container_log_filesystem_used_bytes"
            action: keep

      # ## O kubelet, via cadvisor — e por que este job existe
      #
      # O kubelet devolve 401 sem bearer token. Em vez de montar Secret com
      # token, o RBAC (`nodes/proxy: get`) autoriza o Prometheus a falar direto
      # no `:10250` com o token do próprio SA, montado pelo
      # `automountServiceAccountToken: true`. Medido: `up == 1` com este setup.
      #
      # Só `metrics_path: /metrics/cadvisor` é usado. O `/metrics` do kubelet
      # no k3s NÃO traz `node_cpu_seconds_total` / `node_memory_*` (o k3s
      # desabilita o coletor de nó), então um job separado só gastaria scrape.
      # Capacidade do nó vem de `kube_node_status_capacity` (KSM) e consumo de
      # pod vem daqui.
      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets: ["10.0.0.209:10250"]
        metric_relabel_configs:
          # ## Quais séries de `namespace=""` sobrevivem
          #
          # O cadvisor emite série por cgroup: `system.slice`, `kubepods.slice`,
          # `kubepods-besteffort.slice`, ... Todas têm `namespace=""` e nenhum
          # painel as usa — o dashboard agrupa por namespace/pod. Cortá-las tira
          # ~40% das séries.
          #
          # **Exceção: `container_fs_*`.** O disco do host é reportado por
          # DEVICE (`device="/dev/sda1"`), não por pod — logo `namespace=""`
          # sempre. É a única fonte de disco do host no cadvisor (85.7GB de
          # 206.9GB medidos). Cortar por namespace apagaria justamente o número
          # que o dashboard de alerta precisa. O relabel abaixo preserva essas
          # séries e só derruba as demais de `namespace=""`.
          #
          # A tentação era filtrar por `container=""`. **Errado**: as métricas
          # de REDE (`container_network_*`) são medidas no sandbox do pod e têm
          # `container=""` SEMPRE, inclusive nas séries boas. Filtrar por
          # `container` apagou 100% de `container_network_receive_bytes_total`
          # e o painel de rede ficou `No data` com o scrape `up`.
          - source_labels: [__name__, namespace]
            regex: "container_fs_.*;.*"
            action: keep
          - source_labels: [namespace]
            regex: ""
            action: drop
          # `image` no cadvisor carrega o digest completo, que muda a cada push.
          # Como label de série isso estoura a cardinalidade; o painel usa o
          # nome do container.
          - regex: "image"
            action: labeldrop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
---
# O Prometheus precisa de UM verbo: `get` em `nodes/proxy`. É o que autoriza
# raspar o kubelet/cadvisor pela API. Nada de `pods` (quem lista pod é o
# kube-state-metrics e o alloy), nada de `secrets`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-kubelet-scrape
  labels:
    app.kubernetes.io/name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/proxy"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # A API de discovery é o que o Prometheus usa se um dia trocarmos os targets
  # estáticos por `kubernetes_sd_configs`. Já fica concedido para não exigir
  # outra rodada de RBAC.
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-kubelet-scrape
  labels:
    app.kubernetes.io/name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-kubelet-scrape
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    app.kubernetes.io/name: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      # O volume Docker está em 883M. 5Gi dá espaço para a retenção de 15d
      # crescer sem um alerta por falta de disco — o host tem 136G livres.
      #
      # Com cadvisor + kube-state-metrics o volume cresce mais rápido (~2500
      # séries novas), mas 5Gi segue folgado: a 15d de retenção a projeção é
      # ~1.5Gi.
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 0
  # `Recreate`, não `RollingUpdate`. O PVC é `ReadWriteOnce`: durante um
  # rolling update os dois pods tentam montar o mesmo volume e o novo falha
  # com `lock DB directory: resource temporarily unavailable`. Recreate para o
  # antigo antes de subir o novo — para um Prometheus de nó único, não há
  # perda real, só ~20s sem scrape.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      # O token do SA precisa existir como arquivo para o `credentials_file` do
      # scrape do kubelet. No k8s >= 1.24 ele não é montado por padrão.
      serviceAccountName: prometheus
      automountServiceAccountToken: true

      # O Compose roda `user: "0"`. O volume do Prometheus tem arquivos do
      # root, e o processo precisa escrever no WAL. Trocar o UID exigiria
      # `chown` nos dados copiados; fora do escopo desta fatia.
      securityContext:
        runAsUser: 0
      containers:
        - name: prometheus
          image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            # Sem esta flag o remote-write do alloy e do tempo leva 404. É o
            # único motivo de o Prometheus receber métrica empurrada em vez de
            # ser raspado — não é opcional.
            - "--web.enable-remote-write-receiver"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              # Mesmo limite do Compose (mem_limit 512m). O Prometheus não
              # devolve memória ao SO com facilidade; sem limite ele cresce
              # até o OOM do node, derrubando vizinhos.
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
