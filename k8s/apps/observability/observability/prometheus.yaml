# prometheus — métricas, recebidas por remote-write do alloy e por OTLP.
#
# Config copiada de stacks/observability/prometheus.yml SEM alteração. Os
# targets são `alloy:12345`, `grafana:3000`, `loki:3100`, `tempo:3200` e
# `localhost:9090` — todos resolvem no cluster porque cada Service tem
# exatamente o nome do Compose. É o retorno do "DNS como interruptor".
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: alloy
        static_configs:
          - targets: ["alloy:12345"]

      - job_name: grafana
        static_configs:
          - targets: ["grafana:3000"]

      - job_name: loki
        static_configs:
          - targets: ["loki:3100"]

      - job_name: tempo
        static_configs:
          - targets: ["tempo:3200"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]

      # ## O kubelet, por proxy — e por que não `https://<node>:10250` direto
      #
      # O kubelet responde 401 sem token válido. Em vez de montar um
      # `bearer_token_file` (que exige um Secret com o token do SA do
      # Prometheus), a API do Kubernetes faz o proxy: `/api/v1/nodes/<node>/proxy`
      # autentica com o token do SA do Prometheus, e o Prometheus só precisa de
      # RBAC (`nodes/proxy: get`). É o mesmo padrão do prometheus-operator, com
      # menos peça móvel.
      #
      # `role: pod` (cadvisor) dá CPU/mem/rede por container com `namespace` e
      # `pod` nos labels; `role: node` (kubelet) dá o `/metrics` do kubelet,
      # usado só para o painel de "kubelet está coletando?".
      - job_name: kubelet
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets: ["10.0.0.209:10250"]

      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets: ["10.0.0.209:10250"]
        metric_relabel_configs:
          # O cadvisor emite uma série por cgroup (system.slice, kubepods.slice,
          # kubepods-besteffort.slice, ...) com `container=""`. São ~40% das
          # séries e nenhum painel as usa: o dashboard agrupa por namespace/pod.
          - source_labels: [container]
            regex: ""
            action: drop
          - source_labels: [id]
            regex: "/"
            action: drop
          # `image` no cadvisor carrega o digest completo, que muda a cada push.
          # Como label de série isso estoura a cardinalidade; o painel usa o
          # nome do container.
          - regex: "image"
            action: labeldrop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
---
# O Prometheus precisa de UM verbo: `get` em `nodes/proxy`. É o que autoriza
# raspar o kubelet/cadvisor pela API. Nada de `pods` (quem lista pod é o
# kube-state-metrics e o alloy), nada de `secrets`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-kubelet-scrape
  labels:
    app.kubernetes.io/name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/proxy"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # A API de discovery é o que o Prometheus usa se um dia trocarmos os targets
  # estáticos por `kubernetes_sd_configs`. Já fica concedido para não exigir
  # outra rodada de RBAC.
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-kubelet-scrape
  labels:
    app.kubernetes.io/name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-kubelet-scrape
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    app.kubernetes.io/name: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      # O volume Docker está em 883M. 5Gi dá espaço para a retenção de 15d
      # crescer sem um alerta por falta de disco — o host tem 136G livres.
      #
      # Com cadvisor + kube-state-metrics o volume cresce mais rápido (~2500
      # séries novas), mas 5Gi segue folgado: a 15d de retenção a projeção é
      # ~1.5Gi.
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      # O token do SA precisa existir como arquivo para o `credentials_file` do
      # scrape do kubelet. No k8s >= 1.24 ele não é montado por padrão.
      serviceAccountName: prometheus
      automountServiceAccountToken: true

      # O Compose roda `user: "0"`. O volume do Prometheus tem arquivos do
      # root, e o processo precisa escrever no WAL. Trocar o UID exigiria
      # `chown` nos dados copiados; fora do escopo desta fatia.
      securityContext:
        runAsUser: 0
      containers:
        - name: prometheus
          image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            # Sem esta flag o remote-write do alloy e do tempo leva 404. É o
            # único motivo de o Prometheus receber métrica empurrada em vez de
            # ser raspado — não é opcional.
            - "--web.enable-remote-write-receiver"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              # Mesmo limite do Compose (mem_limit 512m). O Prometheus não
              # devolve memória ao SO com facilidade; sem limite ele cresce
              # até o OOM do node, derrubando vizinhos.
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
