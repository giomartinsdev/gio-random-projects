        {
          "id": 9,
          "title": "Disco: uso vs total",
          "description": "Uso do filesystem raiz ao longo do tempo, com o total como referência. Medido: 41.57% de 192.69 Gi.\n\nA inclinação importa mais que o valor: 42% subindo 1%/dia dá 58 dias; parado, não é problema. Como o `local-path` guarda os 15 PVCs no MESMO filesystem, um pod que enche o volume enche este gráfico.",
          "type": "timeseries",
