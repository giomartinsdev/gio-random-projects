# Dashboard de ALERTA — os big numbers que dizem se algo vai dar merda.
#
# ## Por que um terceiro dashboard
#
#   `apps-overview`    → "a minha aplicação está funcionando?"
#   `cluster-overview` → "o cluster está saudável?" (detalhe, por pod)
#   `alerts-overview`  → **"estou prestes a ter um problema?"** (este)
#
# Os três respondem perguntas diferentes. Este é o que você abre de manhã e
# fecha em 5 segundos: se todos os números estão verdes, nada mais importa.
# Tem threshold em todos os painéis, então a cor já é o veredito.
#
# ## Todos os números foram MEDIDOS no cluster vivo (2026-10-24)
#
# Medir antes de escrever não é preciosismo aqui: três queries deste dashboard
# teriam ficado vazias ou erradas por suposição — `kubelet_volume_stats_*`
# reporta o FS do host para os 15 PVCs (não quota), `node_load1` não tem
# `/` por core, e o `local-path` não impõe limite por volume.
#
#   cpu usado        24.99%   (de 4 cores)
#   memória usada    25.81%   (de 23.41 Gi allocatable)
#   disco /          41.57%   (112.6 Gi livres de 192.69)
#   load1            1.91
#   pods             56 (55 Running, 1 não-ready = CronJob transitório)
#   restarts         90
#   PVCs             15/15 Bound, quota total 73.25 Gi
#   limits memória   17.38 Gi de 23.41 allocatable (74% de overcommit)
#   limits cpu       2.0 de 4.0 cores (50%)
#   uso real (pods)  6.2 Gi de memória, 0.18 cores
#   logs no disco    0.12 GB
#
# ## O que NÃO existe aqui (e por quê)
#
# O k3s desabilita o coletor `node` do kubelet. `node_cpu_*`, `node_memory_*` e
# `node_filesystem_*` só existem porque o `node-exporter` roda como DaemonSet
# lendo /proc e /sys do host. Sem ele, metade deste dashboard seria `No data`.
#
# ## Alertas: ainda não há canal
#
# Os thresholds abaixo são VISUAIS: mudam a cor do painel, não mandam
# mensagem. O Grafana 12.4.3 tem Unified Alerting ativo, mas nenhum contact
# point configurado — um alerta sem canal não avisa ninguém. Quando decidir
# onde receber (Telegram, Discord, e-mail), o passo é criar o contact point e
# as regras apontando para as mesmas queries daqui.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-alerts-overview
  labels:
    app.kubernetes.io/name: grafana
data:
  alerts-overview.json: |
    {
      "title": "Alertas — big numbers",
      "uid": "alerts-overview",
      "tags": [
        "observability",
        "alerts",
        "sre"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "links": [
        {
          "title": "Cluster k3s",
          "url": "/d/cluster-overview",
          "type": "link",
          "icon": "external link",
          "targetBlank": false
        },
        {
          "title": "Apps Overview",
          "url": "/d/apps-overview",
          "type": "link",
          "icon": "external link",
          "targetBlank": false
        }
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Veredito — está tudo bem?",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "CPU do host",
          "description": "Uso real de CPU do HOST (node-exporter). Medido: 24.99% de 4 cores. Acima de 80% por tempo prolongado, os pods começam a sofrer throttling e a latência p95 das apps sobe antes de qualquer erro aparecer.",
          "type": "gauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * sum(rate(node_cpu_seconds_total{mode!=\"idle\"}[5m])) / sum(rate(node_cpu_seconds_total[5m]))",
              "instant": true
            }
          ]
        },
        {
          "id": 2,
          "title": "Memória do host",
          "description": "Memória usada no HOST (total - available, que conta page cache reivindicável como livre). Medido: 25.81% de 23.41 Gi. Acima de 90% o OOM killer começa a matar pod — e ele escolhe pela soma de limits, não pelo uso real.",
          "type": "gauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "title": "Disco / (host)",
          "description": "Disco raiz do HOST (node-exporter). Medido: 41.57%, 112.6 Gi livres de 192.69 Gi. É o número mais importante deste dashboard: disco cheio derruba o k3s inteiro (etcd não escreve, container não sobe), e enche sem aviso — o local-path guarda TODOS os 15 PVCs neste mesmo filesystem.",
          "type": "gauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})",
              "instant": true
            }
          ]
        },
        {
          "id": 4,
          "title": "Load (1 min)",
          "description": "Load average de 1 minuto do HOST. Medido: 1.91 em 4 cores (48% de ocupação). Em Linux, load conta processo em fila por CPU E por disco: load alto com CPU baixa significa I/O travado, não processamento.",
          "type": "gauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 4
                  },
                  {
                    "color": "red",
                    "value": 8
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_load1",
              "instant": true
            }
          ]
        },
        {
          "id": 5,
          "title": "Pods não-ready",
          "description": "Containers cujo readinessProbe falha. Medido: 1 — um CronJob transitório (rke2-machineconfig-cleanup), não uma app. O Service tira um pod não-ready do balanceamento antes de ele cair, então >0 por minutos é sinal de degradação iminente.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 4
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(kube_pod_container_status_ready == 0) or vector(0)",
              "instant": true
            }
          ]
        },
        {
          "id": 6,
          "title": "Deployments incompletos",
          "description": "Deployments cujo número de réplicas prontas é menor que o desejado. Medido: 0. É o painel que pega o caso em que o ArgoCD está `Synced Healthy` mas a app não tem capacidade — o ArgoCD compara o manifesto, não o status do rollout.",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(kube_deployment_spec_replicas - kube_deployment_status_replicas_ready > 0) or vector(0)",
              "instant": true
            }
          ]
        },
        {
          "id": 101,
          "type": "row",
          "title": "Recursos — uso real vs o que o git promete",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "panels": []
        },
        {
          "id": 7,
          "title": "Memória: uso real / limits / allocatable",
          "description": "Três linhas que respondem \"cabe mais coisa aqui?\": uso real (cadvisor, working_set), soma dos LIMITS declarados no git, e o allocatable do nó (KSM). Medido: 6.2 Gi de uso, 17.38 Gi de limits, 23.41 Gi allocatable.\n\nUso muito abaixo dos limits é normal (limit é teto, não reserva). O que importa é limits encostando no allocatable: aí o OOM killer fica a um pico de distância, e ele mata o pod de maior soma de limits — não o que está usando mais.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "limits (git)"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        10,
                        10
                      ],
                      "fill": "dash"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "allocatable (nó)"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        2,
                        4
                      ],
                      "fill": "dash"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(container_memory_working_set_bytes{container!=\"\"})",
              "legendFormat": "uso real"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_pod_container_resource_limits{resource=\"memory\"})",
              "legendFormat": "limits (git)"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(kube_node_status_allocatable{resource=\"memory\"})",
              "legendFormat": "allocatable (nó)"
            }
          ]
        },
        {
          "id": 8,
          "title": "CPU: uso real / limits / allocatable",
          "description": "Mesma leitura do painel de memória, em cores. Medido: 0.18 cores em uso, 2.0 de limits, 4.0 allocatable.\n\nCPU é compressível: bater no limit gera throttling (latência sobe), não kill. Por isso o alerta de CPU é menos urgente que o de memória — mas throttling em app Go aparece como p99 alto antes de qualquer erro.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "limits (git)"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        10,
                        10
                      ],
                      "fill": "dash"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "allocatable (nó)"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        2,
                        4
                      ],
                      "fill": "dash"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
