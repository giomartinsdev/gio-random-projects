          "id": 20,
          "title": "Top pods — crescimento de memória (15 min)",
          "description": "Quanto a memória de cada pod cresceu nos últimos 15 min. É o detector de vazamento que funciona com histórico curto.\n\n**Por que não `predict_linear` em 7 dias:** medido neste cluster, a projeção devolvia 70.6% de disco em QUALQUER janela (1h a 24h) e -588% para memória. O Prometheus tinha apenas 15 min de histórico (reiniciou várias vezes durante a instalação do node-exporter), e `predict_linear` com 2 pontos é ruído multiplicado. Uma projeção que dá -588% é pior que não ter projeção: dá falsa confiança.\n\nCom 6h+ de histórico, trocar por `predict_linear(...[6h], 7*24*3600)` é uma linha. Até lá, crescimento absoluto é o sinal honesto.\n\nMedido: prometheus +395.8 Mi (pico do restart), loki +26.9 Mi, 9router +14.9 Mi.",
