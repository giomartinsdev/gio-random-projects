        {
          "id": 22,
          "title": "Runbook",
          "type": "text",
          "datasource": {
            "type": "datasource",
            "uid": "grafana"
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 45
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "mode": "markdown",
            "content": "# Runbook — por painel vermelho\n\n## Disco / acima de 75%\n\n1. **O que está crescendo?** `ssh ubuntu@168.138.135.6` e:\n   ```\n   sudo du -sh /var/lib/rancher/k3s/storage/*/ | sort -hr | head\n   sudo du -sh /var/log/pods/* 2>/dev/null | sort -hr | head\n   ```\n2. **Log de container é o campeão habitual.** Confira *Logs acumulados no disco*: se passar de 5GB, um pod está em CrashLoop escrevendo sem parar. Ache-o em *Restarts acumulados* subindo + dashboard **Cluster k3s** → *Restarts por pod*.\n3. **Imagem órfã:** `sudo k3s crictl rmi --prune` (remove imagem sem container usando).\n4. **`/var/lib/rancher/k3s/storage` inchar** sem PVC novo = um volume cresceu. `du` no passo 1 diz qual.\n5. **Não apague PVC para liberar espaço** — `prune` do ArgoCD recria vazio e você perde o dado.\n\n## Memória acima de 90%\n\n1. **Quem come:** *Memória por pod* no dashboard **Cluster k3s**.\n2. **Compare com limits:** o OOM killer escolhe pela soma de limits, não pelo uso. Um pod com `limits.memory: 4Gi` e uso de 100Mi é o primeiro candidato. Reduzir o limit no git (`k8s/apps/...`) é o conserto.\n3. **Cache não conta:** `MemAvailable` já desconta page cache reivindicável. Se está em 90%, é memória de verdade.\n4. **Vazamento lento:** *Top pods — crescimento de memória*. Com 6h+ de histórico, `predict_linear` em 7 dias passa a valer (hoje não: o Prometheus tem 15 min).\n\n## CPU acima de 85%\n\n1. **Throttling, não morte.** CPU é compressível: o kernel limita o pod, não mata. O sintoma é p99 alto no **Apps Overview**.\n2. **Quem consome:** *CPU por pod* no **Cluster k3s**. Compare com `limits.cpu` do manifesto.\n3. **Load alto com CPU baixa** → não é CPU, é I/O. Veja *iowait* e *I/O de disco*.\n\n## Deployments incompletos > 0\n\n1. `sudo kubectl -n <ns> get pods | grep -v Running`\n2. `sudo kubectl -n <ns> describe pod <pod>` → seção `Events`.\n3. **ArgoCD `Synced Healthy` + réplica faltando** é normal: o ArgoCD compara manifesto, não rollout. O dashboard **Cluster k3s** → *Réplicas: desejadas vs prontas* é a fonte de verdade.\n\n## Targets de scrape caindo\n\n| Target | O que some | Conserto |\n|---|---|---|\n| `node-exporter` | disco, CPU, memória e load do host (metade deste dashboard) | DaemonSet do node-exporter: pod, hostPath, porta 9100 ocupada |\n| `cadvisor` | CPU/memória/rede por pod | token do SA, RBAC `nodes/proxy`, kubelet em :10250 |\n| `kube-state-metrics` | réplicas, PVC, restarts | pod do KSM, ou RBAC sem `list/watch` |\n| `kubelet` | log filesystem | RBAC, :10250 |\n\n**Cego não é saudável.** Se um target cai, o painel correspondente fica vazio — e vazio parece \"zero, tudo bem\".\n\n## O dado que NÃO existe (e a tentação de inventar)\n\n- **Projeção de disco/memória em 7 dias:** `predict_linear` precisa de histórico longo. Medido aqui: com 15 min de série ele devolvia 70.6% fixo para disco (em qualquer janela) e **-588%** para memória. Um número desses é pior que nenhum. Quando o Prometheus tiver dias de histórico, predict_linear(node_filesystem_avail_bytes[6h], 7*24*3600) volta a ser a query certa.\n- **Uso de disco por PVC:** o provisioner `local-path` não cria quota. O PV é um diretório no FS do host, e o kubelet reporta o uso do **filesystem inteiro** para todos os PVCs. Medido: os 15 retornavam 80.05/192.69 Gi (o mesmo `df /`), enquanto o `du` real era 12G, 2.5G, 993M, 939M. Use `du` no host.\n- **Load por core:** não é uma métrica, é uma razão. `node_load1 / 4` é cálculo no painel, não série.\n- **Filesystem por mountpoint além do `/`:** o exporter está com `--collector.filesystem.mount-points-include=^/$`. Os loop devices do snap enchem e esvaziam sozinhos e fariam o alerta disparar à toa.\n\n## Quando você configurar o canal de alerta\n\nO Grafana 12.4.3 já tem Unified Alerting ativo, sem contact point. O caminho curto:\n\n1. *Alerting → Contact points → New* (Telegram, Discord ou e-mail).\n2. *Alert rules → New* apontando para as queries dos painéis acima, com `for: 10m` (evita ruído de pico).\n3. Os thresholds deste dashboard são visuais. Copiar os mesmos números para as regras mantém a cor e a notificação coerentes — um alerta que discorda do painel destrói a confiança nos dois.\n\nSugestão de regras mínimas: disco > 80% por 15m, memória > 90% por 10m, `Deployments incompletos > 0` por 15m, `Targets de scrape < 9` por 5m (este último é o mais importante: sem ele, os outros não têm como avisar)."
