        {
          "id": 10,
          "title": "Quota de PV por volume",
          "description": "Quota declarada de cada PersistentVolume (spec.capacity), do KSM. Total medido: 73.25 Gi em 15 volumes.\n\n**Não existe painel de \"uso por PVC\" — e é de propósito.** O provisioner `local-path` não cria quota: o PV é um diretório no filesystem do host, então `kubelet_volume_stats_used_bytes` reporta o uso do FS INTEIRO para todos os PVCs. Medido nos 15: exatamente 80.05/192.69 Gi, enquanto o `du` real era 12G (registry), 2.5G (postgres), 993M (loki), 939M (prometheus), 51M (grafana).\n\nPara uso real por volume só com `hostPath` no node-exporter por diretório, ou trocando o provisioner. Este painel mostra o que é honesto: quem pode crescer até quanto.",
          "type": "bargauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
