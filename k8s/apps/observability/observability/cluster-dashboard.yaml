        {
          "id": 23,
          "title": "Receitas de diagnóstico",
          "type": "text",
          "datasource": { "type": "datasource", "uid": "grafana" },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 56 },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "options": {
            "mode": "markdown",
            "content": "# Diagnóstico a partir deste dashboard\n\n## A app está de pé mas o cluster não\n\n1. **Deployment com réplica faltando** → painel *Réplicas: desejadas vs prontas*. Ordenado por `faltando`. Se `faltando > 0`, o ArgoCD pode estar `Synced Healthy` e a app mesmo assim sem capacidade.\n2. **Pod reiniciando** → *Restarts por pod*. Um pod com centenas de restarts é CrashLoopBackOff. Veja o log dele no **Apps Overview** (filtro de Container).\n3. **PVC Pending** → *PVC — fase e capacidade*. Deployment preso esperando disco nunca fica Ready.\n\n## O cluster está lento\n\n1. **Memória** → *Memória por pod*. Cruze com `resources.limits` do manifesto em `k8s/apps/`.\n2. **CPU** → *CPU por pod*. Batendo no limit = throttling, e a latência p95 aparece no **Apps Overview** antes do erro.\n3. **Nome do namespace** → *Memória usada por namespace* mostra qual fatia está crescendo.\n\n## Nada aparece, mas a app responde\n\nÉ o caso mais traiçoeiro: os painéis ficam vazios e o cluster está bem. Olhe **Scrape health**:\n\n| target down | consequência | o que consertar |\n|---|---|---|\n| `cadvisor` | memória/CPU/rede por pod somem | token do SA, RBAC `nodes/proxy`, `:10250` inalcançável |\n| `kube-state-metrics` | réplicas, PVC, restarts somem | pod do KSM, ou RBAC sem `list/watch` nos recursos |\n| `prometheus` | tudo some | o próprio Prometheus |\n\n## O dado que NÃO existe aqui\n\nO k3s não habilita o coletor `node` do kubelet. **Não há** `node_cpu_seconds_total`, `node_memory_*` nem `node_load*` neste cluster. Por isso:\n\n- *Memória: uso vs capacidade* compara consumo real (cadvisor) com `kube_node_status_allocatable` (KSM).\n- Não existe painel de load average — inventar um exigiria instalar `node-exporter`.\n\n## Queries prontas (Explore → Prometheus)\n\n| Query | Para quê |\n|---|---|\n| `topk(10, sum by (pod) (container_memory_working_set_bytes{namespace=\"applications\", container!=\"\"}))` | quem come memória nas apps |\n| `kube_deployment_spec_replicas != on(namespace,deployment) kube_deployment_status_replicas_ready` | Deployments incompletos |\n| `kube_pod_container_status_restarts_total > 0` | pods que já reiniciaram |\n| `sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (namespace)` | CPU por namespace |\n| `kube_persistentvolumeclaim_status_phase{phase!=\"Bound\"}` | PVC fora do normal |"
          },
          "targets": []
        }
      ]
    }
