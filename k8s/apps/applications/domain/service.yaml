# Service do domain-api.
#
# `type: NodePort` serve os dois consumidores com UMA porta:
#
#   - ClusterIP 8000 continua existindo (todo NodePort também é ClusterIP).
#     É por ele que finance-api e os workers falam `domain-api:8000` pelo DNS
#     do cluster, o mesmo nome que usavam na rede `apps` do Docker.
#
#   - NodePort 30800 é só para o ingress do host alcançar o pod. Segue a
#     convenção das outras migrações (8023→30023, 8092→30092): 80xx→308xx.
#     Não usei 30080 porque é do ArgoCD — um NodePort já ocupado faz o Service
#     ficar OutOfSync no ArgoCD sem aplicar, e o teste de fumaça ainda responde
#     200 (do ArgoCD), o que dá um falso positivo perigoso.
#
# Não são duas entradas de porta: um Service não pode ter dois `port` com o
# mesmo número. O NodePort é uma segunda *forma de alcançar* a mesma porta.
apiVersion: v1
kind: Service
metadata:
  name: domain-api
  labels:
    app.kubernetes.io/name: domain-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: domain-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
