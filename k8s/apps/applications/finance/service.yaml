# Service do finance-api.
#
# ClusterIP: consumido por finance-openfinance-worker e
# finance-customersupport-worker (FINANCE_API_BASE_URL=http://finance-api:8000)
# e por nada de fora. O ingress continua na 8018 do Docker.
#
# O finance-openfinance-worker também tem Service, porque o finance-api chama
# `finance-openfinance-worker:8088` — ver service-worker.yaml.
apiVersion: v1
kind: Service
metadata:
  name: finance-api
  labels:
    app.kubernetes.io/name: finance-api
spec:
  # NodePort para o ingress alcancar o pod. 8018 -> 30818 (convencao 80xx->308xx).
  # O ClusterIP 8000 continua valendo: finance-workers e qualquer pod falam
  # `finance-api:8000` pelo DNS do cluster, como faziam na rede `apps`.
  type: NodePort
  selector:
    app.kubernetes.io/name: finance-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30818
