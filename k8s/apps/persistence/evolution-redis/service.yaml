# Service `evolution-redis` — o nome que o evolution-api já usa.
#
# ## Por que este arquivo existe e ainda NÃO está em `resources`
#
# Dois Services com o mesmo nome no mesmo namespace não coexistem. Enquanto o
# `evolution-api` fala `redis://evolution-redis:6379/6`, esse nome pertence ao
# Service-ponte de `k8s/apps/bridges/`, sem selector, cujo EndpointSlice é
# escrito pelo timer do host.
#
# Este arquivo fica no disco, sem estar em `resources`, até a janela. No corte,
# `kustomization.yaml` descomenta a linha e `bridges/evolution-redis.yaml` sai
# no MESMO commit — junto com a entrada `evolution-redis` do `MAPA` do timer.
#
# ## Sem senha, de propósito
#
# O Redis do Compose não tem `requirepass`: a barreira é a rede `apps`. Este
# Service é ClusterIP e não tem NodePort, então o alcance continua sendo só
# dentro do cluster — que agora inclui os pods, e não mais a bridge do Docker.
#
# Se um dia houver senha, ela entra por `Secret` e o `CACHE_REDIS_URI` do
# evolution-api muda junto. Não é o caso hoje, e migração não é lugar de
# introduzir autenticação nova: mudaria duas coisas ao mesmo tempo.
apiVersion: v1
kind: Service
metadata:
  name: evolution-redis
  labels:
    app.kubernetes.io/name: evolution-redis
spec:
  # Selector, não ponte. Tem de casar com o label do Deployment; um typo aqui
  # gera Service com zero endpoints — o modo de falha mais silencioso desta
  # migração (o ArgoCD mostra `Healthy`).
  selector:
    app.kubernetes.io/name: evolution-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
