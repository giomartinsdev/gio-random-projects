# rabbitmq — broker AMQP (fatia 5).
#
# O Service mora aqui, e não em `k8s/apps/bridges/`, porque a migração do
# broker é justamente a troca da ponte por um Service com selector. Ver o
# comentário equivalente em `k8s/apps/minio/kustomization.yaml` para o
# raciocínio completo (dois Services com o mesmo nome não coexistem; um Service
# com selector ao lado de um EndpointSlice manual é a armadilha 6).
#
# Em 2026-10-23 os quatro consumidores já estavam no cluster, então a ponte pôde
# ser trocada pelo Service com selector. O Service entrou no MESMO commit que
# `git rm k8s/apps/bridges/rabbitmq.yaml`: remover a ponte sem o Service
# derrubaria todos os consumidores de uma vez.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: persistence

resources:
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: giomartins
