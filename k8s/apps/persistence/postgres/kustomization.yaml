# postgres — o banco de tudo (fatia 6).
#
# ## A troca é atômica, e este é o commit dela
#
# O Service `postgres` existia no cluster como PONTE (`k8s/apps/bridges/`,
# sem selector, EndpointSlice escrito pelo timer). Dois Services com o mesmo
# nome não coexistem. Então este commit faz três coisas juntas:
#
#   1. `git rm k8s/apps/bridges/postgres.yaml`  (a ponte sai)
#   2. `service.yaml` entra em `resources`          (o Service com selector entra)
#   3. `replicas: 1` no Deployment                  (já feito no commit anterior)
#
# Remover a ponte sem o Service derrubaria de uma vez os 9 consumidores:
# `domain-api`, `domain-worker`, `finance-api`, `finance-customersupport-worker`,
# `finance-openfinance-worker`, `vaultwarden-api`, `adminer`, `db-mcp`,
# `evolution-api`.
#
# ## O timer das pontes
#
# `sync-external-endpoints.sh` também perdeu a entrada `postgres`. Se ficasse,
# ele recriaria o EndpointSlice manual a cada minuto e o kube-proxy balancearia
# entre o POD e o CONTAINER — metade das conexões iria para o banco antigo.
# Foi exatamente o que aconteceu com o vaultwarden (ver o comentário lá): o
# domínio respondia 200 e o dado era o mesmo, então só um marcador por
# requisição revelou o split. Aqui o sintoma seria pior: escritas indo para dois
# bancos diferentes.
#
# A ordem do commit importa: a ponte sai e o timer perde a entrada ANTES de o
# Service ganhar selector, senão o timer corre contra o controller.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: persistence

resources:
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: giomartins
