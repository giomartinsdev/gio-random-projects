# Expõe a UI do ArgoCD por NodePort, para o túnel SSH e (futuramente) o
# ingress alcançarem.
#
# Por que este arquivo existe separado do install.yaml do ArgoCD: os
# manifestos oficiais só criam Services ClusterIP. Sem um Service estável,
# a alternativa seria `kubectl port-forward`, que morre a cada restart do
# pod e não serve para o nginx apontar. Fixar o NodePort 30080 é o que
# permite escrever o `proxy_pass` do default.conf com antecedência.
#
# Não é alcançável de fora: a security list da Oracle bloqueia a faixa
# 30000-32767. O acesso é por túnel SSH (`-N -L 30080:127.0.0.1:30080`).
#
# Fica em `bootstrap/` e não em `apps/` de propósito: `apps/` é varrido pelo
# ApplicationSet (1 pasta = 1 Application com sync automático), e o ArgoCD
# não deve gerenciar a si mesmo por esse caminho — um sync com prune
# errado derrubaria o controlador que estava aplicando. Aplicado uma vez
# no bootstrap, junto com o install.yaml.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-nodeport
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      # 8080 e não 443: o ArgoCD roda com `server.insecure=true` (HTTP),
      # igual ao resto da infra, onde o TLS termina no Cloudflare e o
      # nginx fala HTTP na 80. Com TLS no pod, o proxy precisaria de
      # `proxy_pass https://` + `proxy_ssl_verify off`, e o túnel SSH
      # esbarraria no certificado autoassinado do ArgoCD.
      targetPort: 8080
      nodePort: 30080
