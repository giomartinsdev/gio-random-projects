# appset.yaml — o único manifesto que você aplica à mão, uma vez por
# cluster. Depois disso nada mais é `kubectl apply`: o ArgoCD reconcilia
# tudo a partir do git.
#
# ## Por que um ApplicationSet e não um Application por serviço
#
# O gerador `git.directories` varre `gitops/apps/<namespace>/*` e cria um
# Application para cada diretório de serviço. Migrar um serviço novo continua
# sendo "adicionar uma pasta", sem editar manifesto de plataforma.
#
# ## Por que o namespace vem do CAMINHO
#
# Antes havia um único `giomartins` e `destination.namespace` era fixo. Com o
# fatiamento, o caminho passa a dizer onde o serviço mora:
#
#   gitops/apps/<namespace>/<serviço>/
#
# `{{index .path.segments 2}}` é o `<namespace>`. O kustomization de cada
# serviço também declara `namespace:` — e kustomize tem precedência sobre
# `destination.namespace`, que só preenche manifesto que não declara nada.
# Declarar nos dois lugares é redundância deliberada: o caminho diz onde a
# Application aponta, e o kustomization garante que `kustomize build` local
# produza exatamente o mesmo que o ArgoCD.
#
# ## A armadilha do nome da Application
#
# `metadata.name` é `{{.path.basename}}` — o nome do DIRETÓRIO do serviço, não
# do namespace. Por isso o diretório se chama `observability/observability`:
# a Application precisa continuar se chamando `observability`. Renomear uma
# Application faz o ArgoCD apagar (finalizer de cascata + prune) tudo o que ela
# gerenciava — inclusive PVC.
#
# ## O repositório é PÚBLICO
#
# O ArgoCD clona via HTTPS sem credencial. Nenhum segredo pode viver aqui: a
# credencial do registry entra por `imagePullSecret` criado manualmente em CADA
# namespace (ver `gitops/bootstrap/namespaces.sh` e `gitops/README.md`).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: root
  namespace: argocd
spec:
  goTemplate: true
  # `missingkey=error` faz o sync falhar alto se o template referenciar um
  # campo inexistente, em vez de renderizar um nome vazio e criar um
  # Application órfão.
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/giomartinsdev/gio-random-projects.git
        # `main` de propósito: o GitOps segue o mesmo branch que o CI publica.
        revision: main
        directories:
          # Dois níveis: `<namespace>/<serviço>`. O próprio diretório do
          # namespace (`gitops/apps/<ns>/`) não casa com o glob, porque ele exige
          # dois segmentos depois de `apps/` — então não precisa de `exclude`.
          - path: gitops/apps/*/*
  template:
    metadata:
      name: '{{ .path.basename }}'
      labels:
        giomartins.dev/managed-by: argocd
        giomartins.dev/layer: workloads
    spec:
      project: default
      source:
        repoURL: https://github.com/giomartinsdev/gio-random-projects.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 2 }}'
      syncPolicy:
        automated:
          # `prune` apaga do cluster o que foi removido do git — é o que
          # torna o git a fonte da verdade, e não um espelho de mão única.
          #
          # CONSEQUÊNCIA A RESPEITAR: remover um diretório de serviço apaga o
          # PVC junto. Por isso todo PV é `Retain` antes de qualquer mudança de
          # namespace (ver gitops/bootstrap/namespace-cutover.sh).
          prune: true
          # `selfHeal` desfaz edição manual no cluster. Se alguém der
          # `kubectl edit`, o ArgoCD reverte.
          selfHeal: true
        syncOptions:
          # Os namespaces são criados no bootstrap (precisam do
          # imagePullSecret ANTES do primeiro pod). Isto mantém a criação
          # idempotente num cluster novo.
          - CreateNamespace=true
          # ServerSideApply evita o limite de 262144 bytes da annotation
          # `kubectl.kubernetes.io/last-applied-configuration`, que estoura
          # com CRDs e manifestos grandes.
          - ServerSideApply=true
