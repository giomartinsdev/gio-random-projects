# appset.yaml — o único manifesto que você aplica à mão, uma vez por
# cluster. Depois disso nada mais é `kubectl apply`: o ArgoCD reconcilia
# tudo a partir do git.
#
# Por que um ApplicationSet e não um Application por serviço: o gerador
# `git.directories` varre `gitops/apps/*` e cria um Application para cada
# diretório. Migrar um serviço novo passa a ser "adicionar uma pasta",
# sem editar nenhum manifesto de plataforma. É o "configure a pipe do
# zero" com o mínimo de cola.
#
# O repositório é PÚBLICO, então o ArgoCD clona via HTTPS sem credencial.
# Consequência a respeitar: nenhum segredo pode viver aqui — a credencial
# do registry entra por `imagePullSecret` criado manualmente no bootstrap
# (ver gitops/README.md).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: root
  namespace: argocd
spec:
  goTemplate: true
  # `missingkey=error` faz o sync falhar alto se o template referenciar um
  # campo inexistente, em vez de renderizar um nome vazio e criar um
  # Application órfão.
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/giomartinsdev/gio-random-projects.git
        # `main` de propósito: o GitOps segue o mesmo branch que o CI publica.
        revision: main
        directories:
          - path: gitops/apps/*
  template:
    metadata:
      name: '{{ .path.basename }}'
      labels:
        giomartins.dev/managed-by: argocd
        giomartins.dev/layer: workloads
    spec:
      project: default
      source:
        repoURL: https://github.com/giomartinsdev/gio-random-projects.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: giomartins
      syncPolicy:
        automated:
          # `prune` apaga do cluster o que foi removido do git — é o que
          # torna o git a fonte da verdade, e não um espelho de mão única.
          prune: true
          # `selfHeal` desfaz edição manual no cluster. Se alguém der
          # `kubectl edit`, o ArgoCD reverte.
          selfHeal: true
        syncOptions:
          # O namespace `giomartins` é criado no bootstrap por causa do
          # imagePullSecret; isto mantém a criação idempotente num cluster
          # novo.
          - CreateNamespace=true
          # ServerSideApply evita o limite de 262144 bytes da annotation
          # `kubectl.kubernetes.io/last-applied-configuration`, que estoura
          # com CRDs e manifestos grandes.
          - ServerSideApply=true
