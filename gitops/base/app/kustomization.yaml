# app-base — o esqueleto comum das aplicações migradas.
#
# Extraído depois do terceiro serviço com a mesma forma (Deployment + Service +
# Secret via envFrom), para não repetir 40 linhas idênticas em cada pasta. O que
# muda entre serviços é image, porta, env e probes.
#
# Não é um Helm chart nem uma abstração esperta: é um `kustomization.yaml`
# composto. Quem lê `gitops/apps/domain/kustomization.yaml` vê exatamente quais
# campos foram sobrescritos.
#
# Uso, em gitops/apps/<serviço>/kustomization.yaml:
#
#   resources:
#     - ../../base/app
#   nameSuffix: ""            # ou nada
#   images:
#     - name: APP_IMAGE
#       newName: registry.giomartins.dev:5000/<imagem>
#       newTag: sha-<commit>
#   patches:
#     - path: deployment.yaml
#
# ## O `namespace` NÃO mora aqui (fatia 7)
#
# Até a fatia 7 este arquivo declarava `namespace: giomartins`, porque havia um
# namespace só. Com o fatiamento, o namespace passou a ser propriedade do
# CAMINHO (`gitops/apps/<namespace>/<serviço>/`), e a app declara o seu.
#
# Deixar `giomartins` aqui viraria armadilha: quem usasse o base sem declarar
# namespace no kustomization do app criaria o serviço no namespace morto, e o
# `kubectl get pods` mostraria tudo "saudável" no lugar errado. O transformer de
# namespace do kustomize externo até sobrescreveria este valor, mas depender
# dessa precedência silenciosa é exatamente o tipo de coisa que custa uma janela.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# `commonLabels` (e não `labels`): quero as labels também nos selectors, para
# que `kubectl get pods -l app.kubernetes.io/part-of=giomartins` funcione sem
# saber o nome do serviço.
commonLabels:
  app.kubernetes.io/part-of: giomartins

# Usado pelo CI (`kubeconform -strict`) para pegar typo em campo antes do push.
images: []
