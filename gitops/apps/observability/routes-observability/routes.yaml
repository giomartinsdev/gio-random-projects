# Rotas públicas do namespace observability, migradas do ConfigMap
# `default.conf` do ingress legado para VirtualServers do NIC.
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: vs-grafana
spec:
  host: grafana.giomartins.dev
  upstreams:
    - name: grafana
      service: grafana
      port: 3000
      client-max-body-size: 50m
  routes:
    - path: /
      action:
        pass: grafana
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: vs-otel
spec:
  host: otel.giomartins.dev
  upstreams:
    # OTLP/HTTP do collector (o alloy NodePort 30418). Telemetria de browsers
    # e serviços externos entra por aqui.
    - name: collector
      service: alloy-otlp
      port: 4318
      client-max-body-size: 50m
  routes:
    - path: /
      action:
        pass: collector
