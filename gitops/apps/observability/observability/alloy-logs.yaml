# alloy — coletor de logs, traces e métricas do cluster.
#
# ## O buraco que isto fecha
#
# O `alloy` que está em Docker usa `discovery.docker` + `loki.source.docker`: ele
# lê o stdout dos containers Docker e mais nada. Medido: o config dele tem ZERO
# referências a `kubernetes`. Resultado, até agora: os pods do cluster —
# incluindo `adminer`, `draw`, `domain` e `finance-api`, que já servem produção —
# não apareciam no Grafana. Um serviço que atende gente sem log é pior que um
# serviço sem Grafana, porque o painel vazio parece "está tudo bem".
#
# ## Por que "logs" saiu do nome do arquivo, mas o Service não mudou de nome
#
# O nome `alloy` é o que TODOS os apps já usam como
# `OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318`, e o domínio público
# `otel.giomartins.dev` termina nele. Trocar o nome obrigaria a editar env de
# 10 serviços — exatamente a mudança em massa que esta migração evita.
#
# A solução foi mover o **EndpointSlice**, não o nome. Até 2026-10-23 o Service
# `alloy` (em `gitops/apps/bridges/`) era uma ponte para o container Docker na
# 4318. Agora ele tem `selector` e aponta para ESTE pod, que passou a ter um
# receiver OTLP completo (grpc 4317 + http 4318).
#
# ## O que isto conserta (medido, não deduzido)
#
# Antes deste corte, a telemetria de aplicação estava partida em duas metades:
#
#   | dado              | ia para                       | Grafana do cluster lê |
#   | traces dos pods   | Tempo CONTAINER (172.18.0.11) | Tempo POD             |
#   | métricas OTLP     | Prometheus CONTAINER (.0.8)   | Prometheus POD        |
#
# Prova: o Tempo do container tinha 20 traces recentes de `domain-worker`; o do
# pod devolvia `traces: []`. O Prometheus do container tinha 16 séries de
# `http_server_duration_milliseconds_count`; o do pod, **zero**. Abrir latência
# de `domain-api` no Grafana dava vazio e parecia que a app não emitia nada.
#
# ## Os sources, lado a lado
#
#   - `otelcol.receiver.otlp` — traces e métricas dos pods e das SPAs.
#   - `loki.source.kubernetes` — logs dos pods, via API (o ServiceAccount tem
#     `pods` e `pods/log`).
#   - `loki.source.docker` — os containers que ainda estão em Docker, via
#     `hostPath: /var/run/docker.sock`.
#
# O último sai quando o último container sair. Enquanto houver `ingress`,
# `registry` ou `9router` em Docker, ele é a única forma de ler aquele stdout.
#
# ## Por que o alloy em Docker não serve para isso
#
# Testado: de dentro do container `alloy`, `172.18.0.1:6443` (a API do k3s)
# responde `Connection refused`. Não há caminho do Docker para a API do cluster.
# Rodar como pod resolve de graça, via ServiceAccount — sem kubeconfig, sem
# token em arquivo, sem credencial de cluster-admin montada num container.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-logs
  labels:
    app.kubernetes.io/name: alloy-logs
---
# ClusterRole, não Role: `discovery.kubernetes` com `role = "pod"` lista pods de
# todos os namespaces, e no futuro este coletor pode cobrir mais de um. Os verbos
# são só de leitura — nenhum `create`, `update` ou `delete`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-logs
  labels:
    app.kubernetes.io/name: alloy-logs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Sem `pods/log` o `loki.source.kubernetes` descobre os pods e não consegue
  # ler uma linha — falha silenciosa, log vazio, nenhum erro no Grafana.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-logs
  labels:
    app.kubernetes.io/name: alloy-logs
subjects:
  - kind: ServiceAccount
    name: alloy-logs
    # O subject de um ClusterRoleBinding é texto, não metadata: o transformer de
    # `namespace:` do kustomize NÃO o reescreve. Quando o ServiceAccount saiu de
    # `giomartins`, este campo continuou apontando para um namespace que não tem
    # mais esse SA — o binding existiria, o RBAC ficaria inerte, e o sintoma
    # seria "alloy lê zero pods", sem erro nenhum.
    namespace: observability
roleRef:
  kind: ClusterRole
  name: alloy-logs
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs-config
  labels:
    app.kubernetes.io/name: alloy-logs
data:
  config.alloy: |
    // ---------------------------------------------------------------
    // OTLP: traces e metricas dos pods e dos SPAs.
    // ---------------------------------------------------------------
    // Pipeline copiado de `stacks/observability/alloy.alloy`, sem alteracao de
    // semantica. Ate 2026-10-23 este coletor era so de LOG: o receiver OTLP
    // vivia apenas no Alloy em Docker, e era para la que `alloy:4318` apontava
    // (o Service `alloy` era a ponte para o container). Efeito medido: os
    // traces dos pods iam para o Tempo em Docker e as metricas para o
    // Prometheus em Docker, enquanto o Grafana do cluster consulta os pods --
    // abrir latencia de `domain-api` no Grafana dava vazio.
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }

      http {
        endpoint = "0.0.0.0:4318"

        // O endpoint publico (`otel.giomartins.dev`) e consumido pelos
        // browsers das SPAs, entao o CORS e a unica barreira de origem. Os
        // valores sao exatamente os do Alloy em Docker.
        cors {
          allowed_origins = ["https://tela.giomartins.dev", "https://hub.giomartins.dev", "https://finance.giomartins.dev"]
        }
      }

      output {
        metrics = [otelcol.processor.batch.default.input]
        traces  = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      send_batch_size = 1024
      timeout         = "5s"

      output {
        metrics = [otelcol.exporter.prometheus.default.input]
        traces  = [otelcol.exporter.otlp.tempo.input]
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        // `tempo` e o Service deste diretorio: o Tempo do CLUSTER, nao mais o
        // container. Mesmo nome do Compose, como o resto da migracao.
        endpoint = "tempo:4317"
        tls {
          insecure = true
        }
      }
    }

    // Metrica OTLP nao pode ir direto ao Prometheus: o receiver de remote-write
    // fala outro protocolo. Este exporter converte para o pipeline Prometheus
    // do Alloy, cujo remote_write entrega em `prometheus:9090`.
    otelcol.exporter.prometheus "default" {
      forward_to = [prometheus.remote_write.default.receiver]
    }

    prometheus.remote_write "default" {
      endpoint {
        // O Prometheus do cluster tem `--web.enable-remote-write-receiver`;
        // sem a flag isto levaria 404 e as metricas sumiriam em silencio.
        url = "http://prometheus:9090/api/v1/write"
      }
    }

    // ---------------------------------------------------------------
    // Pods do cluster, lidos pela API.
    // ---------------------------------------------------------------
    discovery.kubernetes "pods" {
      role = "pod"

      // Os quatro namespaces do fatiamento. Não dá para listar só
      // `giomartins`: depois do fatiamento esse namespace fica vazio, e o Alloy
      // leria zero pods — com o ArgoCD verde e o Loki só recebendo o `job=docker`
      // do container legado.
      //
      // Ficam de fora kube-system, argocd, cert-manager, kubero e os `cattle-*`:
      // ruído que enche o Loki sem ninguém consultar, e cardinalidade é o recurso
      // escasso do Loki.
      namespaces {
        names = ["persistence", "observability", "applications", "support"]
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // `app` em vez de `container`: os manifestos desta migração já usam
      // `app.kubernetes.io/name`, e é esse o nome que o operador reconhece
      // (`domain-api`, `finance-api`). O label do container no Docker já se
      // chama `container`, e os dois vão coexistir por um tempo — usar o mesmo
      // nome para coisas diferentes tornaria as queries ambíguas.
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Um pod com vários containers gera uma linha por container. Sem este
      // label, não dá para separar sidecar de app.
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // Mesmo nome de label do alloy em Docker (`job`), valores diferentes para
      // que a query saiba a origem sem precisar de outro campo.
      rule {
        target_label = "job"
        replacement  = "kubernetes"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.logs.receiver]

      // O collector fala com a API pelo token do ServiceAccount montado pelo
      // kubelet. Sem `kubeconfig_file`: nenhuma credencial em arquivo.
    }

    // Pipeline Docker: REMOVIDO em 2026-10-24, com o descomissionamento.
    // `discovery.docker` + `loki.source.docker` liam o stdout dos containers
    // pelo `/var/run/docker.sock`. Sem containers e sem socket, o bloco só
    // geraria erro de conexão. `loki.source.kubernetes` (acima) é independente:
    // fala com a API pelo ServiceAccount, não pelo socket.
    //
    // Provado antes de remover: `up{job="docker"}` já não existia no Prometheus,
    // e o Loki só tinha 6 séries `job=docker` — todas de containers PARADOS ou
    // do `dockhand`, que sai junto com o daemon.
    // ---------------------------------------------------------------
    // Processamento e destino: idênticos aos do collector em Docker.
    // ---------------------------------------------------------------
    // Manter o MESMO stage nos dois coletores não é detalhe: `level` é o label
    // que as queries do dashboard filtram. Se um coletor extraísse `level` e o
    // outro não, o mesmo serviço apareceria com e sem o campo dependendo de onde
    // rodava.
    loki.process "logs" {
      // Apps em Go logam JSON (slog) e apps em Python também; containers de
      // infra logam texto puro. `stage.json` extrai `level` quando a linha
      // parseia e não faz nada quando não parseia — então tudo passa.
      stage.json {
        expressions = {
          level = "level",
        }
      }

      stage.labels {
        values = {
          level = "level",
        }
      }

      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        // `loki` é o Service deste mesmo diretório — o Loki que acabou de subir
        // com o volume copiado (976M de histórico).
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
# Estado do Alloy: `positions.yml` de cada fonte de log.
#
# A versão anterior usava `emptyDir` com esta justificativa: "perder isso num
# restart significa reler desde o começo e duplicar linhas já enviadas, não
# perder dado. PVC aqui seria custo sem benefício."
#
# A premissa está errada, e o Loki prova. O Alloy volta a ler o log Docker desde
# o começo do arquivo, e o arquivo contém linhas de DIAS atrás. O Loki rejeita
# com `400 entry too far behind, oldest acceptable timestamp is ...` (default
# `reject_old_samples_max_age: 1h`), o Alloy não tem retry para 4xx, e o lote
# inteiro é descartado. Medido no pod com 1h45 de vida:
#
#   loki_write_sent_entries_total      282.836
#   loki_write_dropped_entries_total   115.696   (reason=ingester_error)
#
# Ou seja: 29% das linhas foram perdidas, não duplicadas. O custo do PVC é
# 1Gi, dos quais o estado real ocupa 376K.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alloy-state
  labels:
    app.kubernetes.io/name: alloy-logs
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      # Medido: 376K com 61 streams (20 containers Docker + pods). 1Gi é folga
      # de três ordens de grandeza, e o local-path não sabe crescer sozinho.
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-logs
  labels:
    app.kubernetes.io/name: alloy-logs
spec:
  # Um só. Não é DaemonSet: o `loki.source.kubernetes` lê pela API, não pelo
  # filesystem do nó, então uma réplica cobre todos os nós. Duas réplicas
  # duplicariam cada linha no Loki.
  replicas: 1
  # ## Recreate, nunca RollingUpdate
  #
  # O PVC é `ReadWriteOnce`, e RWO no Kubernetes significa "um nó", não "um pod".
  # Num nó único (este) o scheduler deixa um SEGUNDO pod montar o mesmo volume.
  # Com o `maxSurge: 25%` padrão, o rollout subiria o pod novo antes de matar o
  # velho, os dois escreveriam `positions.yml` ao mesmo tempo, e o arquivo
  # chegaria corrompido no pod que fica -- trocando perda de log por perda de
  # log. `Recreate` mata antes de subir; a indisponibilidade é de segundos e o
  # único afetado é a coleta de log, não o tráfego.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy-logs
    spec:
      serviceAccountName: alloy-logs
      containers:
        - name: alloy
          image: grafana/alloy@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
          args:
            - "run"
            - "/etc/alloy/config.alloy"
            # O Alloy expõe um servidor HTTP próprio (UI de componentes,
            # /metrics) na 12345. Antes ficava em loopback do pod, o que fazia o
            # Prometheus raspar `alloy:12345` e receber connection refused --
            # target `alloy` Down permanente. Como agora este pod é o `alloy` do
            # Service, o Prometheus precisa alcançá-lo: 0.0.0.0 e não 127.0.0.1.
            - "--server.http.listen-addr=0.0.0.0:12345"
            - "--storage.path=/var/lib/alloy/data"
          ports:
            - name: http
              containerPort: 12345
            # OTLP. O Alloy em Docker usava 4317/4318; estes nomes de porta sao
            # os mesmos que o Service abaixo expoe, e o kube-proxy exige que os
            # dois lados batam (armadilha que ja custou uma madrugada nas
            # pontes).
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: state
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-logs-config
        - name: state
          # PVC, não `emptyDir`: ver o comentário do PVC `alloy-state` no topo
          # deste arquivo. As posições são o que impede a releitura de logs de
          # dias atrás, que o Loki rejeita por `entry too far behind`.
          persistentVolumeClaim:
            claimName: alloy-state
