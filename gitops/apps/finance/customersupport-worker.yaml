# finance-customersupport-worker — consome eventos e responde via Evolution API.
#
# Não escuta porta nenhuma (verificado com `ss` na netns do container: nenhuma
# porta LISTEN). É consumidor puro de fila. Por isso não tem Service nem probe
# HTTP — um probe TCP em porta inexistente impediria o pod de ficar Ready.
#
# replicas fica em 0 no kustomization.yaml até a janela de cutover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-customersupport-worker
  labels:
    app.kubernetes.io/name: finance-customersupport-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finance-customersupport-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finance-customersupport-worker
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: finance-customersupport-worker
          image: registry.giomartins.dev:5000/finance-customersupport-worker@sha256:e7fd93674e6d7469b874fb10b77d1b3fa408b44c20182963233b67a6b18e7ba1
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          envFrom:
            - secretRef:
                name: finance-customersupport-worker
