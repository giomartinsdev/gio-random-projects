# db-mcp — servidor MCP read-only + gateway nginx com token.
#
# Os dois containers moram aqui porque são um par: o gateway existe só para
# autenticar o MCP, que não tem auth própria. Migrar um sem o outro deixaria o
# MCP exposto (se subisse sozinho) ou o gateway sem backend.
#
# Roda em paralelo ao Docker; o ingress continua em 127.0.0.1:8021.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: giomartins

resources:
  - deployment.yaml
  - gateway.yaml

commonLabels:
  app.kubernetes.io/part-of: giomartins
