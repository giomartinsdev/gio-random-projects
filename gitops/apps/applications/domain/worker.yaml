# domain-worker — o único escritor do CQRS do contexto `domain`.
#
# Consome da fila do rabbitmq e escreve no postgres. Sem porta HTTP: não tem
# Service, porque nada precisa alcançá-lo.
#
# ATENÇÃO — este é o serviço mais perigoso de rodar em dobro. Se o worker do
# Docker e o do k8s consumirem a mesma fila ao mesmo tempo, mensagens são
# processadas duas vezes. A migração correta é PARAR o Docker antes de subir
# este, não rodar os dois em paralelo como o domain-api.
#
# Por isso o Deployment começou com réplicas 0: o manifesto existia e era
# reconciliado pelo ArgoCD, mas não consumia nada até a janela de cutover.
#
# Em 2026-10-23 o container foi PARADO primeiro e só então isto virou 1. Não é
# cerimônia: dois consumers em `domain.commands.queue` processam a mesma
# mensagem duas vezes, e o efeito é escrita duplicada no postgres, não um erro
# visível. Verificado depois: o broker voltou a mostrar 1 consumer na fila.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-worker
  labels:
    app.kubernetes.io/name: domain-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: domain-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: domain-worker
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: domain-worker
          image: registry.giomartins.dev:5000/domain-worker@sha256:93d492894708d25d385b26a4dd359bea8ea525c2c9e874a2b047c1924179cc29
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          envFrom:
            - secretRef:
                name: domain-worker
