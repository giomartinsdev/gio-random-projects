# finance-api (ACL do contexto financeiro). Auth própria (X-API-Key), sem
# Access: o SPA em finance.giomartins.dev chama este host cross-origin pelo
# browser. O CORS é respondedo pela própria API.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-finance-api
  annotations:
    nginx.org/client-max-body-size: "50m"
    nginx.org/websocket-services: "finance-api"
