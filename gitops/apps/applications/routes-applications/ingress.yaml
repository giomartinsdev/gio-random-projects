# Rotas públicas do namespace applications — Ingress NATIVO (2026-10-24).
#
# Padrões comuns documentados em `gitops/apps/persistence/routes-persistence/
# ingress.yaml` (por que Ingress nativo, snippet aninhado, determinância do
# nome do upstream, proxy_http_version 1.1).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-domain
  annotations:
    nginx.org/client-max-body-size: "50m"
    nginx.org/websocket-services: "domain-api"
    nginx.org/location-snippets: "proxy_http_version 1.1;"
spec:
  ingressClassName: nic
  rules:
    - host: domain.giomartins.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: domain-api
                port:
                  number: 8000
---
