# ## tela-api — o host que origina o hostNetwork
#
# A tela-api escuta `127.0.0.1:8007` DE PROPÓSITO (ver
# `gitops/apps/applications/tela/api.yaml`): bind no loopback = garantia
# estrutural de que a 8007 não existe para a internet. O `Endpoints` manual em
# 127.0.0.1 é recusado pelo API server (`may not be in the loopback range`) e
# `ExternalName` inerte: o NIC não diala DNS de Service. A saída foi o NIC em
# `hostNetwork` (mesma netns de tudo que diala loopback) + snippet com
# location ANINHADA: o CRD (ou o Ingress nativo, idem) exige um backend no
# spec — o `domain-api` é inerte de propósito, nunca atingido — e o snippet
# intercepta 100% das requests com um `proxy_pass` próprio para o loopback.
#
# A réplica exata que o VirtualServer serviu por 24h (provada no cutover:
# 404 de /api/health identico ao legado).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-tela-api
  annotations:
    nginx.org/client-max-body-size: "50m"
    nginx.org/location-snippets: |
      location ~ ^/ {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
      }
spec:
  ingressClassName: nic
  rules:
    - host: tela-api.giomartins.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # Inerte por definição: a location aninhada do snippet intercepta
              # tudo antes de nenhum pacote chegar aqui. domain-api porque é um
              # Service vivo e estável — não por ser o destino.
              service:
                name: domain-api
                port:
                  number: 8000
