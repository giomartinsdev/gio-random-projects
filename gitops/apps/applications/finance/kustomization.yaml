# finance — API + dois workers do contexto `finance`.
#
# api.yaml sobe em paralelo (o ingress continua na 8018 do Docker).
#
# Os dois workers sobem com replicas: 0 pelo mesmo motivo do domain-worker:
# são consumidores de fila. Dois consumidores na mesma fila processam a mesma
# mensagem duas vezes. Subir para 1 é o ato de migrar, e exige parar o Docker
# antes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: applications

resources:
  - api.yaml
  - openfinance-worker.yaml
  - customersupport-worker.yaml
  - service.yaml
  - service-worker.yaml

commonLabels:
  app.kubernetes.io/part-of: giomartins

# Os workers precisam de réplicas 0 até a janela de cutover. Declarado aqui em
# vez de em cada arquivo para que a intenção fique no topo do diretório.
#
# `finance-openfinance-worker` saiu desta lista: já migrou. Ele não é consumidor
# de fila (é poller agendado, ~2,5 min), então duas réplicas fariam sync
# duplicado em vez de processar a mesma mensagem duas vezes. O corte foi feito
# parando o container Docker, e o container só volta se este pod falhar.
patches:
  # finance-customersupport-worker saiu deste patch em 2026-10-23: ele precisa
  # rodar no cluster porque o `evolution-api` migrou. De dentro do cluster
  # `evolution-api:8080` resolve para o pod; de dentro do Docker resolve para o
  # container, que foi parado. Ver gitops/apps/finance/customersupport-worker.yaml.
