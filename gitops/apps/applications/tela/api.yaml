# tela-api — a API do screen sharing (Go, distroless).
#
# ## O que ela faz
#
# Cria/valida salas, guarda o hash da senha, emite credenciais TURN de curta
# duração, e faz ponte WHIP/WHEP entre o browser e o MediaMTX. O frontend
# (`tela-frontend`, servido pelo MinIO) fala com ela por https://tela-api.
#
# ## `BIND_HOST=127.0.0.1` continua, e isso é uma decisão de segurança
#
# No Compose a API escuta só no loopback do host, e o único cliente é o ingress
# (também `hostNetwork`). Em `hostNetwork` no k8s, o pod compartilha a netns do
# host: `127.0.0.1` continua significando "só quem está no host". Manter isso
# preserva a propriedade de que a API NÃO é alcançável pela internet na 8007 —
# ela só existe atrás do nginx, que aplica o `server_name` e o TLS da Cloudflare.
#
# Trocar para `0.0.0.0` "para o probe funcionar" seria abrir a porta: o firewall
# tem `REJECT` no fim do `INPUT`, então não ficaria exposta de imediato — mas
# passaria a depender de uma regra de firewall para uma propriedade que hoje é
# do bind. Não se troca uma garantia estrutural por uma condicional.
#
# ## Por que os probes têm `host: 127.0.0.1`
#
# Medido em 2026-10-23: em pod `hostNetwork`, o probe dial-a o IP DO NÓ, não o
# loopback. Sem `host`, este pod ficaria `Running` e nunca `Ready`, porque o
# processo só escuta `127.0.0.1:8007`. Com `host: 127.0.0.1` funciona (provado).
#
# ## Persistência: o volume hoje NÃO grava, e o pod corrige isso
#
# O `tela-state` do Docker é `root:root 755` e o processo roda `nonroot`; o
# `persist()` do registry engole o erro de escrita (`if err := ...; err != nil
# { return }`), então criar sala funciona, a API responde 201, e o arquivo nunca
# aparece. Provei em 2026-10-23: criei uma sala, a resposta foi
# `{"roomId":"tijolo83galinha"}`, e `/var/lib/docker/volumes/tela-state/_data`
# continuou vazio. Consequência real: todo redeploy do container perde as salas.
#
# Aqui `fsGroup: 65532` (o uid do `nonroot` na distroless) faz o kubelet dar
# grupo de escrita no PVC. Provado com um pod de teste: `touch` como 65532
# funcionou. A migração conserta um bug que existia em produção — e o comentário
# fica porque é a diferença de comportamento entre os dois lados.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tela-state
  labels:
    app.kubernetes.io/name: tela-api
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      # O arquivo é uma lista JSON de salas (id, salt, hash, resume key): bytes
      # por sala. 256Mi é folga para nunca virar alerta de disco.
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tela-api
  labels:
    app.kubernetes.io/name: tela-api
spec:
  # 1 desde o corte de 2026-10-23: o container Docker foi parado antes, então a
  # 8007 e as portas de mídia do host são exclusivas dos pods do tela.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tela-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tela-api
    spec:
      hostNetwork: true
      dnsPolicy: Default
      # A imagem vem do registry interno, que exige credencial. Criado em
      # `gitops/bootstrap/namespaces.sh` e já usado pelos demais apps.
      imagePullSecrets:
        - name: registry-credentials
      # 65532 = `nonroot` na distroless. Sem isto, o PVC nasce `root:root` e o
      # processo não consegue escrever (é o bug descrito no topo).
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: tela-api
          # Mesmo digest do container em produção (registry interno).
          image: registry.giomartins.dev:5000/tela-api@sha256:35952b2b64fa1e31b83d3e61dfe6dcff92dc42dbb0f3cb5bdd6afdd795086b9f
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8007"
            # Só o ingress (hostNetwork) alcança a API. Ver o topo.
            - name: BIND_HOST
              value: 127.0.0.1
            - name: STATE_FILE
              value: /data/rooms.json
            # MediaMTX pelo loopback: os dois são hostNetwork, então "localhost"
            # é o host, não um pod. Um nome de Service não resolveria aqui.
            - name: MEDIAMTX_INTERNAL_URL
              value: http://127.0.0.1:8889
            - name: TELA_STUN_URLS
              value: ""
            - name: TELA_TURN_URLS
              value: "turn:168.138.135.6:3478?transport=udp turn:168.138.135.6:3478?transport=tcp"
            - name: TELA_TURN_USERID
              value: tela
            - name: TELA_TURN_USERNAME
              value: ""
            - name: TELA_TURN_PASSWORD
              value: ""
            - name: TELA_TURN_CF_KEY_ID
              value: ""
            - name: TELA_TURN_CF_API_TOKEN
              value: ""
            - name: FRONTEND_ORIGINS
              value: https://tela.giomartins.dev
            # OTLP para o pod `alloy-logs` por NodePort: `hostNetwork` não tem
            # DNS de cluster, e 127.0.0.1:4318 é o container antigo — que sai no
            # fim da migração. 30418 é o NodePort do coletor no k8s.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://127.0.0.1:30418
            - name: OTEL_SERVICE_NAME
              value: tela-api
            - name: TELA_TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: tela-turn
                  key: TELA_TURN_SECRET
          ports:
            - name: http
              containerPort: 8007
          # `/healthz` existe e responde `{"rooms":N,"status":"ok"}` — usado no
          # teste antes da escolha. `host: 127.0.0.1` pelo motivo do topo.
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: state
              mountPath: /data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: tela-state
