# domain — API + worker do bounded context `domain`.
#
# Este diretório é o que o ApplicationSet varre. Cada pasta em gitops/apps/
# vira um Application no ArgoCD automaticamente; nada de plataforma precisa ser
# editado para migrar um serviço novo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: giomartins

# Os dois containers do contexto. worker.yaml vem com replicas: 0 de propósito
# — ver o comentário lá (rodar dois escritores na mesma fila duplica mensagens).
resources:
  - deployment.yaml
  - worker.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/part-of: giomartins
