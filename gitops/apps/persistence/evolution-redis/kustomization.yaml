# evolution-redis — a ÚLTIMA ponte. Com este Service virando, o diretório
# `gitops/apps/bridges/` fica vazio e o timer `sync-external-endpoints` perde a
# razão de existir.
#
# ## A ordem dos dois commits
#
#   1. `deployment.yaml` sozinho: o pod subiu, replicou do container e provou o
#      dado (md5 dos 860 pares campo+valor idêntico). Ninguém resolvia
#      `evolution-redis` para ele, porque o nome ainda era a ponte.
#   2. ESTE: `service.yaml` entra em `resources` + `bridges/evolution-redis.yaml`
#      sai + `evolution-redis` sai do `MAPA` do timer. Os três juntos.
#
# Fazer o passo 2 antes do 1 derrubaria o `evolution-api` (que fala
# `redis://evolution-redis:6379/6`) contra um Redis vazio: o Baileys perderia as
# 860 chaves e precisaria de QR novo. Fazer o 2 sem o 3 faria o kube-proxy
# balancear entre o pod e o container — metade das chaves indo para cada lado,
# que é pior que qualquer um dos dois sozinho.
#
# ## Depois deste commit
#
# `bridges/` fica vazio. O timer continua instalado mas com `MAPA` vazio, o que
# é inofensivo; ele sai junto com o Docker no fim da migração. Não apagar o
# diretório `bridges/` ainda: o ApplicationSet geraria uma Application sem
# recursos, e é mais honesto desmontar isso de uma vez quando o último container
# parar.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: persistence

resources:
  - deployment.yaml
  - service.yaml
