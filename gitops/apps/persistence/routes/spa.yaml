# Os três sites estáticos (tela, hub, finance) são objetos dentro de buckets
# MinIO (`tela-frontend`, `hub-frontend`, `finance-frontend`). O bloco legado
# tinha duas regras por host:
#
#   location ~ ^/.*\.[a-zA-Z0-9]+$ { proxy_pass .../tela-frontend$uri; }
#     -> qualquer path que TERMINA em extensão vai pro objeto S3 de mesmo nome.
#   location /                     { proxy_pass .../tela-frontend/index.html; }
#     -> todo o resto cai no index.html (SPA fallback / history routing).
#
# A tradução declarativa do NIC conserva exatamente essa semântica com duas
# rotas: a primeira é regex (`~` = match case-sensitive), com capture `$1` no
# `rewritePath`; a segunda é prefix `/`, que no algoritmo de localização do
# nginx perde para a regex quando ela casa — igual ao legado.
#
# Por isso são três VirtualServers e não um: o valor do prefixo do bucket
# (`tela-`/`hub-`/`finance-`) muda por host, e `rewritePath` é propriedade do
# VS inteiro.
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: vs-tela-site
spec:
  host: tela.giomartins.dev
  upstreams:
    - name: minio-objects
      service: minio
      port: 9000
  routes:
    - path: "~^/(.*\\.[a-zA-Z0-9]+)$"
      action:
        proxy:
          upstream: minio-objects
          rewritePath: /tela-frontend/$1
    - path: /
      action:
        proxy:
          upstream: minio-objects
          rewritePath: /tela-frontend/index.html
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: vs-hub-site
spec:
  host: hub.giomartins.dev
  upstreams:
    - name: minio-objects
      service: minio
      port: 9000
  routes:
    - path: "~^/(.*\\.[a-zA-Z0-9]+)$"
      action:
        proxy:
          upstream: minio-objects
          rewritePath: /hub-frontend/$1
    - path: /
      action:
        proxy:
          upstream: minio-objects
          rewritePath: /hub-frontend/index.html
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: vs-finance-site
spec:
  host: finance.giomartins.dev
  upstreams:
    - name: minio-objects
      service: minio
      port: 9000
  routes:
    - path: "~^/(.*\\.[a-zA-Z0-9]+)$"
      action:
        proxy:
          upstream: minio-objects
          rewritePath: /finance-frontend/$1
    - path: /
      action:
        proxy:
          upstream: minio-objects
          rewritePath: /finance-frontend/index.html
