# vaultwarden — o servidor (não confundir com vaultwarden-api, a bridge).
#
# Este é o serviço com ESTADO da fatia 6, e o MENOS arriscado dela: 1 MB de
# SQLite contra 2.4 GB de Postgres. Por isso ele é o primeiro da janela — prova
# o procedimento de volume stateful de ponta a ponta antes de encostar no banco
# onde tudo mora.
#
# ## O que é o volume
#
# `vaultwarden_data` é um named volume Docker com `db.sqlite3` (770 KB),
# `db.sqlite3-wal`, `db.sqlite3-shm`, `rsa_key.pem` e `icon_cache/`. O SQLite
# está em modo WAL, então NÃO se copia com o servidor rodando: a cópia pegaria
# um WAL pela metade e o banco abriria "malformed" ou perderia as últimas
# escritas. O procedimento é parar → copiar → religar (ver `copy-volume.sh`).
#
# O `rsa_key.pem` é o que assina os tokens de sessão: se ele chegar diferente, os
# clientes já logados caem. Está dentro da cópia, e é um dos itens conferidos na
# paridade (sha256 igual nos dois lados).
#
# ## A ordem do cutover
#
#   1. PVC + pod filler só para o `local-path` criar a pasta do PV
#   2. docker stop vaultwarden
#   3. cp -a do volume para a pasta do PV
#   4. docker start vaultwarden  (rollback vivo de novo)
#   5. remover o filler, `replicas: 1`, ArgoCD reconcilia
#   6. provar: mesmo `rsa_key.pem` (sha256), mesmo `/api/config`, mesma contagem
#      de usuários via `vaultwarden-api`
#   7. só então trocar o Service (ponte -> selector) e o ingress (:8222 -> NodePort)
#
# ## Por que o container roda como root e eu não forço outro uid
#
# O volume é `root:root 755` e o binário do Vaultwarden é um único executável que
# roda como root no Compose. Copiado com `cp -a`, chega root no PVC. Forçar
# `runAsUser: 65534` faria o processo não conseguir escrever no `db.sqlite3` (o
# SQLite cria `-wal`/`-shm` ao lado) — falha na primeira escrita, não no boot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
spec:
  # 1 na janela de 2026-10-23. `Recreate` porque SQLite não admite dois
  # escritores: um rollout normal subiria o pod novo antes de matar o antigo, e
  # os dois abririam o mesmo `db.sqlite3`.
  replicas: 1
  strategy:
    type: Recreate
    # Mantido por documentação, NÃO porque funciona: `null` é ignorado pelo
    # ServerSideApply. A troca de `RollingUpdate` para `Recreate` só passou
    # porque o Deployment foi DELETADO e recriado pelo ArgoCD (não tinha pod,
    # `replicas: 0`). Ver armadilha 11 no README. Num Deployment que já existe
    # com pods, esta linha não basta.
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          # Digest do ÍNDICE multi-arch da imagem EM EXECUÇÃO. Verificado contra
          # o registry: a tag `1.37.2` resolve exatamente para este digest
          # (`vaultwarden/server@sha256:094b5689…`), e é o mesmo que o container
          # usa hoje (`/vaultwarden --version` → Vaultwarden 1.37.2, Web-Vault
          # 2026.7.0). Pinar por digest, e não pela tag, porque `latest` já
          # aponta para outro (`efb3cde9…`): um `pull` implícito traria um
          # upgrade que ninguém pediu.
          image: vaultwarden/server@sha256:094b5689ed81549bd293418395c7cf495ae9d960fc2d4928cef2083ef913d912
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          # Volume persistente. `local-path` é o provisioner do k3s (hostPath
          # em /var/lib/rancher/k3s/storage). Não tem snapshot nem replicação —
          # o backup é o dump do SQLite descrito acima.
          volumeMounts:
            - name: data
              mountPath: /data
          envFrom:
            - secretRef:
                name: vaultwarden
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  labels:
    app.kubernetes.io/name: vaultwarden
spec:
  # Explícito: o default do cluster é local-path, mas deixar implícito faz o
  # PVC depender de configuração de cluster em vez de intenção declarada.
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
