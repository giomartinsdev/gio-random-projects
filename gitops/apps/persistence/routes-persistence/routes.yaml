# Rotas públicas hospedadas no namespace persistence, migradas do ConfigMap
# `default.conf` do ingress legado (um `server` block por host) para
# VirtualServers do NIC (controller em `nic`, ingressClass `nic`).
#
# ## Por que VirtualServer e não Ingress
#
# O `Ingress` nativo não expressa o que estas rotas fazem: upstream HTTPS
# (rancher), reescrita de path por host com capture (`tela-frontend$1`), timeout
# de 1h para SSE (db-mcp). O VS (CRD `k8s.nginx.org/v1`) expressa tudo isso
# declarativamente, e o resultado é o mesmo nginx que já rodava no legado.
#
# ## Paridade de comportamento com o legado
#
# O NIC gera, para cada rota proxy, exatamente o conjunto de headers do bloco
# antigo: `Host $host`, `X-Real-IP`, `X-Forwarded-For/Proto/Host/Port` e
# `Upgrade`/`Connection` (websocket nativo, sem anotação). O
# `client-max-body-size: 50m` subiu de global (ConfigMap) para upstream —
# mesmo limite, agora visível no objeto.
#
# ## Cross-namespace
#
# O upstream pode apontar para Service em outro namespace (`service: ns/svc`) —
# é o que o vs-rancher faz lá em support. Aqui os alvos são todos locais.
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: vs-vault
spec:
  host: vault.giomartins.dev
  upstreams:
    - name: vaultwarden
      service: vaultwarden
      port: 80
      client-max-body-size: 50m
  routes:
    - path: /
      action:
        pass: vaultwarden
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: vs-minio
spec:
  host: minio.giomartins.dev
  upstreams:
    # Porta 9001 = Console do MinIO. A API S3 (9000) não é rota web.
    - name: minio-console
      service: minio
      port: 9001
      client-max-body-size: 50m
  routes:
    - path: /
      action:
        pass: minio-console
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: vs-rabbit
spec:
  host: rabbit.giomartins.dev
  upstreams:
    - name: rabbitmq-management
      service: rabbitmq
      port: 15672
      client-max-body-size: 50m
  routes:
    - path: /
      action:
        pass: rabbitmq-management
