# Service `alloy` — ponte para o coletor OpenTelemetry em Docker.
#
# As aplicações exportam OTLP HTTP para `http://alloy:4318`. Migrar o Alloy
# (fatia 4) significa trocar o EndpointSlice por um Deployment; o nome não
# muda e nenhuma aplicação percebe.
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
spec:
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
