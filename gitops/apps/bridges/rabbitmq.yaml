# Service `rabbitmq` — ponte para o container Docker.
#
# Porta 5672 (AMQP), não 15672 (management). As aplicações usam
# `amqp://domain:***@rabbitmq:5672/`. O management continua exposto pelo
# ingress em rabbit.giomartins.dev -> 127.0.0.1:15672 (Docker).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
