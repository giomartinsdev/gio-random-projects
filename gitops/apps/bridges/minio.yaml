# Service `minio` — ponte para o container Docker.
#
# Porta 9000 (S3 API). As aplicações usam `http://minio:9000` para URLs
# pré-assinadas. A 9001 (console) não precisa de Service no cluster: quem a
# consome é o navegador, via ingress -> 127.0.0.1:9001 do Docker.
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
