# Service `evolution-redis` — ponte para o Redis do Evolution API em Docker.
#
# Porta 6379. Consumido pelo evolution-api. Redis não tem autenticação aqui
# (rede interna), então o Service não carrega segredo.
apiVersion: v1
kind: Service
metadata:
  name: evolution-redis
  labels:
    app.kubernetes.io/name: evolution-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
