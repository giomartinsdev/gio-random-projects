# Service `evolution-api` — ponte para o gateway WhatsApp em Docker.
#
# Porta 8080. Consumido pelo finance-customersupport-worker
# (EVOLUTION_API_URL=http://evolution-api:8080). O ingress serve
# evolution.giomartins.dev -> 127.0.0.1:8080 (Docker).
apiVersion: v1
kind: Service
metadata:
  name: evolution-api
  labels:
    app.kubernetes.io/name: evolution-api
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
