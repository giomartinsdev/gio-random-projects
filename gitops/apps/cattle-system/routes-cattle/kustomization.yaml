apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# O Ingress do rancher mora neste namespace, e não em `support` como os outros
# 16: `Ingress` nativo só referencia Service do PRÓPRIO namespace, e o Service
# `rancher` é de `cattle-system` — cross-namespace é exclusividade do
# VirtualServer (upstream `cattle-system/rancher`), que este Ingress substitui.
# Criar o Ingress aqui é o jeito limpo: sem Service-espelho, sem Endpoints à mão.
#
# O AppSet gera uma Application por folder (`routes-cattle`); o nome do folder
# precisa ser único em todo `gitops/apps/` (basename = nome da Application).
namespace: cattle-system

resources:
  - ingress.yaml
