# vaultwarden — servidor de senhas (fatia 6, estado).
#
# O Deployment sobe com replicas: 0 até a janela de cutover. O Service existe
# agora porque o vaultwarden-api no k8s precisa resolver o nome `vaultwarden`,
# e hoje ele resolve para o container Docker via EndpointSlice.
#
# Ver deployment.yaml para o procedimento de cópia do SQLite (parar o container
# antes — WAL ativo produz cópia inconsistente).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: giomartins

resources:
  - deployment.yaml
  - service.yaml

# `labels` e não `commonLabels`: ver o comentário em
# gitops/apps/bridges/kustomization.yaml — commonLabels contamina o
# spec.selector dos Services.
labels:
  - pairs:
      app.kubernetes.io/part-of: giomartins
