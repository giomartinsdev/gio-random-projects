# adminer no cluster — UI web para inspecionar bancos.
#
# Roda em paralelo ao container Docker (stacks/compute.yml), que ainda serve
# adminer.giomartins.dev -> 127.0.0.1:8092.
#
# ## A ponte com o postgres
#
# O adminer precisa alcançar o postgres, que continua em Docker. Pods NÃO
# alcançam a rede Docker (a política FORWARD do iptables é DROP), então a ponte
# é o Service sem selector `postgres` em gitops/apps/bridges/ — mantido pelo
# timer sync-external-endpoints.
#
# Este manifesto NÃO define Service nem EndpointSlice: a fonte é única, em
# bridges/. Antes havia um `postgres-external` aqui, que duplicava a ponte.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  labels:
    app.kubernetes.io/name: adminer
    app.kubernetes.io/part-of: giomartins
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adminer
    spec:
      containers:
        - name: adminer
          # Tag fixa (6.1.2), não `latest`. O container Docker rodava
          # `adminer:latest` — com tag móvel o manifesto não muda entre
          # builds e o ArgoCD não detecta imagem nova.
          image: adminer:6.1.2
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            # Sem isto, o adminer assume "localhost" e o usuário teria que
            # digitar o servidor à mão a cada login. `postgres-external` é o
            # nome do Service acima — resolve pelo DNS do cluster.
            - name: ADMINER_DEFAULT_SERVER
              value: "postgres"

