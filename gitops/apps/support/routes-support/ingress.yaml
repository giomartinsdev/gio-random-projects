# Rotas públicas do namespace support — Ingress NATIVO (2026-10-24).
#
# Padrões comuns (por que Ingress nativo, snippet aninhado, nome determinístico
# do upstream, proxy_http_version 1.1) estão em
# `gitops/apps/persistence/routes-persistence/ingress.yaml`.
#
# O rancher NÃO mora aqui: `Ingress` nativo só referencia Service do próprio
# namespace, e o Service `rancher` está em `cattle-system`. A rota dele vive em
# `gitops/apps/cattle-system/routes-cattle/ingress.yaml`.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-adminer
  annotations:
    nginx.org/client-max-body-size: "50m"
    nginx.org/websocket-services: "adminer"
    nginx.org/location-snippets: "proxy_http_version 1.1;"
spec:
  ingressClassName: nic
  rules:
    - host: adminer.giomartins.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adminer
                port:
                  number: 8080
---
# MCP de leitura do banco (crystaldba/postgres-mcp) para o agente. Sem Access
# (cliente não-browser); o token bearer do gateway é a autenticação. O
# streamable-http usa SSE: sem buffer e timeout de 1h nos dois sentidos — o
# mesmo que o legado fazia (`proxy_buffering off`, 3600s).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-db-mcp
  annotations:
    nginx.org/client-max-body-size: "50m"
    nginx.org/proxy-buffering: "false"
    nginx.org/proxy-read-timeout: "3600"
    nginx.org/proxy-send-timeout: "3600"
    nginx.org/websocket-services: "db-mcp-gateway"
    nginx.org/location-snippets: "proxy_http_version 1.1;"
spec:
  ingressClassName: nic
  rules:
    - host: db-mcp.giomartins.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: db-mcp-gateway
                port:
                  number: 8000
