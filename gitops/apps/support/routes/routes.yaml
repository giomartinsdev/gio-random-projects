# Rotas públicas do namespace support, migradas do ConfigMap `default.conf` do
# ingress legado para VirtualServers do NIC.
#
# ## vs-rancher e o upstream cross-namespace
#
# O VS mora em support, mas o Service `rancher` está em cattle-system. O NIC
# aceita upstream cross-ns com `service: <namespace>/<service>`. O certificado
# do rancher é self-signed e o TLS do upstream NÃO verifica certificado (o
# comportamento padrão do NIC = o `proxy_ssl_verify off` implícito do legado) —
# o handshake sobe sem CA própria.
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: vs-adminer
spec:
  host: adminer.giomartins.dev
  upstreams:
    - name: adminer
      service: adminer
      port: 8080
      client-max-body-size: 50m
  routes:
    - path: /
      action:
        pass: adminer
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: vs-db-mcp
spec:
  host: db-mcp.giomartins.dev
  upstreams:
    # O db-mcp-gateway serve respostas longas (ferramentas MCP que expõem
    # queries e SSE): o legado levava `proxy_buffering off` e
    # `proxy_read_timeout 3600s`. Aqui no upstream: buffering desligado e
    # timeouts de 1h nos dois sentidos.
    - name: db-mcp-gateway
      service: db-mcp-gateway
      port: 8000
      client-max-body-size: 50m
      buffering: false
      read-timeout: 1h
      send-timeout: 1h
  routes:
    - path: /
      action:
        pass: db-mcp-gateway
---
apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: vs-rancher
spec:
  host: rancher.giomartins.dev
  upstreams:
    - name: rancher-tls
      service: cattle-system/rancher
      port: 443
      tls:
        enable: true
      client-max-body-size: 50m
  routes:
    - path: /
      action:
        pass: rancher-tls
