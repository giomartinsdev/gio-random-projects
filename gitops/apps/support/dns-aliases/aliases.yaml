# aliases — a ponte de DNS entre namespaces, versionada.
#
# ## Por que isto existe
#
# Namespace é fronteira de DNS. `postgres` resolve para
# `postgres.<namespace-do-cliente>.svc.cluster.local` — só dentro do próprio
# namespace. Quando o Postgres foi para `persistence` e o `domain-api` ficou em
# `applications`, o nome `postgres` deixou de resolver para o cliente.
#
# E o nome está DENTRO de Secrets:
#
#   postgres://usuario:senha@postgres:5432/domain
#
# Reescrever esses Secrets para `postgres.persistence.svc.cluster.local` seria
# editar segredo com senha, em produção, em ~10 lugares — exatamente o tipo de
# mudança em massa que este repositório evita. A saída é um `ExternalName` no
# namespace do consumidor: o nome curto continua valendo, e só a resolução muda.
#
# Provado em /tmp/prova3.sh (prova B): `t-svc:8080` respondeu de outro namespace.
#
# ## Por que `ExternalName` e não um Service com selector
#
# Selector só enxerga pod do próprio namespace — não atravessa a fronteira que
# estamos criando. `ExternalName` é um CNAME: o cliente resolve o nome e disca
# para o IP do ClusterIP do outro namespace. Porta não é proxiada, então o
# cliente tem que discar a porta certa. Todos discam (5432, 5672, 6379, 80,
# 4318), então funciona.
#
# ## Por que não está no git como manifesto solto
#
# Está: este arquivo. Mas ele NÃO é um diretório em `gitops/apps/` — o
# ApplicationSet criaria uma Application por pasta e ela não teria nada a
# reconciliar. Ele entra como recurso do namespace consumidor, listado no
# kustomization daquele namespace.
#
# ## `metadata.namespace` explícito
#
# Cada alias declara o namespace de destino. Sem isso, `kustomize build` não
# sabe onde colocá-lo e o ArgoCD usaria `destination.namespace` — que é o do
# produtor quando o consumidor é outro.
---
# applications -> observability
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: applications
  labels:
    app.kubernetes.io/part-of: giomartins
    giomartins.dev/role: alias
  annotations:
    giomartins.dev/alias-of: alloy.observability.svc.cluster.local
spec:
  type: ExternalName
  externalName: alloy.observability.svc.cluster.local
  ports:
    - name: http
      port: 4318
      protocol: TCP
---
# applications -> persistence
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: applications
  labels:
    app.kubernetes.io/part-of: giomartins
    giomartins.dev/role: alias
  annotations:
    giomartins.dev/alias-of: postgres.persistence.svc.cluster.local
spec:
  type: ExternalName
  externalName: postgres.persistence.svc.cluster.local
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
