# ingress — o nginx que serve os 19 hosts. Fatia 8.
#
# ## O que este arquivo é, e o que ele NÃO é
#
# É o **mesmo** `nginx:1.27-alpine` que hoje roda em Docker (`network_mode: host`,
# porta 80), com o **mesmo** `default.conf` (403 linhas, byte-idêntico),
# montado do mesmo jeito (read-only em `/etc/nginx/conf.d/`). Não é uma
# reescrita para `Ingress` objects, e isso é deliberado.
#
# Não é o `ingress-nginx` do cluster. Aquele controller está fora de suporte
# desde março/2026, tem **zero** `Ingress` objects e não serve tráfego nenhum
# (escuta em 30945/30421). Migrar 19 hosts para ele seria trocar um nginx por
# outro e ainda reescrever cada `proxy_pass` como um `Ingress` — dois riscos
# para ganho zero. Fica como dívida registrada no README.
#
# ## Por que `hostNetwork: true` é obrigatório, e não uma conveniência
#
# O `default.conf` fala com os backends em `127.0.0.1:<NodePort>`:
#
#   domain.giomartins.dev   -> 127.0.0.1:30800   (NodePort do pod)
#   grafana.giomartins.dev  -> 127.0.0.1:30300
#   ai.giomartins.dev       -> 127.0.0.1:20128   (container Docker, ainda)
#
# Num pod comum, `127.0.0.1` é o loopback **do pod**, onde ninguém escuta — e
# os 19 hosts dariam 502 de uma vez. Com `hostNetwork`, o pod compartilha a
# netns do host e `127.0.0.1` volta a significar o que significava. É o mesmo
# motivo pelo qual todas as Services de backend têm NodePort: a convenção
# `80xx -> 308xx` existe para este arquivo.
#
# A alternativa "mais cloud native" seria trocar os 23 `proxy_pass` por nomes
# de Service do cluster. Isso reescreveria o roteamento de 19 hosts na mesma
# janela em que se muda quem serve a porta 80 — e um erro de digitação em uma
# linha derrubaria SÓ aquele host, sem erro visível. Não se faz.
#
# ## Por que não há Service
#
# Um Service existe para dar um IP/nome estável a pods. Aqui quem precisa
# alcançar o ingress é o **Cloudflare**, que fala com o IP do host na porta 80 —
# que o `hostNetwork` já entrega. Um Service não teria comprador.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
  labels:
    app.kubernetes.io/name: ingress
spec:
  # `replicas: 1` é o estado final. O corte é feito por
  # `gitops/bootstrap/corta-ingress.sh`, que para o container Docker (dono da
  # porta 80) e só então espera este pod. Enquanto o container existir e estiver
  # de pé, esta réplica NÃO sobe ("bind() to 0.0.0.0:80 failed") — a colisão é a
  # trava, e o script resolve a ordem.
  replicas: 1
  # Recreate: duas instâncias com `hostNetwork` disputariam a porta 80, e o
  # RollingUpdate padrão tentaria exatamente isso.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress
    spec:
      hostNetwork: true
      # O nginx do host não usa DNS: todos os upstreams são `127.0.0.1`. Manter
      # `ClusterFirst` faria o pod herdar o `/etc/resolv.conf` do cluster sem
      # necessidade. `Default` herda o do host, que é o mesmo comportamento do
      # container em Docker.
      dnsPolicy: Default
      # Sem isto o pod espera o `hostNetwork` "ficar pronto" e pode ser agendado
      # em outro nó. Nó único hoje, mas o campo documenta a intenção.
      terminationGracePeriodSeconds: 30
      containers:
        - name: ingress
          # Mesma imagem do container em produção, fixada pelo digest que está
          # rodando (`docker image inspect ingress`). A tag `1.27-alpine` sozinha
          # viraria outra imagem em silêncio no próximo pull.
          image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # `nginx -t` já roda no entrypoint da imagem; o probe HTTP prova que
          # ele está de fato servindo. `GET /` no `default_server` devolve 444
          # (conexão fechada) SEM Host — o que um probe HTTP trataria como
          # falha. Por isso o probe manda o header Host de um vhost real e
          # aceita qualquer resposta < 500: o que se mede é "o nginx atendeu",
          # não "o backend está saudável" (isso é problema do backend).
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: domain.giomartins.dev
            # 444 (default_server) e 502 (backend fora) contam como resposta —
            # o nginx está no ar. Só 000/conexão recusada é falha, e esse não
            # chega como status.
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            # O container em Docker não tem limite. Um nginx de proxy com 19
            # vhosts usa ~10Mi; 256Mi é teto de segurança, não previsão.
            limits:
              memory: 256Mi
          volumeMounts:
            # Mesmo caminho e mesmo modo do bind mount do Docker:
            # /opt/giomartins/stacks/ingress/default.conf -> /etc/nginx/conf.d/default.conf:ro
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: ingress-conf
