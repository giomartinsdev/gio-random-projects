# Receives OTLP-converted samples pushed by alloy (the
# --web.enable-remote-write-receiver flag on the container command) and
# scrapes the observability stack's own /metrics endpoints. No
# per-app scrape configs: apps push, they don't expose :9090.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]