# observability.yml — Grafana + Loki + Prometheus + Tempo + Alloy (migra
# `modules/compute/services/observability` do TF).
#
# Reusa os named volumes obs_* do TF (external). Os configs que o TF injetava
# via `upload` agora são bind mounts de ./observability/ (mesma pasta).
#
# Segredo: GRAFANA_ADMIN_PASSWORD (era random_password.grafana_admin_password).
#
# memory 512 / swap 1024 em cada, como no TF. Alloy precisa do docker.sock
# (lê o stdout de todos os containers) e publica 4318 loopback (o ingress
# entrega otel.giomartins.dev).
name: observability

services:
  loki:
    image: grafana/loki:3.7.7
    container_name: loki
    # Migrado para o k8s em 2026-10-23. `profiles` e a trava: sem
    # `--profile retired`, o `compose up -d` do Dockhand (03:00 UTC)
    # ressuscita o container e ele disputa porta com o pod.
    profiles: ["retired"]
    restart: "no"
    labels:
      giomartins.dev/project: observability
    user: "0"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - obs_loki_data:/loki
    mem_limit: 512m
    memswap_limit: 1024m
    logging:
      options: { max-size: "10m", max-file: "3" }
    networks: [apps]

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    # Migrado para o k8s em 2026-10-23. `profiles` e a trava: sem
    # `--profile retired`, o `compose up -d` do Dockhand (03:00 UTC)
    # ressuscita o container e ele disputa porta com o pod.
    profiles: ["retired"]
    restart: "no"
    labels:
      giomartins.dev/project: observability
    user: "0"
    entrypoint: ["/bin/prometheus"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - obs_prom_data:/prometheus
    mem_limit: 512m
    memswap_limit: 1024m
    logging:
      options: { max-size: "10m", max-file: "3" }
    networks: [apps]

  tempo:
    image: grafana/tempo:2.10.8
    container_name: tempo
    # Migrado para o k8s em 2026-10-23. `profiles` e a trava: sem
    # `--profile retired`, o `compose up -d` do Dockhand (03:00 UTC)
    # ressuscita o container e ele disputa porta com o pod.
    profiles: ["retired"]
    restart: "no"
    labels:
      giomartins.dev/project: observability
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - obs_tempo_data:/var/tempo
    # 1g, não 512m: o replay do WAL + a leitura do meta.json de ~2.5k blocos
    # no boot passa fácil de meio giga. Com 512m o container era OOMKilled
    # durante o startup, caía em crash loop (~24k restarts desde 19/10) e o
    # compactor nunca completava um ciclo -- daí os blocos de 72h+ nunca
    # saírem e o volume crescer até 1.6G.
    mem_limit: 1g
    memswap_limit: 2g
    logging:
      options: { max-size: "10m", max-file: "3" }
    networks: [apps]

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: alloy
    # Migrado para o k8s em 2026-10-23 -> o pod `alloy-logs`.
    #
    # Este container ficou por ULTIMO de proposito, como fonte de log dos
    # containers que ainda restassem. Mas ele virou peso morto de duas formas:
    #   1. escrevia em `loki:3100`, e o container `loki` foi parado. Desde
    #      entao cada batch falha com `server misbehaving` / conexao recusada
    #      e o log se perde;
    #   2. o POD `alloy-logs` ja monta o mesmo `docker.sock` e le os MESMOS
    #      containers (`loki.source.docker`), entregando no Loki do cluster.
    #      Verificado: 25 containers tailing no pod, incluindo os parados.
    #
    # Ou seja: parar este container nao tira visibilidade de nada. O que ele
    # fazia de util (logs de Docker) o pod faz; o que ele fazia de unico
    # (receiver OTLP em :4318 no host) tambem -- o pod expoe :4318 no
    # NodePort 30418, e o ingress ja aponta para la desde a armadilha 16.
    #
    # `depends_on` sai junto: ele citava loki/prometheus/tempo, todos
    # `profiles: ["retired"]` agora, e o compose recusa o projeto inteiro com
    # `depends on undefined service` -- derrubaria o stack todo no `up` das
    # 03:00 UTC.
    profiles: ["retired"]
    restart: "no"
    labels:
      giomartins.dev/project: observability
    user: "0"
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - obs_alloy_state:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 512m
    memswap_limit: 1024m
    logging:
      options: { max-size: "10m", max-file: "3" }
    networks: [apps]

  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: grafana
    # Migrado para o k8s em 2026-10-23. `profiles` e a trava: sem
    # `--profile retired`, o `compose up -d` do Dockhand (03:00 UTC)
    # ressuscita o container e ele disputa porta com o pod.
    profiles: ["retired"]
    restart: "no"
    labels:
      giomartins.dev/project: observability
    user: "0"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.giomartins.dev
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./observability/apps-overview.json:/etc/grafana/provisioning/dashboards/apps-overview.json:ro
      - obs_grafana_data:/var/lib/grafana
    mem_limit: 512m
    memswap_limit: 1024m
    logging:
      options: { max-size: "10m", max-file: "3" }
    networks: [apps]
    # `depends_on` removido junto com o profile: citava loki/prometheus/tempo,
    # todos retired, e o compose recusa o projeto inteiro
    # (`depends on undefined service`).

networks:
  apps:
    external: true
    name: apps

volumes:
  obs_loki_data:
    external: true
    name: obs_loki_data
  obs_prom_data:
    external: true
    name: obs_prom_data
  obs_tempo_data:
    external: true
    name: obs_tempo_data
  obs_alloy_state:
    external: true
    name: obs_alloy_state
  obs_grafana_data:
    external: true
    name: obs_grafana_data
