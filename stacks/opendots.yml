# opendots.yml — OpenDots (CopilotKit), template self-hosted de "Dots"
# (coworkers de IA) com Spaces/páginas + chat. Não é código nosso: a
# imagem é construída do upstream pinado pelo .github/workflows/
# opendots-ci-cd.yml e publicada em registry.giomartins.dev:5000/opendots.
#
# Escopo atual: chat + Spaces (target `app` do Dockerfile do upstream).
# Sem Calls (VOICE_API_KEY/Realtime), sem Slack e sem Dot computers
# (OpenBot) — esses entram como variáveis de stack quando ligados.
#
# Segredos (variáveis de stack no Dockhand):
#   OPENDOTS_OWNER_TOKEN            24+ chars; login local do app
#   OPENDOTS_INTELLIGENCE_API_KEY   CopilotKit Intelligence (runtime das conversas)
#   OPENDOTS_OPENAI_API_KEY         credencial do provider OpenAI-compatível
# Não-segredo (defaults abaixo, sobrescrevíveis):
#   OPENDOTS_OPENAI_BASE_URL  (default: o 9router interno)
#   OPENDOTS_OPENAI_MODEL
#   OPENDOTS_OWNER_ID         (KEEP STABLE — ele é dono das conversas)
name: opendots

services:
  opendots:
    image: ${OPENDOTS_IMAGE:-registry.giomartins.dev:5000/opendots:latest}
    container_name: opendots
    restart: unless-stopped
    init: true
    # Só o ingress (host network) alcança a app pelo loopback; nada de 0.0.0.0.
    ports:
      - "127.0.0.1:4310:4310"
    environment:
      HOST: 0.0.0.0
      PORT: "4310"
      DATABASE_PATH: /data/opendots.sqlite
      # Precisa ser EXATAMENTE a origem HTTPS do browser.
      APP_ORIGIN: https://dots.giomartins.dev
      OWNER_ID: ${OPENDOTS_OWNER_ID:-opendots-owner}
      OWNER_TOKEN: ${OPENDOTS_OWNER_TOKEN:?defina OPENDOTS_OWNER_TOKEN}
      INTELLIGENCE_API_KEY: ${OPENDOTS_INTELLIGENCE_API_KEY:-}
      OPENAI_API_KEY: ${OPENDOTS_OPENAI_API_KEY:-}
      # O 9router (stack compute) é OpenAI-compatível e está na rede `apps`.
      OPENAI_BASE_URL: ${OPENDOTS_OPENAI_BASE_URL:-http://9router:20128/v1}
      OPENAI_MODEL: ${OPENDOTS_OPENAI_MODEL:-}
      # Sem o worker de browser (target `browser`) nem key da Parallel.
      WEB_SEARCH_PROVIDER: ${OPENDOTS_WEB_SEARCH_PROVIDER:-disabled}
    volumes:
      - opendots-data:/data
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  opendots-data:
    name: opendots-data

networks:
  apps:
    external: true
