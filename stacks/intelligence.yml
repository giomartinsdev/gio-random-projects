# intelligence.yml — CopilotKit Intelligence SELF-HOSTED: o runtime que
# guarda as threads/conversas dos "Dots" do OpenDots (o equivalente local ao
# cloud-hosted do CopilotKit). É um serviço da plataforma, por isso vive numa
# stack própria — atualizar o OpenDots não reinicia a Intelligence, e vice-versa.
#
# Imagem all-in-one `composite` (app-api 4201 + realtime-gateway 4401 +
# thread-culler + db-migrations, tudo sob s6-overlay num container só), com
# Postgres e Redis próprios e dedicados. NÃO compartilha o postgres/redis do
# persistence.yml de propósito: são a base do Intelligence e ficam isolados.
#
# O `composite` fica na rede `apps` (via container_name `intelligence`) pra o
# OpenDots alcançar em http://intelligence:4201 / ws://intelligence:4401;
# Postgres e Redis ficam só na rede interna. As portas também saem no loopback
# do host, só pra debug/healthcheck.
#
# Segredos (variáveis de stack no Dockhand):
#   INTELLIGENCE_DB_PASSWORD        senha do Postgres dedicado
#   INTELLIGENCE_AUTH_SECRET        assinatura de sessão (32+ chars)
#   INTELLIGENCE_SECRET_KEY_BASE    chave do realtime-gateway (64+ bytes)
#   INTELLIGENCE_LICENSE_TOKEN      COPILOTKIT_LICENSE_TOKEN emitido pelo
#                                   dashboard do CopilotKit (plano Developer,
#                                   grátis). Sem ele as threads não ativam.
# Defaults (sobrescrevíveis como variável de stack):
#   INTELLIGENCE_RUNNER_AUTH_SECRET, INTELLIGENCE_ORGANIZATION_ID.
name: intelligence

services:
  postgres:
    image: postgres:16-alpine
    container_name: intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intelligence
      POSTGRES_PASSWORD: ${INTELLIGENCE_DB_PASSWORD:?defina INTELLIGENCE_DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - intelligence-postgres-data:/var/lib/postgresql/data
      - ./intelligence/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelligence -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [intelligence-internal]

  redis:
    image: redis:7-alpine
    container_name: intelligence-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [intelligence-internal]

  # app-api + realtime-gateway + thread-culler + db-migrations num só container.
  intelligence:
    image: ghcr.io/copilotkit/intelligence/composite:0.13.8
    container_name: intelligence
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4201:4201"
      - "127.0.0.1:4401:4401"
    environment:
      DATABASE_URL: postgresql://intelligence:${INTELLIGENCE_DB_PASSWORD:?defina INTELLIGENCE_DB_PASSWORD}@postgres:5432/intelligence_app
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${INTELLIGENCE_AUTH_SECRET:?defina INTELLIGENCE_AUTH_SECRET}
      RUNNER_AUTH_SECRET: ${INTELLIGENCE_RUNNER_AUTH_SECRET:-dev-runner-secret}
      SECRET_KEY_BASE: ${INTELLIGENCE_SECRET_KEY_BASE:?defina INTELLIGENCE_SECRET_KEY_BASE}
      # A chave pré-semeada do composite (cpk_sPRVSEED_...) vive nesta org.
      DEFAULT_ORGANIZATION_ID: ${INTELLIGENCE_ORGANIZATION_ID:-casa-de-erlang}
      COPILOTKIT_LICENSE_TOKEN: ${INTELLIGENCE_LICENSE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - intelligence-internal
      - apps
    security_opt:
      - no-new-privileges:true

volumes:
  intelligence-postgres-data:
    name: intelligence-postgres-data

networks:
  intelligence-internal:
    name: intelligence-internal
  apps:
    external: true
    name: apps
