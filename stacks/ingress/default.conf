server {
  listen 80;
  server_name clubs.giomartins.dev;

  # Preview de link: um crawler pedindo /club/:id, /match/:id ou /player/:id
  # recebe o HTML com meta tags do clubs-api (og_api 8017); humanos seguem
  # pro SPA no location / abaixo.
  location ~ ^/(club|player|match)/([^/]+)/?$ {
    set $og_route "";
    if ($is_crawler) {
      set $og_route "http://127.0.0.1:8017/og/$1/$2";
    }
    if ($og_route = "") {
      set $og_route "http://127.0.0.1:9000/clubs-frontend/index.html";
    }
    proxy_pass $og_route;
    proxy_set_header Host $host;
  }

  location ~ ^/.*\.[a-zA-Z0-9]+$ {
    proxy_pass http://127.0.0.1:9000/clubs-frontend$uri;
  }

  location / {
    rewrite ^ /clubs-frontend/index.html break;
    proxy_pass http://127.0.0.1:9000;
  }
}
