server {
  listen 80;
  server_name maus.giomartins.dev;
  # OpenMausBot (stack maus.yml). O harness dele liga em 127.0.0.1:8799 e o
  # Caddy embutido (mesma netns) publica a loopback 8799. O TLS é do
  # Cloudflare; o Caddy interno reescreve X-Forwarded-Proto pra https.
  location / {
    proxy_pass http://127.0.0.1:8799;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # O chat streama (SSE); sem isto o nginx bufferiza os eventos e a
    # resposta só aparece no fim.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

