    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

# --- static sites (MinIO buckets, path-style) -----------------------------
# O SPA é servido direto do bucket no MinIO (127.0.0.1:9000), sem container.
# Asset real (com extensão) vira a chave literal; qualquer outra rota cai no
# index.html. clubs.giomartins.dev TINHA preview de link (og_api 8017) — está
# pausado desde 2026-10-19 e hoje responde 410 (ver o fim do arquivo).

server {
  listen 80;
  server_name tela.giomartins.dev;

  location ~ ^/.*\.[a-zA-Z0-9]+$ {
    proxy_pass http://127.0.0.1:9000/tela-frontend$uri;
  }

  location / {
    rewrite ^ /tela-frontend/index.html break;
    proxy_pass http://127.0.0.1:9000;
  }
}

