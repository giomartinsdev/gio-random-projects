server {
  listen 80;
  server_name maus.giomartins.dev;
  # OpenMausBot (stack maus.yml). O harness dele liga em 127.0.0.1:8799 e o
  # Caddy embutido (mesma netns) publica a loopback 8799. O TLS é do
  # Cloudflare; o Caddy interno reescreve X-Forwarded-Proto pra https.
  location / {
    proxy_pass http://127.0.0.1:8799;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # O chat streama (SSE); sem isto o nginx bufferiza os eventos e a
    # resposta só aparece no fim.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

server {
  listen 80;
  server_name finance-api.giomartins.dev;
  # finance-api (ACL do contexto financeiro). Auth propria (X-API-Key), sem
  # Access: o SPA em finance.giomartins.dev chama este host cross-origin pelo
  # browser. Sem CORS aqui -- a API responde os cabecalhos (Finance_CORS_ORIGINS
  # no stack finance).
  location / {
    proxy_pass http://127.0.0.1:8018;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# Webhook do WhatsApp (Meta) -> finance-whatsapp-worker. Hostname PUBLICO
# (esta em excluded_hostnames do Terraform): a Meta nao passa por um redirect
# de SSO Google. A defesa e a assinatura X-Hub-Signature-256 + a verificacao
# de origem, nao o Access.
server {
  listen 80;
  server_name finance-webhook.giomartins.dev;
  location / {
    proxy_pass http://127.0.0.1:8019;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# --- static sites (MinIO buckets, path-style) -----------------------------
# O SPA é servido direto do bucket no MinIO (127.0.0.1:9000), sem container.
# Asset real (com extensão) vira a chave literal; qualquer outra rota cai no
# index.html. clubs.giomartins.dev tem preview de link (og_api 8017).

server {
  listen 80;
  server_name tela.giomartins.dev;

  location ~ ^/.*\.[a-zA-Z0-9]+$ {
    proxy_pass http://127.0.0.1:9000/tela-frontend$uri;
  }

  location / {
    rewrite ^ /tela-frontend/index.html break;
    proxy_pass http://127.0.0.1:9000;
  }
}

