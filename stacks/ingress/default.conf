# --- rancher --------------------------------------------------------------
# O Rancher (gitops/bootstrap/rancher/, NodePort 31844) so fala HTTPS: o
# Service do chart expoe 80 e 443, mas a 80 apenas redireciona, e o proprio
# Rancher exige TLS no server-url. Entao este e o UNICO server{} que usa
# proxy_pass https:// -- nos outros o upstream e HTTP puro.
#
# proxy_ssl_verify off e deliberado: o certificado do Rancher e auto-assinado
# (tls=rancher) e nasce para o hostname rancher.giomartins.dev. A verificacao
# que importa acontece no NAVEGADOR (que ve o certificado do Cloudflare, nao
# este), e a perna nginx->Rancher e loopback -- nao atravessa rede. Trocar
# para proxy_ssl_verify on exigiria montar o CA do Rancher
# (cattle-system/tls-rancher) dentro do container do ingress; fica para
# quando o Rancher sair do auto-assinado (divida 12 no gitops/README.md).
server {
  listen 80;
  server_name rancher.giomartins.dev;

  location / {
    proxy_pass https://127.0.0.1:31844;
    proxy_http_version 1.1;

    # O Rancher decide URLs absolutas (redirects, links do agent) a partir do
    # Host. Sem repassar o Host original, ele responderia com 127.0.0.1:31844.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Sem isto o Rancher recusa o handshake por SNI ausente no upstream.
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify off;

    # WebSocket: o shell do pod no browser e o streaming de logs usam
    # /v3/clusters/.../shell e /k8s/clusters/.../pods/.../log.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # O SPA e o streaming de logs: buffer desligado evita log "congelado".
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
