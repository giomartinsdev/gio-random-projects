map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Crawlers que desenham o cartão de preview de link (Open Graph). O SPA é
# estático e nenhum deles roda JavaScript, então um link de clube/partida/
# jogador chegaria sem título nem descrição. Para essas requisições, os
# detalhes abaixo mandam para o backend de preview (og_api) em vez do MinIO.
map $http_user_agent $is_crawler {
  default 0;
  ~*(facebookexternalhit|Facebot|Twitterbot|Discordbot|WhatsApp|Slackbot|TelegramBot|LinkedInBot|Pinterest|redditbot|Googlebot|bingbot|Applebot|AhrefsBot|GPTBot|ClaudeBot|Embedly|vkShare|W3C_Validator|Mastodon|Bluesky) 1;
}

client_max_body_size 50m;

# Anything with no matching server_name below (a raw IP hit, a forgotten
# hostname) gets dropped rather than falling through to whichever service
# happens to be first.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

# --- services (container ports, loopback) ---------------------------------
# Cada bloco mapeia um hostname para 127.0.0.1:<porta>. A porta tem que
# bater com o publish de cada container (loopback). registry.giomartins.dev
# NÃO entra aqui de propósito: Docker resolve hostname puro como HTTPS/443,
# e nada escuta 443; o registry publica 5000 direto.
# Quando um app migrar pra stack, se a porta loopback mudar, ajuste aqui.

server {
  listen 80;
  server_name domain.giomartins.dev;
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

