# --- static sites (MinIO buckets, path-style) -----------------------------
# O SPA é servido direto do bucket no MinIO, sem container. Migrado em
# 2026-10-23: 127.0.0.1:9000 (container) -> 127.0.0.1:30900 (NodePort do pod).
# O container continua de pe e ocioso -- e o rollback, uma linha.
# Asset real (com extensão) vira a chave literal; qualquer outra rota cai no

server {
  listen 80;
  server_name tela.giomartins.dev;

  location ~ ^/.*\.[a-zA-Z0-9]+$ {
    proxy_pass http://127.0.0.1:30900/tela-frontend$uri;
  }

  location / {
    rewrite ^ /tela-frontend/index.html break;
    proxy_pass http://127.0.0.1:30900;
  }
}

