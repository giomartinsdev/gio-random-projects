map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

client_max_body_size 50m;

# Anything with no matching server_name below (a raw IP hit, a forgotten
# hostname) gets dropped rather than falling through to whichever service
# happens to be first.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

# --- services (container ports, loopback) ---------------------------------
# Cada bloco mapeia um hostname para 127.0.0.1:<porta>. A porta tem que
# bater com o publish de cada container (loopback). registry.giomartins.dev
# NÃO entra aqui de propósito: Docker resolve hostname puro como HTTPS/443,
# e nada escuta 443; o registry publica 5000 direto.
# Quando um app migrar pra stack, se a porta loopback mudar, ajuste aqui.

server {
  listen 80;
  server_name domain.giomartins.dev;
  # Migrado para o pod em 2026-10-23 (NodePort 30800). O container Docker em
  # :8000 continua de pe e ocioso -- e o rollback, uma linha.
  location / {
    proxy_pass http://127.0.0.1:30800;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

