# compute.yml — os serviços de plataforma (migra `modules/compute/services/*`
# do TF, exceto observability que fica em observability.yml).
#
# Reusa os named volumes do TF (external). Segredos via variáveis de stack
# no Dockhand:
#   REGISTRY_PASSWORD                 (input, não gerado pelo TF)
#   BESZEL_AGENT_KEY                  (input; se vazio, remova o serviço)
#   VAULTWARDEN_ADMIN_TOKEN           (era random_password.vaultwarden_admin_token)
#   NINEROUTER_JWT_SECRET             (era random_password.ninerouter_jwt_secret)
#   NINEROUTER_INITIAL_PASSWORD       (era random_password.ninerouter_initial_password)
#   VAULTWARDEN_ACCOUNT_EMAIL         (input; gate do vaultwarden-api)
#   VAULTWARDEN_ACCOUNT_MASTER_PASSWORD
#   VAULTWARDEN_API_CLIENT_ID
#   VAULTWARDEN_API_CLIENT_SECRET
#   VAULTWARDEN_BRIDGE_API_KEY        (era random_password.vaultwarden_bridge_api_key)
#
# O watchtower (e o one-shot `registry-docker-config`, que só existia pra
# ele) foi removido: o Dockhand faz update-check/redeploy das stacks, então
# não há mais auto-update por label. As variáveis WATCHTOWER_* podem sair do
# stack no Dockhand (ficaram inúteis).
name: compute

services:
  # --- registry privado + auth -------------------------------------------
  # One-shot que escreve o htpasswd no volume que o registry lê.
  registry-htpasswd:
    image: httpd:2.4-alpine
    container_name: htpasswd-init
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - 'htpasswd -Bbn "$$REGISTRY_USER" "$$REGISTRY_PASSWORD" > /auth/htpasswd'
    environment:
      REGISTRY_USER: ${REGISTRY_USER:-admin}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:?defina REGISTRY_PASSWORD}
    volumes:
      - registry_registry-auth:/auth

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    depends_on:
      registry-htpasswd:
        condition: service_completed_successfully
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_HTTP_RELATIVEURLS: "true"
    # Público de propósito (não loopback): CI faz push e o hostname não é
    # proxiado pelo Cloudflare (ele proxeia 80/443; o Docker fala :5000).
    ports:
      - "5000:5000"
    volumes:
      - registry_registry-data:/var/lib/registry
      - registry_registry-auth:/auth:ro

  # --- monitoring (Beszel) ------------------------------------------------
  beszel-hub:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - beszel_data:/beszel_data
    networks: [apps]

  # Só existe se você tiver a agent key (o TF criava com count=0 sem ela).
  # Preencha BESZEL_AGENT_KEY ou remova o serviço.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    environment:
      LISTEN: "45876"
      KEY: ${BESZEL_AGENT_KEY:?defina BESZEL_AGENT_KEY ou remova o beszel-agent}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [apps]

  # --- Vaultwarden (+ bridge de segredos) ---------------------------------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.giomartins.dev
      SIGNUPS_ALLOWED: "true"
      WEBSOCKET_ENABLED: "true"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?defina VAULTWARDEN_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - vaultwarden_data:/data
    networks: [apps]

  vaultwarden-api:
    image: registry.giomartins.dev:5000/vaultwarden-api:latest
    container_name: vaultwarden-api
    restart: unless-stopped
    environment:
      VAULTWARDEN_URL: http://vaultwarden
      VAULTWARDEN_EMAIL: ${VAULTWARDEN_ACCOUNT_EMAIL:?defina VAULTWARDEN_ACCOUNT_EMAIL}
      VAULTWARDEN_PASSWORD: ${VAULTWARDEN_ACCOUNT_MASTER_PASSWORD:?defina VAULTWARDEN_ACCOUNT_MASTER_PASSWORD}
      VAULTWARDEN_CLIENT_ID: ${VAULTWARDEN_API_CLIENT_ID:-}
      VAULTWARDEN_CLIENT_SECRET: ${VAULTWARDEN_API_CLIENT_SECRET:-}
      API_KEY: ${VAULTWARDEN_BRIDGE_API_KEY:?defina VAULTWARDEN_BRIDGE_API_KEY}
    networks: [apps]

  # --- adminer (acesso ad-hoc ao Postgres) --------------------------------
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8080"
    networks: [apps]

  # --- 9router (proxy de IA) ----------------------------------------------
  9router:
    image: ghcr.io/decolua/9router:latest
    container_name: 9router
    restart: unless-stopped
    environment:
      JWT_SECRET: ${NINEROUTER_JWT_SECRET:?defina NINEROUTER_JWT_SECRET}
      INITIAL_PASSWORD: ${NINEROUTER_INITIAL_PASSWORD:?defina NINEROUTER_INITIAL_PASSWORD}
      PORT: "20128"
      NODE_ENV: production
      BASE_URL: https://ai.giomartins.dev
      NEXT_PUBLIC_BASE_URL: https://ai.giomartins.dev
      AUTH_COOKIE_SECURE: "true"
      REQUIRE_API_KEY: "false"
      ENABLE_REQUEST_LOGS: "true"
      OBSERVABILITY_ENABLED: "true"
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - ninerouter_data:/app/data
    networks: [apps]

  # --- ingress (host network, a única porta HTTP aberta) ------------------
  ingress:
    image: nginx:1.27-alpine
    container_name: ingress
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./ingress/default.conf:/etc/nginx/conf.d/default.conf:ro

  # --- Dockhand (gerencia as stacks; matching paths persistidos) ----------
  # ATENÇÃO: o Dockhand gerencia este próprio arquivo. Ao subir/editar o
  # compute.yml por ele, ele pode recriar a si mesmo — o deploy segue, mas
  # a sessão do navegador cai. Preferível subir este uma vez por CLI.
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    user: "0"
    environment:
      DATA_DIR: /opt/dockhand
      STACKS_DIR: /opt/stacks
      EXPORT_METRICS: "true"
      COOKIE_SECURE: "true"
      TRUST_FORWARDED_HEADERS: "true"
    ports:
      - "127.0.0.1:8093:3000"
    volumes:
      - /opt/dockhand:/opt/dockhand
      - /opt/stacks:/opt/stacks
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [apps]

networks:
  apps:
    external: true
    name: apps

volumes:
  registry_registry-data:
    external: true
    name: registry_registry-data
  registry_registry-auth:
    external: true
    name: registry_registry-auth
  beszel_data:
    external: true
    name: beszel_data
  vaultwarden_data:
    external: true
    name: vaultwarden_data
  ninerouter_data:
    external: true
    name: ninerouter_data
