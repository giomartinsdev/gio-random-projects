# compute.yml — os serviços de plataforma (migra `modules/compute/services/*`
# do TF, exceto observability em observability.yml e o registry/Dockhand em
# core.yml).
#
# Reusa os named volumes do TF (external). Segredos via variáveis de stack
# no Dockhand:
#   VAULTWARDEN_ADMIN_TOKEN           (era random_password.vaultwarden_admin_token)
#   NINEROUTER_JWT_SECRET             (era random_password.ninerouter_jwt_secret)
#   NINEROUTER_INITIAL_PASSWORD       (era random_password.ninerouter_initial_password)
#   VAULTWARDEN_ACCOUNT_EMAIL         (input; gate do vaultwarden-api)
#   VAULTWARDEN_ACCOUNT_MASTER_PASSWORD
#   VAULTWARDEN_API_CLIENT_ID
#   VAULTWARDEN_API_CLIENT_SECRET
#   VAULTWARDEN_BRIDGE_API_KEY        (era random_password.vaultwarden_bridge_api_key)
#   POSTGRES_PASSWORD                 (a MESMA do persistence — Evolution API)
#   RABBITMQ_PASSWORD                 (a MESMA do persistence — Evolution API)
#   EVOLUTION_API_KEY                 (apikey global da Evolution API; nova)
#
# O watchtower foi removido: o Dockhand faz update-check/redeploy das stacks,
# então não há mais auto-update por label. As variáveis WATCHTOWER_* podem
# sair do stack no Dockhand (ficaram inúteis).
name: compute

services:
  # --- Vaultwarden (+ bridge de segredos) ---------------------------------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.giomartins.dev
      SIGNUPS_ALLOWED: "true"
      WEBSOCKET_ENABLED: "true"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?defina VAULTWARDEN_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - vaultwarden_data:/data
    networks: [apps]

  vaultwarden-api:
    image: registry.giomartins.dev:5000/vaultwarden-api:latest
    container_name: vaultwarden-api
    restart: unless-stopped
    environment:
      VAULTWARDEN_URL: http://vaultwarden
      VAULTWARDEN_EMAIL: ${VAULTWARDEN_ACCOUNT_EMAIL:?defina VAULTWARDEN_ACCOUNT_EMAIL}
      VAULTWARDEN_PASSWORD: ${VAULTWARDEN_ACCOUNT_MASTER_PASSWORD:?defina VAULTWARDEN_ACCOUNT_MASTER_PASSWORD}
      VAULTWARDEN_CLIENT_ID: ${VAULTWARDEN_API_CLIENT_ID:-}
      VAULTWARDEN_CLIENT_SECRET: ${VAULTWARDEN_API_CLIENT_SECRET:-}
      API_KEY: ${VAULTWARDEN_BRIDGE_API_KEY:?defina VAULTWARDEN_BRIDGE_API_KEY}
    networks: [apps]

  # --- adminer (acesso ad-hoc ao Postgres) --------------------------------
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8080"
    networks: [apps]

  # --- 9router (proxy de IA) ----------------------------------------------
  9router:
    image: ghcr.io/decolua/9router:latest
    container_name: 9router
    restart: unless-stopped
    environment:
      JWT_SECRET: ${NINEROUTER_JWT_SECRET:?defina NINEROUTER_JWT_SECRET}
      INITIAL_PASSWORD: ${NINEROUTER_INITIAL_PASSWORD:?defina NINEROUTER_INITIAL_PASSWORD}
      PORT: "20128"
      NODE_ENV: production
      BASE_URL: https://ai.giomartins.dev
      NEXT_PUBLIC_BASE_URL: https://ai.giomartins.dev
      AUTH_COOKIE_SECURE: "true"
      REQUIRE_API_KEY: "false"
      ENABLE_REQUEST_LOGS: "true"
      OBSERVABILITY_ENABLED: "true"
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - ninerouter_data:/app/data
    networks: [apps]

  # --- Evolution API (gateway WhatsApp -> RabbitMQ) ------------------------
  # Conecta no postgres e no rabbitmq do stack `persistence` (rede `apps`).
  # Persiste no schema `evolution_api` do banco `domain` (isolado das tabelas
  # do domain app) e publica TODO evento num exchange topic `evolution`, com
  # uma fila global por evento (`evolution.<evento>`) pra os microsserviços
  # ao redor consumirem. Cache num Redis dedicado. Manager embutido em
  # /manager (login = apikey). Exposto em https://evolution.giomartins.dev
  # (protegido por Cloudflare Access, como as outras UIs).
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      evolution-db-init:
        condition: service_completed_successfully
      evolution-redis:
        condition: service_started
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: https://evolution.giomartins.dev
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      LANGUAGE: pt-BR
      CONFIG_SESSION_PHONE_CLIENT: Evolution API
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN,INFO,WEBSOCKET
      LOG_COLOR: "true"
      LOG_BAILEYS: error
      TELEMETRY_ENABLED: "false"
      # Banco: schema dedicado no postgres do persistence.
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER:-domain}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-domain}?schema=evolution_api"
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_IS_ON_WHATSAPP: "true"
      # Cache dedicado (o redis do persistence foi removido na migração).
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # RabbitMQ: exchange topic `evolution` + uma fila global por evento.
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URI: "amqp://${RABBITMQ_USER:-domain}:${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD}@rabbitmq:5672/"
      RABBITMQ_EXCHANGE_NAME: evolution
      RABBITMQ_GLOBAL_ENABLED: "true"
      RABBITMQ_PREFIX_KEY: evolution
      RABBITMQ_EVENTS_APPLICATION_STARTUP: "true"
      RABBITMQ_EVENTS_INSTANCE_CREATE: "true"
      RABBITMQ_EVENTS_INSTANCE_DELETE: "true"
      RABBITMQ_EVENTS_QRCODE_UPDATED: "true"
      RABBITMQ_EVENTS_MESSAGES_SET: "true"
      RABBITMQ_EVENTS_MESSAGES_UPSERT: "true"
      RABBITMQ_EVENTS_MESSAGES_EDITED: "true"
      RABBITMQ_EVENTS_MESSAGES_UPDATE: "true"
      RABBITMQ_EVENTS_MESSAGES_DELETE: "true"
      RABBITMQ_EVENTS_SEND_MESSAGE: "true"
      RABBITMQ_EVENTS_SEND_MESSAGE_UPDATE: "true"
      RABBITMQ_EVENTS_CONTACTS_SET: "true"
      RABBITMQ_EVENTS_CONTACTS_UPSERT: "true"
      RABBITMQ_EVENTS_CONTACTS_UPDATE: "true"
      RABBITMQ_EVENTS_PRESENCE_UPDATE: "true"
      RABBITMQ_EVENTS_CHATS_SET: "true"
      RABBITMQ_EVENTS_CHATS_UPSERT: "true"
      RABBITMQ_EVENTS_CHATS_UPDATE: "true"
      RABBITMQ_EVENTS_CHATS_DELETE: "true"
      RABBITMQ_EVENTS_GROUPS_UPSERT: "true"
      RABBITMQ_EVENTS_GROUP_UPDATE: "true"
      RABBITMQ_EVENTS_GROUP_PARTICIPANTS_UPDATE: "true"
      RABBITMQ_EVENTS_CONNECTION_UPDATE: "true"
      RABBITMQ_EVENTS_REMOVE_INSTANCE: "true"
      RABBITMQ_EVENTS_LOGOUT_INSTANCE: "true"
      RABBITMQ_EVENTS_CALL: "true"
      RABBITMQ_EVENTS_TYPEBOT_START: "true"
      RABBITMQ_EVENTS_TYPEBOT_CHANGE_STATUS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks: [apps]

  # Cache do Evolution (dedicado).
  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data
    networks: [apps]

  # One-shot: garante o schema `evolution_api` no postgres do persistence
  # (o Prisma da Evolution roda `migrate deploy` no boot e precisa dele).
  # Idempotente; espera o postgres responder (stacks não têm depends_on
  # entre si).
  evolution-db-init:
    image: postgres:17-alpine
    container_name: evolution-db-init
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domain}
      POSTGRES_DB: ${POSTGRES_DB:-domain}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        until pg_isready -h postgres -U "$$POSTGRES_USER" >/dev/null 2>&1; do sleep 1; done
        psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS evolution_api'
    networks: [apps]

  # --- ingress (host network, a única porta HTTP aberta) ------------------
  ingress:
    image: nginx:1.27-alpine
    container_name: ingress
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./ingress/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  apps:
    external: true
    name: apps

volumes:
  vaultwarden_data:
    external: true
    name: vaultwarden_data
  ninerouter_data:
    external: true
    name: ninerouter_data
  evolution_instances:
    name: evolution_instances
  evolution_redis_data:
    name: evolution_redis_data
