# minecraft.yml — All the Mods 11 (ATM11) num servidor NeoForge.
#
# Antes daqui era Paper puro. O pack ATM11 muda a natureza do servidor:
# mods de verdade (293), não plugins — então não existe mais compatibilidade
# com plugin de Paper e a whitelist passa a ser um MOD.
#
# ── Versão ────────────────────────────────────────────────────────────────
# O ATM11 é declarado em **26.1.2**, com NeoForge **26.1.2.109** (lido do
# manifest.json do próprio zip — não é chute). Isso é MENOR que o 26.3 que
# rodava antes: mundo de 26.3 NÃO abre em 26.1.2 (o mundo só anda pra frente).
# O mundo antigo fica preservado em:
#   /data/minecraft-paper-26.3.tar.gz    (dados completos do Paper 26.3)
#   /data/minecraft-old/                 (mundo 26.3 solto, se existir)
# Pra voltar atrás, é só reverter este arquivo e restaurar o .tar.gz.
#
# ── Fixação de versão ────────────────────────────────────────────────────
# CF_FILE_ID fixa a versão do pack: sem ele o AUTO_CURSEFORGE pega a última
# a cada boot e ATUALIZA o pack sozinho (e o loader junto), o que num mundo
# compartilhado é exatamente o que não se quer. 9187064 = 0.12.0-beta.
# O pack é beta: updates frequentes. Subir de versão é ato deliberado:
# troque o CF_FILE_ID, faça backup, e aceite que mods podem quebrar.
#
# ── Whitelist ────────────────────────────────────────────────────────────
# Em NeoForge offline (ONLINE_MODE=false, por causa das contas não-premium)
# a whitelist vanilla não serve: ela grava UUID e não aceita "adicionar pelo
# nome". O mod **CWhitelist** (modrinth `cwhitelist`) resolve isso e é
# name-based. Verificado localmente: carrega, adiciona por nome, persiste em
# `config/cwhitelist_entries.json`.
#
# IMPORTANTE — fail-closed: o CWhitelist NÃO tem on/off e chuta todo mundo
# que não está na lista. Um servidor recém-criado, com a lista vazia, não
# deixa NINGUÉM entrar (bom). Mas isso significa que entrar depende de a
# lista ter pelo menos um nome — o `WHITELIST` abaixo semeia o primeiro.
#
# ── Memória ──────────────────────────────────────────────────────────────
# ATM11 é pesado: medido localmente em ~4.9 GB de RSS com 0 jogadores e 4 GB
# de heap. Na VPS (23 GB, ~9.8 GB já usados por Zomboid + stacks), 8 GB de
# heap deixa ~13 GB livres pro host respirar. USE_AIKAR_FLAGS só entra em
# >=12G; abaixo disso o image usa as flags padrão, que é o certo aqui.
#
# ── Boot lento (não é bug) ───────────────────────────────────────────────
# 293 mods: ~85-115 s pra carregar depois do cache quente, mais na primeira
# vez. Por isso start_period de 15m no healthcheck — sem isso o Docker marca
# unhealthy e o `depends_on` do backup nunca solta.
name: minecraft

services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft
    labels:
      giomartins.dev/project: minecraft
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      # AUTO_CURSEFORGE instala o pack E o loader que o manifest declara
      # (NeoForge 26.1.2.109). Não setamos VERSION nem NEOFORGE_VERSION:
      # deixar o manifest mandar evita divergir do que os amigos instalam no
      # launcher.
      TYPE: "AUTO_CURSEFORGE"
      CF_SLUG: "all-the-mods-11"
      CF_FILE_ID: "9187064"
      # 293 mods em série; 6 em paralelo encurta o primeiro boot sem
      # estourar o rate limit do CurseForge.
      CF_PARALLEL_DOWNLOADS: "6"
      MEMORY: "8G"
      INIT_MEMORY: "4G"
      ONLINE_MODE: "false"
      ENFORCE_SECURE_PROFILE: "false"
      # Whitelist vanilla desligada: quem manda é o mod (as duas juntas
      # conflitam e a vanilla barra antes, sem mensagem útil).
      ENABLE_WHITELIST: "false"
      # NÃO usar a env `OPS` aqui: ela resolve o nome pela API da Mojang e
      # grava o UUID **premium**. Em online-mode=false o jogador entra com o
      # UUID offline (md5 de "OfflinePlayer:<nome>"), então o op simplesmente
      # não pega. Conferido: OPS gravou 58ea66b5… (Mojang) mas o runtime usa
      # 2b38b6a0… (offline) — e o `op <nome>` via RCON repete o mesmo erro
      # enquanto o nome não estiver no usercache.
      # O op vai em /data/minecraft/ops.json com o UUID offline (ver runbook).
      # Mod de whitelist name-based (ver topo). Pinado na versão que
      # carrega em 26.1.2 — o slug sozinho pegaria a build de 26.3.
      MODRINTH_PROJECTS: "cwhitelist:3.1-26.1+-NeoForge"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "none"
      # Semente da whitelist do MOD. O `WHITELIST` do itzg escreve na lista
      # vanilla (desligada, não serve aqui), então a semente vai por RCON —
      # o único jeito de falar com o mod. Roda todo boot e é idempotente
      # ("Entry already exists"), o que garante que um deploy novo com
      # /data vazio não nasça trancado sem ninguém pra se auto-adicionar.
      # Depois disso, gerencie in-game: /cwhitelist add name <Nick>
      RCON_CMDS_STARTUP: |
        cwhitelist add name TaldoJovis
      DIFFICULTY: "normal"
      MODE: "survival"
      MAX_PLAYERS: "10"
      # Modpack é pesado: view/simulation altos derrubam o TPS com 3-4
      # jogadores. 8/6 é o ponto onde o pack fica jogável na VPS.
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      MOTD: "§aAll the Mods 11 §7- servidor dos amigos"
      TZ: "America/Sao_Paulo"
      ENABLE_QUERY: "false"
      # Pausa nativa do servidor (1.21.2+): com 0 jogadores o processo
      # congela e economiza CPU/RAM — ótimo aqui, porque o ATM11 come ~5 GB
      # parado. Mas pausado ele não responde ping do server-list, então o
      # cliente mostra "offline" até o primeiro connect acordar o socket.
      # 0 desativa; 60 é o padrão. Mantido em 0 de propósito: o server-list
      # mostrando "online" é como o dono confere se o serviço está de pé, e
      # o custo de ficar acordado é o mesmo de antes desta mudança.
      PAUSE_WHEN_EMPTY_SECONDS: "0"
      # Sem proxy na frente; backup fala RCON no loopback da netns.
      RCON_PASSWORD: "${MINECRAFT_RCON_PASSWORD:?defina MINECRAFT_RCON_PASSWORD (variavel de stack no Dockhand)}"
    volumes:
      # Bind: o mundo do pack é o dado mais caro deste host (293 mods +
      # saves). Fica visível em /data/minecraft pra copiar pra fora sem
      # `--volumes-from`.
      - /data/minecraft:/data
    ports:
      - "25565:25565"
    healthcheck:
      test: mc-health
      # 293 mods: ~2 min de boot com cache quente, muito mais no primeiro
      # (baixa ~1.5 GB de mods). 15m evita unhealthy falso.
      start_period: 15m
      interval: 30s
      retries: 5
    logging:
      options: { max-size: "10m", max-file: "3" }
    networks: [apps]

  # Backup diário. Mesma mecânica de antes (RCON save-all + pausa), mas o
  # alvo agora é /data inteiro, que inclui mods/config/world do pack.
  # EXCLUDES tira o que é baixável de novo (jars, libraries, caches) pra
  # não guardar 1.5 GB de mods todo dia.
  mc-backup:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    labels:
      giomartins.dev/project: minecraft
    restart: unless-stopped
    network_mode: service:minecraft
    depends_on:
      minecraft:
        # healthcheck com start_period de 15m: o backup espera o boot
        # terminar de verdade antes de tentar RCON.
        condition: service_healthy
    environment:
      BACKUP_INTERVAL: "24h"
      INITIAL_DELAY: "10m"
      PAUSE_IF_NO_PLAYERS: "true"
      PRUNE_BACKUPS_DAYS: "7"
      BACKUP_NAME: "world"
      SRC_DIR: "/data"
      DEST_DIR: "/backups"
      RCON_HOST: "127.0.0.1"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MINECRAFT_RCON_PASSWORD:?defina MINECRAFT_RCON_PASSWORD (variavel de stack no Dockhand)}"
      TZ: "America/Sao_Paulo"
      # Mods e libraries são re-baixáveis pelo pack; o que dói perder é
      # world/, config/ e os dados de mods (quests, FTB teams, etc).
      EXCLUDES: "*.jar,cache,logs,*.tmp,libraries,versions,mods"
    volumes:
      - /data/minecraft:/data:ro
      - /data/minecraft-backups:/backups
    logging:
      options: { max-size: "10m", max-file: "3" }

networks:
  apps:
    external: true
    name: apps
