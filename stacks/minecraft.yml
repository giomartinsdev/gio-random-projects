# minecraft.yml — servidor de Minecraft Java (Paper) para jogar com os amigos.
#
# Dois containers: `itzg/minecraft-server` (o jogo) e `itzg/mc-backup` (backup
# diário do mundo). Nenhum `build:` nem imagem própria no registry — diferente
# de tela/maus/excalidraw, aqui não há nada pra compilar: o upstream já publica
# multi-arch (amd64/arm64, conferido: a VPS é Ampere arm64 e o manifest do
# `java25` tem arm64) e o jar do Paper é Java puro, então roda nativo, sem
# box64/QEMU (o problema do Zomboid não existe aqui — ver
# docs/servidor-zomboid.md).
#
# Versão: Minecraft passou pra versionamento por ano — a release atual é a
# **26.3** (Paper build 205). `VERSION` é fixada de propósito (não `LATEST`):
# num servidor com mundo compartilhado, subir de versão sobe o mundo e não tem
# volta. Pra atualizar, troque aqui e suba — o backup diário roda antes.
#
# Por que `java25`: o 26.3 exige Java 25 (java-runtime-epsilon), e a tag
# `javaxx` é o que separa a JVM "certa" neste image. `latest` hoje também é 25,
# mas a tag explícita não muda debaixo dos pés.
#
# ONLINE_MODE=false: o grupo tem contas não-premium (misturado). Nesse modo o
# servidor NÃO autentica ninguém — qualquer um pode entrar com qualquer nome.
# Por isso a whitelist é a única porta, e ela é **name-based e gerenciada
# in-game** (pedido do dono do repo): o plugin NobleWhitelist
# (modrinth `noble-whitelist`, 1.2.26, suporta 26.3 — conferido carregando no
# Paper 26.3 e testando login de nome dentro/fora da lista) substitui a
# whitelist vanilla, que em offline-mode grava UUID offline e não serve pra
# adicionar amigo pelo nome.
#
# Segredo: `MINECRAFT_RCON_PASSWORD` (variável de stack no Dockhand, NUNCA no
# git) — o mesmo nos dois serviços. O RCON só existe no loopback do container
# do jogo, que o backup alcança por compartilhar a netns; não é publicado.
#
# Porta: 25565/tcp publicada direto (não é HTTP, então não passa pelo ingress).
# A liberação de firewall é DUPLA e as duas precisam existir:
#   1. iptables do host — codificado em modules/infra/terraform/main.tf
#      (firewall_rules "tcp 25565"), aplicado pelo host_baseline;
#   2. Oracle Security List (camada cloud, fora da VM) — regra manual no
#      console OCI. Ver docs/servidor-minecraft.md.
name: minecraft

services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft
    restart: unless-stopped
    # stdin_open/tty pro `docker attach` valer como console (o mc-server-runner
    # lê stdin); sem isso o attach não entrega comando nenhum.
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      # 4 OCPU / 23 GB na VPS, mas ~5-6 GB já são do resto das stacks + Zomboid.
      # 6G é folgado pro número de amigos de um servidor privado e deixa o host
      # respirar. Aikar's flags (GC tuning do Paper) entram automáticas com
      # MEMORY >= 12G; abaixo disso o image usa as flags padrão, que é o certo.
      MEMORY: "6G"
      # Contas não-premium (ver topo). O gate passa a ser a whitelist.
      ONLINE_MODE: "false"
      # Sem Mojang auth não há chave de assinatura de chat; manter true faz o
      # cliente reclamar de "chat não seguro" e derruba mensagens.
      ENFORCE_SECURE_PROFILE: "false"
      # A whitelist vanilla fica desligada de propósito: quem manda é o plugin
      # (as duas juntas conflitam — a vanilla barra antes do plugin rodar).
      ENABLE_WHITELIST: "false"
      # `noble-whitelist:1.2.26` = slug:versão do Modrinth. Pinado porque o
      # plugin guarda o schema do sqlite da whitelist; update silencioso num
      # restart é risco desnecessário.
      MODRINTH_PROJECTS: "noble-whitelist:1.2.26"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "none"
      DIFFICULTY: "normal"
      MODE: "survival"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      MOTD: "§aMinecraft §7§l26.3§r §7- servidor dos amigos"
      TZ: "America/Sao_Paulo"
      # Sem proxy na frente, e o query protocol é mais uma porta exposta sem
      # necessidade — o status do server-list (que o cliente usa) já basta.
      ENABLE_QUERY: "false"
      # Fail-closed: o NobleWhitelist sobe com `enabled: false` no config
      # default, ou seja, um deploy novo ficaria ABERTO até alguém rodar o
      # comando. Isto liga a whitelist logo no boot, todo boot (idempotente),
      # então a janela entre "servidor no ar" e "só quem foi adicionado entra"
      # é zero. Conferido: no boot o log mostra "[Rcon loop] running - noblewl
      # on" e um nome fora da lista leva "You are not whitelisted".
      RCON_CMDS_STARTUP: "noblewl on"
      # Backup coordenado (save-all + pause via RCON) antes de copiar.
      RCON_PASSWORD: "${MINECRAFT_RCON_PASSWORD:?defina MINECRAFT_RCON_PASSWORD (variavel de stack no Dockhand)}"
    volumes:
      # Bind, não named volume: o mundo é o único dado irreponível deste host e
      # num bind ele aparece em `ls /data/minecraft` — dá pra copiar pra fora
      # (rclone/scp) sem `docker run --volumes-from`. /data já é o padrão do
      # host pro estado persistente das stacks (ver maus.yml) e está no disco
      # de boot, junto do backup.
      - /data/minecraft:/data
    ports:
      # Direto no host (não 127.0.0.1): é tráfego de jogo, não HTTP — não tem
      # ingress nem Cloudflare na frente. O firewall do host + Security List
      # da OCI são o gate (ver docs/servidor-minecraft.md).
      - "25565:25565"
    healthcheck:
      # `mc-health` é o wrapper do próprio image: pergunta o status do server
      # (não só "processo vivo"), então um boot travado aparece como unhealthy.
      test: mc-health
      start_period: 5m
      interval: 30s
      retries: 5
    logging:
      options: { max-size: "10m", max-file: "3" }
    networks: [apps]

  # Backups diários do mundo. O `itzg/mc-backup` fala RCON com o server pra
  # `save-all` + pausar escrita durante a cópia (não é `cp` de arquivo aberto),
  # então o .tgz é consistente. Vive na mesma netns do minecraft (network_mode
  # service:) pra alcançar o RCON no loopback do container — RCON não fica
  # exposto no host nem na rede `apps`.
  #
  # Destino é /data/minecraft-backups no HOST, fora do /data do jogo: se o
  # container do server corromper o volume, o backup não corrompe junto. Ainda
  # é o mesmo disco — pra sobreviver à perda da VM, copiar pra fora (ver
  # docs/servidor-minecraft.md, seção "Backup"). 7 dias de retenção.
  mc-backup:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    restart: unless-stopped
    network_mode: service:minecraft
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL: "24h"
      INITIAL_DELAY: "10m"
      # Sem jogador online, não gasta CPU/disco à toa: adia até alguém entrar.
      PAUSE_IF_NO_PLAYERS: "true"
      PRUNE_BACKUPS_DAYS: "7"
      BACKUP_NAME: "world"
      SRC_DIR: "/data"
      DEST_DIR: "/backups"
      # RCON roda na netns compartilhada -> loopback do container do server.
      RCON_HOST: "127.0.0.1"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${MINECRAFT_RCON_PASSWORD:?defina MINECRAFT_RCON_PASSWORD (variavel de stack no Dockhand)}"
      TZ: "America/Sao_Paulo"
      # Mods/plugins/cache não entram no backup: só o que é mundo/config.
      EXCLUDES: "*.jar,cache,logs,*.tmp,libraries,versions"
    volumes:
      - /data/minecraft:/data:ro
      - /data/minecraft-backups:/backups
    logging:
      options: { max-size: "10m", max-file: "3" }

networks:
  apps:
    external: true
    name: apps
