# persistence.yml — camada de dados (migra `modules/storage/*` do TF).
#
# Reusa os MESMOS named volumes que o Terraform criou (external), então os
# dados atuais continuam. Antes de tirar os módulos do TF, faça
# `terraform state rm` também nos docker_volume, senão o apply os destrói.
#
# Segredos (variáveis de stack no Dockhand):
#   POSTGRES_PASSWORD      (era random_password.postgres)
#   MINIO_ROOT_PASSWORD    (era random_password.minio_root_password)
#   RABBITMQ_PASSWORD      (senha do usuário domain no broker)
# Não-secretos têm default abaixo.
#
# A porta 9000/9001 do MinIO é loopback: o ingress fala 127.0.0.1:9000 e
# os SPAs falam por ele. O postgres/rabbitmq AMQP não publicam porta (rede
# interna); só o management do rabbitmq fica em loopback para inspeção.
name: persistence

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    labels:
      giomartins.dev/project: storage
    # MIGRADO para o k8s em 2026-10-23 (fatia 6). `no` e não `unless-stopped`:
    # com o Serviço do cluster servindo, um `docker compose up` deste stack (ou
    # um redeploy do Dockhand) religaria ESTE container no mesmo volume
    # `apps_postgres_data`, que agora está CONGELADO como era em 16:24. O pod já
    # escreveu mais de 2.300 linhas que este volume não tem — subir os dois seria
    # dois Postgres divergindo, e o Docker venceria em quem escuta.
    #
    # Para reverter de propósito: `docker start postgres` e desfazer o Service no
    # git. O volume está intacto, com o dado de 16:24.
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-domain}
    volumes:
      - apps_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domain}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [apps]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    labels:
      giomartins.dev/project: storage
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-domain}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"   # management UI (loopback)
    volumes:
      - apps_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [apps]

  minio:
    image: minio/minio:latest
    container_name: minio
    labels:
      giomartins.dev/project: storage
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bookclub-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "on"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (ingress e SPAs falam por aqui)
      - "127.0.0.1:9001:9001"   # console (ingress -> minio.giomartins.dev)
    volumes:
      - apps_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [apps]

  # Garante os buckets públicos dos SPAs (antes era um null_resource do TF,
  # removido na migração). One-shot idempotente: roda no `up` e cria os
  # buckets + leitura anônima. Um app estático novo só precisa da linha aqui
  # e da entrada em stacks/ingress/default.conf.
  minio-buckets:
    # A ferramenta oficial (`minio/mc`) saiu do Docker Hub, e o `itzg/mc-backup`
    # que entrou no lugar NÃO traz o binário `mc` no PATH (verificado: o
    # container saía 127 / "mc: not found" num deploy verde). O que existe e é
    # puxável é a própria imagem do servidor (`minio/minio:latest`, que tem
    # `/usr/bin/mc`) — mas ela está justamente presa ao cache do host, que é a
    # fragilidade que este arquivo evita. Então aqui vai o `amazon/aws-cli`
    # (público, multi-arch): um one-shot idempotente que cria os buckets e põe
    # a policy de leitura anônima pela API S3, o mesmo efeito do antigo
    # `mc mb --ignore-existing` + `mc anonymous set download`.
    image: amazon/aws-cli:latest
    container_name: minio-buckets-init
    labels:
      giomartins.dev/project: storage
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        export AWS_DEFAULT_REGION=us-east-1
        export AWS_ACCESS_KEY_ID="$$MINIO_ROOT_USER"
        export AWS_SECRET_ACCESS_KEY="$$MINIO_ROOT_PASSWORD"
        ep=http://minio:9000
        for b in tela-frontend hub-frontend finance-frontend; do
          aws --endpoint-url "$$ep" s3api create-bucket --bucket "$$b" >/dev/null 2>&1 || true
          aws --endpoint-url "$$ep" s3api put-bucket-policy --bucket "$$b" --policy \
            "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$b/*\"]}]}"
        done
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bookclub-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
    networks: [apps]

networks:
  apps:
    external: true
    name: apps

volumes:
  apps_postgres_data:
    external: true
    name: apps_postgres_data
  apps_rabbitmq_data:
    name: apps_rabbitmq_data
  apps_minio_data:
    external: true
    name: apps_minio_data
