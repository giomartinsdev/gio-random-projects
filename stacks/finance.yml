# finance.yml — bounded context financeiro (finance-api + finance-customersupport-worker).
# Depende de persistence.yml (postgres, rabbitmq) e do compute (alloy p/ OTLP,
# evolution-api) pela rede externa `apps`.
#
# Isolamento (§1.1): NENHUM serviço daqui tem DATABASE_URL nem driver de banco.
# Banco, broker de comando, domain-api e domain-worker são do stack `domain`.
#
# Segredos (variáveis de stack no Dockhand — NUNCA no git, só ${VAR}).
# Lista conferida contra §10.3 e contra TODO `${...}` deste arquivo: uma
# variável referenciada e não cadastrada é deploy vermelho (ou verde com o
# default errado).
#   FINANCE_API_KEYS        (lista key:label, um caller por serviço)
#   FINANCE_WORKER_API_KEY  (key do worker; a MESMA tem de estar em FINANCE_API_KEYS)
#   FINANCE_DOMAIN_API_KEY  (key da finance-api p/ o domain-api; a MESMA tem de
#                           estar em DOMAIN_API_KEYS do stack `domain`, senão
#                           todo request leva 401 com o deploy verde — §10.3)
#   RABBITMQ_USER           (opcional, default `domain` — o MESMO do persistence.yml)
#   RABBITMQ_PASSWORD       (a MESMA de persistence.yml)
#   EVOLUTION_API_KEY       (a MESMA do compute.yml — apikey global da Evolution)
#   EVOLUTION_INSTANCE      (opcional, default web-businesses)
#   FINANCE_GOOGLE_CLIENT_ID (client ID OAuth do Google do SPA; público)
#   FINANCE_SESSION_SECRET   (segredo HS256 do cookie de sessão do SPA; >=32 bytes)
#
# Fora daqui de propósito: POSTGRES_PASSWORD. A `finance-api` não fala com o
# banco (§1.1) e este stack não publica serviço de banco — quem precisa dela é
# o stack `domain`/`persistence`.
name: finance

services:
  finance-api:
    image: registry.giomartins.dev:5000/finance-api:latest
    container_name: finance-api
    restart: unless-stopped
    environment:
      # SEM DATABASE_URL / RABBITMQ_URL — a persistência é do stack `domain` (§1.1)
      # 8000 é a porta do domain-api DENTRO do container (HTTP_ADDR ":8000" em
      # stacks/domain.yml); o `127.0.0.1:8000:8000` de lá é só o publish para o
      # host. Daqui o tráfego é container-a-container pela rede `apps`, então a
      # porta certa é a interna — a externa não é alcançável pelo nome DNS.
      DOMAIN_API_BASE_URL: http://domain-api:8000
      DOMAIN_API_KEY: ${FINANCE_DOMAIN_API_KEY:?defina FINANCE_DOMAIN_API_KEY}
      HTTP_ADDR: ":8000"
      # 12s > os 10s que o /sync do domain-api segura a conexão por desenho:
      # sem a folga, uma escrita lenta e bem-sucedida vira erro de transporte
      # no cliente em vez do 504-com-corpo documentado (§4.1). Default em
      # config.py é exatamente este; explícito aqui porque o app o lê.
      DOMAIN_API_TIMEOUT_S: "12"
      FINANCE_API_KEYS: ${FINANCE_API_KEYS:?defina FINANCE_API_KEYS}
      # Origem(ns) do SPA autorizada a chamar esta API pelo browser. Sem isto o
      # browser bloqueia a resposta (o SPA vive em finance.giomartins.dev, a API
      # em finance-api.giomartins.dev: CORS e obrigatorio). Default do app ja e
      # finance.giomartins.dev; explicito aqui pra dev local tb.
      FINANCE_CORS_ORIGINS: ${FINANCE_CORS_ORIGINS:-https://finance.giomartins.dev}
      # SSO do SPA (§5). O client ID do Google é PÚBLICO (vai no bundle da SPA
      # de qualquer forma) — o mesmo valor que o clubs.yml commita. Reusamos o
      # MESMO client do clubs: um client OAuth do Google aceita várias
      # "authorized JavaScript origins", então finance.giomartins.dev precisa
      # estar na lista desse client no Google Cloud Console (foi o
      # origin_mismatch que o comentário do ts-frontend-ci-cd.yml registra).
      # Sem FINANCE_GOOGLE_CLIENT_ID o login fica desabilitado (o worker com
      # X-API-Key segue funcionando). Ver stacks/README.md.
      FINANCE_GOOGLE_CLIENT_ID: ${FINANCE_GOOGLE_CLIENT_ID:-45441571832-4vldrm5h9ef87c82m1spuu6g8foa0k8c.apps.googleusercontent.com}
      # Segredo HS256 do cookie de sessão. NÃO usamos `:?` de propósito: um
      # segredo ausente derrubaria o stack INTEIRO (inclusive o worker do
      # WhatsApp, que não depende do SSO). Vazio = a app deriva um segredo
      # forte do FINANCE_DOMAIN_API_KEY (que já é um segredo do stack), então o
      # login funciona sem cadastrar mais nada; defina FINANCE_SESSION_SECRET
      # para desacoplar os dois. Ver load_settings em config.py.
      FINANCE_SESSION_SECRET: ${FINANCE_SESSION_SECRET:-}
      # Open Finance (Polp/Celcoin). Vazios = integração desligada (as rotas de
      # Open Finance respondem 503; o resto do app segue). Cadastrados no cofre
      # como POLP_OF_CLIENT_ID/POLP_OF_CLIENT_SECRET.
      POLP_OF_CLIENT_ID: ${POLP_OF_CLIENT_ID:-}
      POLP_OF_CLIENT_SECRET: ${POLP_OF_CLIENT_SECRET:-}
      POLP_OF_SANDBOX: ${POLP_OF_SANDBOX:-}
      # Ponte do Vaultwarden: quando configurada, POLP_OF_CLIENT_ID/SECRET (e
      # FINANCE_SESSION_SECRET) vêm do cofre, não do env. É assim que os itens
      # que já estão no Vaultwarden chegam ao container. Sem a ponte, lê env.
      SECRETS_BRIDGE_URL: ${SECRETS_BRIDGE_URL:-http://vaultwarden-api:8080}
      SECRETS_BRIDGE_API_KEY: ${VAULTWARDEN_BRIDGE_API_KEY:-}
      RATE_LIMIT_RPS: "5"
      RATE_LIMIT_BURST: "20"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: finance-api
    ports:
      - "127.0.0.1:8018:8000"      # porta loopback nova — ver §10.5
    networks: [apps]

  # Consumidor + gateway do WhatsApp. SEM porta e SEM host: o worker não serve
  # nada — recebe mensagem por AMQP (a Evolution publica em `evolution.messages.
  # upsert`) e envia a resposta por HTTP (`POST /message/sendText`), §5.3. É o
  # único serviço daqui que consome o broker — eventos do Evolution e de
  # domínio `finance.*` — e NUNCA publica comando (§1.1). Um port publish seria
  # superfície sem contrato.
  finance-customersupport-worker:
    image: registry.giomartins.dev:5000/finance-customersupport-worker:latest
    container_name: finance-customersupport-worker
    restart: unless-stopped
    environment:
      # SEM DATABASE_URL — regra de isolamento (§1.1)
      # 8000 = porta da finance-api DENTRO do container (não a 8018 do host).
      FINANCE_API_BASE_URL: http://finance-api:8000
      FINANCE_API_KEY: ${FINANCE_WORKER_API_KEY:?defina FINANCE_WORKER_API_KEY}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-domain}:${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD}@rabbitmq:5672/
      # A Evolution roda no stack compute, na mesma rede `apps`.
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-web-businesses}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: finance-customersupport-worker
    networks: [apps]

  # Conector de Open Finance: poller sem host que lê contas + transações do
  # provedor (Polp/Celcoin) e as publica como comandos na finance-api. Sem
  # banco, sem broker (§1.1). Credenciais OPCIONAIS: sem elas o processo sai 0
  # com um aviso claro (o `restart: unless-stopped` não reinicia um exit 0),
  # então o conector fica fora sem derrubar o resto do stack.
  finance-openfinance-worker:
    image: registry.giomartins.dev:5000/finance-openfinance-worker:latest
    container_name: finance-openfinance-worker
    restart: unless-stopped
    environment:
      FINANCE_API_BASE_URL: http://finance-api:8000
      # Key própria do conector em FINANCE_API_KEYS (rótulo `openfinance`).
      FINANCE_API_KEY: ${FINANCE_OF_API_KEY:-}
      # Do cofre via ponte (mesma convenção da finance-api).
      SECRETS_BRIDGE_URL: ${SECRETS_BRIDGE_URL:-http://vaultwarden-api:8080}
      SECRETS_BRIDGE_API_KEY: ${VAULTWARDEN_BRIDGE_API_KEY:-}
      POLP_OF_CLIENT_ID: ${POLP_OF_CLIENT_ID:-}
      POLP_OF_CLIENT_SECRET: ${POLP_OF_CLIENT_SECRET:-}
      POLP_OF_SANDBOX: ${POLP_OF_SANDBOX:-}
      OF_POLL_SECONDS: ${OF_POLL_SECONDS:-600}
      OF_BACKFILL_DAYS: ${OF_BACKFILL_DAYS:-30}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: finance-openfinance-worker
    networks: [apps]

networks:
  apps:
    external: true
    name: apps
