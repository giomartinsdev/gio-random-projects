# maus.yml — o OpenMausBot (milind-soni/OpenMausBot) substitui o OpenDots
# como o produto de "coworkers de IA" (chat com um roster de bots, cada um com
# sua personalidade, modelo, computador e apps conectados). Uma stack só.
#
# Por que dois containers: o harness do OpenMausBot SEMPRE liga em
# 127.0.0.1:8799 (server/index.ts) — a confiança em loopback é o próprio modelo
# de auth. Não dá pra ele ouvir em 0.0.0.0 e deixar o ingress bater direto nele
# sem publicar a porta no host e furar essa invariante. Então ele mantém o Caddy
# que já vem no deploy upstream: o Caddy roda na MESMA netns do omb, alcança o
# loopback, e é quem publica a loopback do host (127.0.0.1:8799) que o ingress
# usa. O ingress faz https://maus.giomartins.dev -> omb (8799) e /hooks/* -> omb
# (8800, receiver de webhook, sem login — tem segredo por hook).
#
# Por que 8799 e não 80: o upstream publica 80:80 porque o Caddy dele termina
# TLS sozinho. Aqui o TLS é do Cloudflare (origin HTTP na 80, como as outras
# stacks), então o Caddy fica só como HTTP->loopback e a publicação vira
# 127.0.0.1:8799:80 (host 8799 -> Caddy dentro do container na 80). Sem isso,
# o Caddy tentaria HTTPS na 80 e todo request (inclusive /hooks) morreria em
# redirect/mixed content.
#
# Segredos: nenhum obrigatório no boot. Não há OWNER_TOKEN — o login é o
# "pairing" do próprio OpenMausBot (um código por dispositivo, docs
# self-hosting). O provider de modelo é configuração in-app (App Settings),
# não env; aqui ficou o 9router pelo HTTPS público https://ai.giomartins.dev/v1
# (HTTP não-loopback é recusado pelo runtime para computer/image tools).
# Variáveis opcionais (não-segredo, com default abaixo): OMB_UPSTREAM_SCHEME
# (default http), ou OMB_SIGNIN_EMAILS/OMB_SIGNIN_MEMBER_EMAILS pra liberar
# login por código no e-mail. OMB_PUBLIC_URL vira OMB_WEBHOOK_PUBLIC_URL (o
# Caddy passa /hooks/* direto).
name: maus

services:
  omb:
    # Built arm64 pelo workflow `maus-image.yml` a partir do upstream
    # milind-soni/OpenMausBot (o ghcr só publica amd64; a VPS é Ampere arm64
    # sem emulação de container que funcione — ver o comentário do topo).
    # A tag do upstream fica no default/input daquele workflow.
    image: registry.giomartins.dev:5000/maus:latest
    container_name: omb
    restart: unless-stopped
    init: true
    environment:
      OMB_PORT: "8799"
      OMB_WEBHOOK_PORT: "8800"
      # Links de pairing e URLs de webhook saem com o domínio público.
      OMB_PUBLIC_URL: https://maus.giomartins.dev
      OMB_WEBHOOK_PUBLIC_URL: https://maus.giomartins.dev
      # 9router é o único provider: nenhum CLI (claude/codex/grok) é baked in.
      # O "OpenAI-compatible" aponta pro 9router pela rede `apps`.
      ENGINES: ""
      # Vazio = só pairing code. Preencha pra liberar login por e-mail.
      OMB_SIGNIN_EMAILS: ${OMB_SIGNIN_EMAILS:-}
      OMB_SIGNIN_MEMBER_EMAILS: ${OMB_SIGNIN_MEMBER_EMAILS:-}
    volumes:
      # Bind (não named volume) em /data: o Local VM é criado PELO omb via o
      # docker do host, e o `docker run` do VM monta /data/.openmausbot/vm-home
      # como bind no HOST. O caminho do bind é resolvido no host, então o
      # host precisa ter /data idêntico ao do container. Um named volume fica
      # em /var/lib/docker/volumes/... e o path não existiria no host.
      - /data:/data
      # Docker do host: o "Local VM" (computer container Cua) é criado pelo
      # próprio omb via `docker` CLI. A imagem inclui o binário e o usuário
      # maus entra no grupo docker (gid 989 nesta VPS). Trade-off: quem fala
      # com o daemon é root-equivalente no host — servidor dedicado.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # host 8799 -> Caddy (netns compartilhada) na 80. O ingress roteia
      # maus.giomartins.dev pra cá.
      - "127.0.0.1:8799:80"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('openmausbot')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [apps]

  caddy:
    image: caddy:2
    container_name: maus-caddy
    restart: unless-stopped
    # Mesma netns do omb: alcança o loopback e publica a porta declarada nele.
    network_mode: service:omb
    depends_on:
      omb:
        condition: service_healthy
    volumes:
      - ./maus/Caddyfile:/etc/caddy/Caddyfile:ro
      - maus-caddy-data:/data
      - maus-caddy-config:/config

  # Bridge de Slack: uma DM/@menção vira um turno na thread do bot e a resposta
  # volta pro Slack. Roda na MESMA netns do omb (como o Caddy) pra que as
  # chamadas ao loopback 8799 sejam o owner do self-hosted. Slack em Socket
  # Mode: sem URL pública, só WSS de saída. Segredos do Slack como variáveis de
  # stack no Dockhand (SLACK_BOT_TOKEN/SLACK_APP_TOKEN); OMB_BOT_ID é público.
  slack-bridge:
    image: registry.giomartins.dev:5000/maus-slack-bridge:latest
    container_name: maus-slack-bridge
    restart: unless-stopped
    network_mode: service:omb
    depends_on:
      omb:
        condition: service_healthy
    environment:
      OMB_URL: http://127.0.0.1:8799
      OMB_BOT_ID: ${OMB_BOT_ID:?defina OMB_BOT_ID (id do bot em GET /api/bots)}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?defina SLACK_BOT_TOKEN (xoxb-...)}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:?defina SLACK_APP_TOKEN (xapp-...)}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS:-}
    volumes:
      # Estado por canal do Slack (canal -> thread do bot) sobrevive a restart.
      - /data/slack-bridge:/data

volumes:
  maus-caddy-data:
    name: maus-caddy-data
  maus-caddy-config:
    name: maus-caddy-config

networks:
  apps:
    external: true
    name: apps
