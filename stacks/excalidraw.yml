# excalidraw.yml — lousa de diagramas (excalidraw/excalidraw) servida como
# build estático atrás do ingress.
#
# Por que imagem do registry (e não `build:` aqui): o upstream não publica
# imagem; a VPS é arm64 (Oracle Ampere) e o Dockhand faz o deploy das stacks —
# um `build:` no compose exigiria o fonte ao lado e um toolchain Node no host.
# Mesmo desenho do maus/9router: o workflow `.github/workflows/excalidraw-image.yml`
# clona o upstream no tag pinado, builda arm64 (QEMU no runner amd64) e publica
# `registry.giomartins.dev:5000/excalidraw:latest`; esta stack só puxa a imagem.
# O upstream já sai com nginx + HEALTHCHECK (wget na 80), então não há o que
# redefinir.
#
# Sem volumes: é um SPA estático (o dev-compose do upstream montava o fonte pra
# hot-reload; aqui não faz sentido). Sem segredos.
#
# Exposto em https://draw.giomartins.dev — PÚBLICO, sem Cloudflare Access
# (qualquer pessoa entra sem conta; mesmo modelo do tela/clubs). O ingress
# (core.yml) mapeia hostname -> 127.0.0.1:8023, que esta stack publica.
name: excalidraw

services:
  excalidraw:
    image: registry.giomartins.dev:5000/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    ports:
      - "127.0.0.1:8023:80"
    networks: [apps]

networks:
  apps:
    external: true
    name: apps
