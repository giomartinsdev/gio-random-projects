# project-infra.yml — TUDO que é infraestrutura do projeto numa stack só.
#
# Por que existe: antes havia uma stack por peça (persistence, observability,
# db-mcp, compute, ai), e cada uma exigia deploy/segredo/registro próprios no
# Dockhand. Agrupar reduz a superfície de operação: uma stack, um deploy, um
# conjunto de variáveis. O que continua separado é só o `core.yml` (base da
# VPS: registry + Dockhand + ingress, protegida) e o `project-apps.yml`.
#
# COMO FUNCIONA: este arquivo NÃO duplica os serviços. Ele usa `include:` do
# Compose para herdar os arquivos por domínio, que continuam sendo a fonte da
# verdade e continuam legíveis:
#
#   persistence.yml    postgres, rabbitmq, minio, minio-buckets (+ volumes)
#   observability.yml  loki, prometheus, tempo, alloy, grafana
#   db-mcp.yml         db-mcp, db-mcp-gateway (MCP read-only atrás de token)
#   compute.yml        vaultwarden, vaultwarden-api, adminer, evolution-api,
#                      evolution-redis, evolution-db-init
#   ai.yml             NÃO incluído — ver nota abaixo
#
# Os `name:` dos arquivos incluídos são ignorados: o projeto é o deste arquivo
# (`project-infra`). Os caminhos relativos de bind mount (`./observability/...`,
# `./db-mcp/...`) resolvem em relação ao arquivo que os declara, então nada
# muda de lugar.
#
# NOTA SOBRE O `ai.yml` (9router + decision): ele NÃO está incluído porque as
# imagens `registry.giomartins.dev:5000/9router` e `.../decision` nunca foram
# buildadas (workflow ai-image.yml é manual e nunca rodou). O 9router em
# produção hoje é o do `compute` antigo, com a imagem `ghcr.io/decolua/9router`.
# Quando as imagens existirem: rode o workflow, descomente a linha do
# `include` abaixo e remova o serviço `9router` do `compute.yml`.
#
# Segredos (variáveis de stack no Dockhand, uma lista só):
#   POSTGRES_PASSWORD, RABBITMQ_PASSWORD, MINIO_ROOT_PASSWORD  (persistence)
#   GRAFANA_ADMIN_PASSWORD                                     (observability)
#   MCP_DB_PASSWORD, MCP_DB_TOKEN                              (db-mcp)
#   VAULTWARDEN_* (admin token, conta, client OAuth, bridge key) + EVOLUTION_API_KEY (compute)
#   POSTGRES_USER/POSTGRES_DB/MINIO_ROOT_USER/RABBITMQ_USER    (não-secretos, têm default)
#
# Ordem de dependência interna é resolvida pelo Docker: postgres/rabbitmq/minio
# escutam na rede `apps`; quem consome (evolution, db-mcp) tolera o boot fora
# de ordem (evolution tem `evolution-db-init` idempotente; db-mcp reconecta).
name: project-infra

include:
  - persistence.yml
  - observability.yml
  - db-mcp.yml
  - compute.yml
  # - ai.yml   # habilite só depois de buildar as imagens (ver nota acima)
