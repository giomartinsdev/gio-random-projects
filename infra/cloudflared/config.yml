# Cloudflare Tunnel ingress config.
# Credentials referenced here are generated locally by `cloudflared tunnel create`
# and must NEVER be committed (see .gitignore in this folder).
#
# This file is the source of truth for what's actually exposed on the
# homelab server — kept in sync with reality. Add a hostname back here
# when its service is redeployed; a hostname with nothing behind it
# doesn't belong in this file (dns-prune.yml cleans up the matching DNS
# record once removed here too).

tunnel: 36f8270d-52a2-4635-b9f2-f5174307e76e
credentials-file: /etc/cloudflared/creds.json

ingress:
  # Deliberately NOT behind Cloudflare Access — a plain `docker
  # login`/push can't do Access's browser-redirect/custom-header dance,
  # but it already sends HTTP Basic Auth on `docker login`, which is
  # exactly what this registry's own htpasswd auth expects (see
  # infra/arcane-templates/templates/registry). The registry gates
  # itself; the tunnel here is just TLS + DNS.
  - hostname: registry.giomartins.dev
    service: http://localhost:5000

  # domain-api — event-driven CRUD service (api/domain). Its own
  # X-API-Key + per-IP rate limiting gate /users; /healthz, /docs, and
  # /openapi.yaml stay public. See api/domain/README.md.
  - hostname: domain.giomartins.dev
    service: http://localhost:8000

  # Self-hosted S3-compatible storage (infra/minio) — currently only
  # used as the Terraform state backend for infra/terraform. Gates
  # itself via AWS SigV4 request signing (the S3 protocol's own auth),
  # same reasoning as registry.giomartins.dev above — deliberately NOT
  # behind Cloudflare Access, which would break the Terraform S3
  # backend's non-browser requests. Only the S3 API (9000) is exposed;
  # the admin console (9001) isn't published anywhere.
  - hostname: minio-api.giomartins.dev
    service: http://localhost:9000

  # Add new services below, one hostname per block, most specific first.
  # - hostname: example.giomartins.dev
  #   service: http://localhost:PORT

  # Catch-all: must always be last.
  - service: http_status:404
