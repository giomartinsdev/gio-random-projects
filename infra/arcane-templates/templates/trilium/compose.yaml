x-arcane:
  urls:
    - https://github.com/TriliumNext/Notes

services:
  trilium:
    image: triliumnext/notes:${TRILIUM_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8080"
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
    volumes:
      - trilium-data:/home/node/trilium-data

volumes:
  trilium-data:
