x-arcane:
  urls:
    - https://docs.searxng.org

services:
  searxng:
    image: searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
    volumes:
      - searxng-data:/etc/searxng

volumes:
  searxng-data:
