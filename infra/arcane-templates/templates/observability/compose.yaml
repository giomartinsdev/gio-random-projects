x-arcane:
  urls:
    - https://grafana.com/oss/

services:
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.3.2}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    configs:
      - source: loki_config
        target: /etc/loki/config.yaml
    volumes:
      - loki-data:/loki

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.9.0}
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    configs:
      - source: tempo_config
        target: /etc/tempo/config.yaml
    volumes:
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Tempo's metrics-generator remote_writes span-metrics/service-graph
      # data here — off by default, Prometheus otherwise 405s every write.
      - "--web.enable-remote-write-receiver"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus

  # No shell in this image (otel/opentelemetry-collector-contrib is a
  # scratch-based build — no /bin/sh, no cat) so unlike the others this
  # one can't use a `command` override at all; the mounted config just
  # lands at the path its default CMD already points to.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_VERSION:-latest}
    restart: unless-stopped
    configs:
      - source: otel_config
        target: /etc/otelcol-contrib/config.yaml
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
      - loki
      - prometheus

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    restart: unless-stopped
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:

# Inline file contents mounted straight into each container — no shell
# needed on the image's side (works even on scratch-based images like
# otel-collector-contrib), and no extra files for the Arcane registry to
# host beyond this one compose.yaml.
configs:
  loki_config:
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        ring:
          instance_addr: 127.0.0.1
          kvstore:
            store: inmemory
        replication_factor: 1
        path_prefix: /loki
      schema_config:
        configs:
          - from: 2020-05-15
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage_config:
        filesystem:
          directory: /loki/chunks
        tsdb_shipper:
          active_index_directory: /loki/tsdb-index
          cache_location: /loki/tsdb-cache
      limits_config:
        allow_structured_metadata: true

  tempo_config:
    content: |
      server:
        http_listen_port: 3200
      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
      storage:
        trace:
          backend: local
          wal:
            path: /var/tempo/wal
          local:
            path: /var/tempo/blocks
      # Without this, TraceQL metrics queries (rate(), the "Rate" panel
      # Grafana shows by default on a service's trace view) 500 with
      # "error finding generators: empty ring" — the metrics-generator
      # component doesn't run at all until it's configured. local_blocks
      # serves those queries against recent, not-yet-flushed data;
      # service-graphs/span-metrics remote_write the rest to Prometheus.
      # (local_blocks is Tempo 2.x only — removed in 3.0.)
      metrics_generator:
        registry:
          external_labels:
            source: tempo
        storage:
          path: /var/tempo/generator/wal
          remote_write:
            - url: http://prometheus:9090/api/v1/write
              send_exemplars: true
        traces_storage:
          path: /var/tempo/generator/traces
        processor:
          local_blocks:
            filter_server_spans: false
            flush_to_storage: true
      overrides:
        defaults:
          metrics_generator:
            processors: [service-graphs, span-metrics, local-blocks]

  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        - job_name: otel-collector
          static_configs:
            - targets: ["otel-collector:8889"]

  otel_config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch: {}
      exporters:
        otlp/tempo:
          endpoint: tempo:4317
          tls:
            insecure: true
        otlphttp/loki:
          endpoint: http://loki:3100/otlp
        prometheus:
          endpoint: 0.0.0.0:8889
      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlp/tempo]
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheus]
          logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/loki]

  grafana_datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          editable: true
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki:3100
          editable: true
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          editable: true
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
            serviceMap:
              datasourceUid: prometheus
