x-arcane:
  urls:
    - https://nocodb.com

services:
  nocodb:
    image: nocodb/nocodb:${NOCODB_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      NC_DB: ${NC_DB}
      # NocoDB's SSRF protection blocks connecting to any private/internal
      # host by default — including the very Docker-network hostname
      # (e.g. "postgres") this template exists to reach. Without this,
      # adding that DB as a data source fails with "connection to
      # internal host is not allowed" even though NC_DB itself (used as
      # NocoDB's own metadata store) connects to the same host fine.
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    volumes:
      - nocodb-data:/usr/app/data

# Joins the target Postgres's own compose network directly instead of
# publishing its port to the host — a compose project's default network
# is named "<project-dir>_default" unless overridden, so pointing this
# at api/domain's project name gives NocoDB a route to `postgres:5432`
# by that same DNS name, with the DB never exposed outside its own
# project's network.
networks:
  default:
    name: ${DB_NETWORK:-domain_default}
    external: true

volumes:
  nocodb-data:
