x-arcane:
  urls:
    - https://flowiseai.com

services:
  flowise:
    image: flowiseai/flowise:${FLOWISE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      FLOWISE_USERNAME: ${FLOWISE_USERNAME:-admin}
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD}
    volumes:
      - flowise-data:/root/.flowise

volumes:
  flowise-data:
