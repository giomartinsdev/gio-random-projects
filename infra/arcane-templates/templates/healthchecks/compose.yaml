x-arcane:
  urls:
    - https://healthchecks.io

services:
  healthchecks:
    image: healthchecks/healthchecks:${HEALTHCHECKS_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DEBUG: "False"
      SITE_ROOT: ${SITE_ROOT:-http://localhost:8000}
    volumes:
      - healthchecks-data:/data

volumes:
  healthchecks-data:
