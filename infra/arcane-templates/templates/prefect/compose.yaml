x-arcane:
  urls:
    - https://www.prefect.io/

services:
  prefect-server:
    image: prefecthq/prefect:${PREFECT_VERSION:-3-latest}
    restart: unless-stopped
    command: ["prefect", "server", "start"]
    ports:
      - "${APP_PORT:-4200}:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://localhost:4200/api}
    volumes:
      - prefect-data:/root/.prefect
    networks:
      - prefect-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  prefect-worker:
    image: prefecthq/prefect:${PREFECT_VERSION:-3-latest}
    restart: unless-stopped
    depends_on:
      prefect-server:
        # Without this the worker races the server's first-boot DB
        # migration ("database is locked") and its own API port not being
        # open yet ("All connection attempts failed") — a plain
        # container-started depends_on isn't enough here.
        condition: service_healthy
    # Idempotent: work-pool create fails (harmlessly) if the pool already
    # exists from a previous start, so this is safe to re-run on every boot.
    # prefect-docker isn't in the base image — the docker worker type
    # can't start without it. `set -e` + an explicit import check turn a
    # silent pip failure into a loud, diagnosable container crash instead
    # of the confusing runtime "dependencies missing" error.
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        python -m pip install --no-cache-dir --root-user-action=ignore prefect-docker
        python -c "import prefect_docker"
        prefect work-pool create ${PREFECT_WORK_POOL:-docker-pool} --type docker || true
        exec prefect worker start --pool ${PREFECT_WORK_POOL:-docker-pool}
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    networks:
      - prefect-net
    volumes:
      # Docker work pool: the worker launches each flow run as a sibling
      # container via the host's own Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  prefect-data:

networks:
  # Named explicitly (not left to compose's auto-generated
  # "<project>_default") so prefect.yaml deployments can reference it by a
  # stable name in job_variables.networks — flow-run containers the worker
  # spawns need to be on this SAME network to resolve "prefect-server" at
  # all. Without it: "httpcore.ConnectError: Name or service not known".
  prefect-net:
    name: ${PREFECT_NETWORK:-prefect-net}
