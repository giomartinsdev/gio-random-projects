x-arcane:
  urls:
    - https://changedetection.io

services:
  changedetection:
    image: dgtlmoon/changedetection.io:${CHANGEDETECTION_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - changedetection-data:/datastore

volumes:
  changedetection-data:
