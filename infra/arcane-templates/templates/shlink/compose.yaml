x-arcane:
  urls:
    - https://shlink.io

services:
  shlink:
    image: shlinkio/shlink:${SHLINK_VERSION:-stable}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:8080"
    environment:
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost}
      IS_HTTPS_ENABLED: ${IS_HTTPS_ENABLED:-false}
    volumes:
      - shlink-data:/etc/shlink/data

volumes:
  shlink-data:
