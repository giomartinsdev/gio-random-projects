x-arcane:
  urls:
    - https://docs.docker.com/registry/

services:
  # One-shot: generates a bcrypt htpasswd file the registry container reads
  # on startup. registry:2's image is a minimal Go binary with no htpasswd
  # tool of its own — httpd:2.4-alpine (Apache) has one via apache2-utils.
  # Exits after writing the file; the registry waits for that exit via
  # service_completed_successfully before starting, so it never boots
  # without auth configured.
  htpasswd-init:
    image: httpd:${HTPASSWD_INIT_VERSION:-2.4-alpine}
    entrypoint: ["sh", "-c"]
    command:
      - |
        htpasswd -Bbn "$$REGISTRY_USER" "$$REGISTRY_PASSWORD" > /auth/htpasswd
    environment:
      REGISTRY_USER: ${REGISTRY_USER:-admin}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}
    volumes:
      - registry-auth:/auth

  registry:
    image: registry:${REGISTRY_VERSION:-2}
    restart: unless-stopped
    depends_on:
      htpasswd-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      # No auth by default is a real bug, not a "keep it internal" design
      # choice — verified: an unauthenticated `docker push` against a
      # plain registry:2 succeeds. Basic auth via htpasswd is the
      # officially documented way to lock down a single-node registry
      # without a separate auth service.
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry Realm"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      # Without this, blob-upload responses embed an ABSOLUTE Location URL
      # built from whatever Host header the registry saw — which escapes
      # any reverse proxy in front of it (Cloudflare Tunnel/Access here).
      # The client follows that Location directly on the next request,
      # bypassing the proxy (and whatever auth it injected) entirely.
      # Confirmed by reproducing the failure locally without this, then
      # fixing it: relative URLs resolve against the original request's
      # host, so every follow-up request stays on the same path in.
      REGISTRY_HTTP_RELATIVEURLS: "true"
    volumes:
      - registry-data:/var/lib/registry
      - registry-auth:/auth:ro

volumes:
  registry-data:
  registry-auth:
