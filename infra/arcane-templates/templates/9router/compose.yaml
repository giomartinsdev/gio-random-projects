x-arcane:
  urls:
    - https://github.com/decolua/9router

services:
  9router:
    image: decolua/9router:${NINEROUTER_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-20128}:20128"
    environment:
      DATA_DIR: /app/data
    volumes:
      - 9router-data:/app/data

volumes:
  9router-data:
