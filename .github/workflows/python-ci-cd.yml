name: Python deploy

# CI/CD for the Python workers under modules/apps/*/ (has both a
# Dockerfile and a pyproject.toml) — touch only modules/apps/clubs-ingest/**
# and only the clubs-ingest image rebuilds, gets pushed, and redeploys.
#
# The `paths:` filter lists EVERY vendored app explicitly, and that is
# deliberate: a filter that names one app while the discover step knows about
# two is a silent hole — a push touching only the un-listed app starts no run
# at all, so the image is never rebuilt and nothing reports a problem (§11-1).
# finance-whatsapp-worker/** is deliberately NOT here yet: its app does not
# exist in the repo (stacks/finance.yml marks that service as a contract for
# the next slice), and listing a path with nothing behind it would only
# advertise a pipeline that cannot do anything.
# packages/** is a trigger too (§11-2): a change there rebuilds the apps that
# import that package (map in the discover step below), never all of them.
# Go apps go through go-ci-cd.yml, TypeScript frontends through
# ts-frontend-ci-cd.yml — each language keeps its own pipeline because
# the test/build steps never generalize for free.
#
# One difference from go-ci-cd.yml worth knowing:
# - Build context is the REPO ROOT, not the app dir: clubs-ingest
#   vendors its fc27 client (src/clubs_ingest/fc27_api.py) and a
#   Dockerfile COPY of paths above the app dir would dead-end if the
#   context were the app folder itself.

on:
  push:
    branches: [main]
    paths:
      - "modules/apps/clubs-ingest/**"
      # §11-1: the discover step below rebuilds finance-api, but without this
      # line a push that only touched that app would never start a run, so the
      # app would build never and say nothing. The filter and the discover rule
      # have to name the same apps or one of them is dead code.
      - "modules/apps/finance-api/**"
      # Shared code lives in packages/ (§7). Without this, a commit that only
      # edits the shared contract triggers NOTHING and production keeps the
      # stale contract (§11-2) — the discover rule below needs the run to
      # start before it can rebuild the dependents.
      - "packages/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all python apps under modules/apps/)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        run: |
          all_apps=$(find modules/apps -mindepth 2 -maxdepth 2 -name pyproject.toml \
            -exec dirname {} \; | xargs -n1 basename | sort)

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")

            # §11-2: a package change rebuilds the apps that import it. The map
            # is EXPLICIT, not a blanket `^packages/` rule: a blanket rule
            # rebuilds every python app for a contract most of them cannot see
            # (clubs-ingest does not import finance-contracts), and a package
            # whose change rebuilds nobody is the §11 risk -- green build with a
            # stale contract in production. Adding a package here is a one-line
            # change; the assertion below stops the map from rotting silently.
            declare -A PACKAGE_APPS=( [packages/finance-contracts]=finance-api )
            for pkg in "${!PACKAGE_APPS[@]}"; do
              dependents="${PACKAGE_APPS[$pkg]}"
              for dependent in $dependents; do
                [ -d "modules/apps/$dependent" ] || {
                  echo "::error::$pkg maps to modules/apps/$dependent, which does not exist"
                  exit 1
                }
              done
            done

            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
                continue
              fi
              for pkg in "${!PACKAGE_APPS[@]}"; do
                case " ${PACKAGE_APPS[$pkg]} " in
                  *" $a "*) ;;
                  *) continue ;;
                esac
                if echo "$changed" | grep -q "^$pkg/"; then
                  apps="$apps $a"
                  break
                fi
              done
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    # Um push novo cancela o build do anterior (ver go-ci-cd.yml). O grupo
    # inclui o APP: sem ele, os jobs da mesma matrix entram no mesmo grupo e
    # cancelam uns aos outros. O deploy fica de fora: ele compartilha o
    # concurrency "terraform-apply" abaixo, com cancel-in-progress: false, para
    # um apply nunca morrer no meio.
    concurrency:
      group: py-build-${{ matrix.app }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: hashFiles(format('modules/apps/{0}/pyproject.toml', matrix.app)) != ''
        with:
          python-version: "3.12"

      - name: Test (Python apps only — skipped for anything without a pyproject.toml)
        if: hashFiles(format('modules/apps/{0}/pyproject.toml', matrix.app)) != ''
        working-directory: modules/apps/${{ matrix.app }}
        # Absolute path: cwd is the app dir, so a relative pip arg would
        # dead-end. The package itself is installed (not just its deps)
        # because the tests import the worker's own mapping code.
        run: |
          # §11-3: an app whose pyproject declares a vendored `packages/*`
          # dependency cannot be installed on its own -- pip looks for that
          # name on the index, there is no private PyPI here, and the install
          # dies with "No matching distribution found". So the path is
          # discovered from the app's own pyproject and passed in the SAME pip
          # invocation, which is what lets the resolver satisfy the dependency
          # from source. Detection, not another hard-coded map: a second
          # consumer of `packages/finance-contracts` in a later slice is picked
          # up with no workflow edit, and an app that imports nothing shared
          # (clubs-ingest) stays exactly as it was.
          pkg_args=""
          for pkg in "${{ github.workspace }}"/packages/*/; do
            [ -f "${pkg}pyproject.toml" ] || continue
            name=$(grep -m1 '^name = ' "${pkg}pyproject.toml" | cut -d'"' -f2)
            if grep -q "\"${name}\"" "${{ github.workspace }}/modules/apps/${{ matrix.app }}/pyproject.toml"; then
              echo "vendored dependency detected: ${name} -> ${pkg}"
              pkg_args="$pkg_args $pkg"
            fi
          done

          pip install -q $pkg_args "${{ github.workspace }}/modules/apps/${{ matrix.app }}" pytest
          # Os extras de dev (pytest-bdd, testcontainers, docker) trazem o BDD e
          # a infra real dos testes de integração. Sem eles, os cenários que usam
          # container se PULAM em silêncio -- e um teste que se pula não existe.
          # Por isso a instalação NÃO leva `|| true`: se falhar, o job vermelha em
          # vez de dar verde sem ter rodado os cenários.
          #
          pip install -q $pkg_args "${{ github.workspace }}/modules/apps/${{ matrix.app }}[dev]"
          python -m pytest -q

      # Same reasoning as go-ci-cd.yml: the VPS is arm64, this runner
      # is amd64, and QEMU is what lets BuildKit produce an arm64 image
      # at all (python:3.12-slim is multi-arch, so no base-image swap
      # needed -- QEMU just runs the pip install layer arm-native).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # registry.giomartins.dev:5000 is plain HTTP (Phase 1 — see
      # modules/infra/terraform/README.md); same daemon.json dance as
      # go-ci-cd.yml, needed before docker/login-action works at all.
      - name: Allow the runner's dockerd to talk to the registry over plain HTTP
        run: |
          echo '{"insecure-registries": ["registry.giomartins.dev:5000"]}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."registry.giomartins.dev:5000"]
              http = true
              insecure = true

      # Same vault-backed credentials as go-ci-cd.yml's step of the
      # same name -- no GitHub-secret copy of the registry password.
      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          echo "DOCKER_HOST=ssh://ubuntu@$VPS_HOST" >> "$GITHUB_ENV"

      - name: Fetch registry credentials from Vaultwarden
        env:
          NETWORK_NAME: apps
          VAULTWARDEN_CLIENT_ID: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
          VAULTWARDEN_CLIENT_SECRET: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
          VAULTWARDEN_MASTER_PASSWORD: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
          ITEM_MAP: "REGISTRY_USERNAME=REGISTRY_USERNAME REGISTRY_PASSWORD=REGISTRY_PASSWORD"
        run: |
          set -o pipefail
          modules/infra/terraform/scripts/fetch_vault_secret.sh | while IFS='=' read -r k v; do
            echo "::add-mask::$v"
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done

      - name: Log in to registry.giomartins.dev:5000
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev:5000
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # Repo-root context (see the header note): the Dockerfile copies
      # vendored files from paths above the app dir.
      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: modules/apps/${{ matrix.app }}/Dockerfile
          push: true
          platforms: linux/arm64
          # Cache de camadas no cache do Actions (ver go-ci-cd.yml). O `pip
          # install` do app e da lib compartilhada é a camada cara: sem cache,
          # todo push baixa e reinstala as dependências de novo.
          cache-from: type=gha,scope=py-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=py-${{ matrix.app }}
          tags: |
            registry.giomartins.dev:5000/${{ matrix.app }}:latest
            registry.giomartins.dev:5000/${{ matrix.app }}:${{ github.sha }}

  # Redeploy da stack no Dockhand depois de buildar/pushar a imagem -- mesmo
  # desenho do go-ci-cd.yml (webhook do git stack via loopback SSH, secret
  # DOCKHAND_WEBHOOK_SECRET). Mapa app->stack: clubs=5.
  deploy:
    needs: [discover, build-and-push]
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: dockhand-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Trigger Dockhand redeploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
          APPS: ${{ needs.discover.outputs.apps }}
        run: |
          if [ -z "$DOCKHAND_WEBHOOK_SECRET" ]; then
            echo "::warning::DOCKHAND_WEBHOOK_SECRET não configurado; pulando redeploy (a :latest já foi publicada)."
            exit 0
          fi
          # §10.4-4/§10.4-5. Every app the discover step can emit needs an
          # entry here -- an app missing from this map is the §14 risk
          # "build verde, nada sobe", so a discovered app with no id fails
          # loudly below instead of reporting success.
          #   [finance-api]=14 -- the numeric id of the `finance` stack
          #   (stacks/finance.yml, env 1/prd, repo 1), created 2026-10-04.
          #   Only readable from the Dockhand UI after login: never invent one.
          #   [finance-whatsapp-worker] stays EMPTY on purpose: it is the same
          #   stack as finance-api (one compose, one webhook, so both would
          #   collapse to one id), and the app does not exist yet
          #   (0 files under modules/apps/finance-whatsapp-worker/). The moment
          #   discover can emit it, the fail-loud branch below fires and the id
          #   must be filled in the same commit that first deploys it.
          declare -A STACK=( [clubs-ingest]=5 [finance-api]=14 [finance-whatsapp-worker]= )
          if [ -z "$APPS" ] || [ "$APPS" = "[]" ]; then
            echo "nada a deployar (nenhum app descoberto)"
            exit 0
          fi
          # An app that built with no id mapped is a failure, not a quiet skip:
          # the image was published and nothing will pick it up. `nada a
          # deployar` is reserved for the genuinely empty case above.
          ids=""
          for a in $(echo "$APPS" | jq -r '.[]'); do
            id="${STACK[$a]}"
            if [ -z "$id" ]; then
              echo "::error::$a built, but STACK has no id for it: the image was published and no stack will redeploy (§10.4-4/5). Add [${a}]=<id> to STACK."
              exit 1
            fi
            ids="$ids $id"
          done
          ids=$(echo "$ids" | tr ' ' '\n' | grep -v '^$' | sort -u)
          for id in $ids; do
            echo "== redeploy stack id=$id"
            out=$(ssh "ubuntu@$VPS_HOST" "curl -sS -m 900 'http://127.0.0.1:8093/api/git/stacks/$id/webhook?secret=$DOCKHAND_WEBHOOK_SECRET'")
            echo "$out" | head -c 600; echo
            echo "$out" | grep -q '"success":true' || { echo "::error::webhook falhou para o stack $id"; exit 1; }
          done

