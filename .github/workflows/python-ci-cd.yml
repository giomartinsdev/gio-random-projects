name: Python deploy

# CI/CD for the Python workers under modules/apps/*/ (has both a
# Dockerfile and a pyproject.toml) — touch only
# modules/apps/finance-customersupport-worker/** and only that image rebuilds,
# gets pushed, and redeploys.
#
# The `paths:` filter lists EVERY vendored app explicitly, and that is
# deliberate: a filter that names one app while the discover step knows about
# two is a silent hole — a push touching only the un-listed app starts no run
# at all, so the image is never rebuilt and nothing reports a problem (§11-1).
# finance-customersupport-worker/** IS listed below: the app exists in the repo
# (the conversational consumer/gateway for the finance context, see
# modules/apps/finance-customersupport-worker and stacks/finance.yml).
# packages/** is a trigger too (§11-2): a change there rebuilds the apps that
# import that package (map in the discover step below), never all of them.
# Go apps go through go-ci-cd.yml, TypeScript frontends through
# ts-frontend-ci-cd.yml — each language keeps its own pipeline because
# the test/build steps never generalize for free.
#
# O deploy commita o digest de volta em `main` (default do repo é `read`).
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      # §11-1: the discover step below rebuilds finance-api, but without this
      # line a push that only touched that app would never start a run, so the
      # app would build never and say nothing. The filter and the discover rule
      # have to name the same apps or one of them is dead code.
      - "modules/apps/finance-api/**"
      - "modules/apps/finance-customersupport-worker/**"
      - "modules/apps/finance-openfinance-worker/**"
      # Shared code lives in packages/ (§7). Without this, a commit that only
      # edits the shared contract triggers NOTHING and production keeps the
      # stale contract (§11-2) — the discover rule below needs the run to
      # start before it can rebuild the dependents.
      - "packages/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all python apps under modules/apps/)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        run: |
          all_apps=$(find modules/apps -mindepth 2 -maxdepth 2 -name pyproject.toml \
            -exec dirname {} \; | xargs -n1 basename | sort)

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")

            # §11-2: a package change rebuilds the apps that import it. The map
            # is EXPLICIT, not a blanket `^packages/` rule: a blanket rule
            # rebuilds every python app for a contract most of them cannot see
            # (finance-customersupport-worker does not import every package), and a package
            # whose change rebuilds nobody is the §11 risk -- green build with a
            # stale contract in production. Adding a package here is a one-line
            # change; the assertion below stops the map from rotting silently.
            declare -A PACKAGE_APPS=( [packages/finance-contracts]="finance-api finance-customersupport-worker finance-openfinance-worker" )
            for pkg in "${!PACKAGE_APPS[@]}"; do
              dependents="${PACKAGE_APPS[$pkg]}"
              for dependent in $dependents; do
                [ -d "modules/apps/$dependent" ] || {
                  echo "::error::$pkg maps to modules/apps/$dependent, which does not exist"
                  exit 1
                }
              done
            done

            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
                continue
              fi
              for pkg in "${!PACKAGE_APPS[@]}"; do
                case " ${PACKAGE_APPS[$pkg]} " in
                  *" $a "*) ;;
                  *) continue ;;
                esac
                if echo "$changed" | grep -q "^$pkg/"; then
                  apps="$apps $a"
                  break
                fi
              done
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    # arm64 NATIVO (grátis/ilimitado em repo público) -- ver go-ci-cd.yml.
    runs-on: ubuntu-24.04-arm
    # Um push novo cancela o build do anterior (ver go-ci-cd.yml). O grupo
    # inclui o APP: sem ele, os jobs da mesma matrix entram no mesmo grupo e
    # cancelam uns aos outros. O deploy fica de fora: ele compartilha o
    # concurrency "terraform-apply" abaixo, com cancel-in-progress: false, para
    # um apply nunca morrer no meio.
    concurrency:
      group: py-build-${{ matrix.app }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: hashFiles(format('modules/apps/{0}/pyproject.toml', matrix.app)) != ''
        with:
          python-version: "3.12"

      - name: Test (Python apps only — skipped for anything without a pyproject.toml)
        if: hashFiles(format('modules/apps/{0}/pyproject.toml', matrix.app)) != ''
        working-directory: modules/apps/${{ matrix.app }}
        # Absolute path: cwd is the app dir, so a relative pip arg would
        # dead-end. The package itself is installed (not just its deps)
        # because the tests import the worker's own mapping code.
        run: |
          # §11-3: an app whose pyproject declares a vendored `packages/*`
          # dependency cannot be installed on its own -- pip looks for that
          # name on the index, there is no private PyPI here, and the install
          # dies with "No matching distribution found". So the path is
          # discovered from the app's own pyproject and passed in the SAME pip
          # invocation, which is what lets the resolver satisfy the dependency
          # from source. Detection, not another hard-coded map: a second
          # consumer of `packages/finance-contracts` in a later slice is picked
          # up with no workflow edit, and an app that imports nothing shared
          
          pkg_args=""
          for pkg in "${{ github.workspace }}"/packages/*/; do
            [ -f "${pkg}pyproject.toml" ] || continue
            name=$(grep -m1 '^name = ' "${pkg}pyproject.toml" | cut -d'"' -f2)
            if grep -q "\"${name}\"" "${{ github.workspace }}/modules/apps/${{ matrix.app }}/pyproject.toml"; then
              echo "vendored dependency detected: ${name} -> ${pkg}"
              pkg_args="$pkg_args $pkg"
            fi
          done

          pip install -q $pkg_args "${{ github.workspace }}/modules/apps/${{ matrix.app }}" pytest
          # Os extras de dev (pytest-bdd, testcontainers, docker) trazem o BDD e
          # a infra real dos testes de integração. Sem eles, os cenários que usam
          # container se PULAM em silêncio -- e um teste que se pula não existe.
          # Por isso a instalação NÃO leva `|| true`: se falhar, o job vermelha em
          # vez de dar verde sem ter rodado os cenários.
          #
          pip install -q $pkg_args "${{ github.workspace }}/modules/apps/${{ matrix.app }}[dev]"
          python -m pytest -q

      # Build + push + digest. Toda a mecânica (túnel do registry, credencial
      # vinda do Secret do cluster, BuildKit com netns do host, cache no
      # Actions) vive em `.github/actions/build-push-cluster` — ver o
      # cabeçalho de go-ci-cd.yml para o porquê de cada peça.
      #
      # O que saiu daqui: `setup-qemu` (runner é arm64 nativo),
      # `insecure-registries` no daemon.json, `DOCKER_HOST=ssh://` (build era
      # no daemon da VPS) e `fetch_vault_secret.sh` (fazia `docker run`).
      - name: Build and push ${{ matrix.app }}
        id: build
        uses: ./.github/actions/build-push-cluster
        with:
          vps-host: ${{ secrets.VPS_HOST }}
          app: ${{ matrix.app }}
          # Contexto na raiz: o Dockerfile copia arquivos de `packages/`.
          context: .
          dockerfile: modules/apps/${{ matrix.app }}/Dockerfile
          cache-scope: py-${{ matrix.app }}

      - name: Hand the digest to the deploy job
        run: echo "${{ steps.build.outputs.digest }}" > "$RUNNER_TEMP/digest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.app }}
          path: ${{ runner.temp }}/digest.txt
          retention-days: 1

  # Deploy = gravar o digest no manifesto e commitar (ArgoCD aplica).
  # Antes: webhook do Dockhand + prova por `docker ps`. Os containers que ele
  # procurava não existem mais (todos `profiles: ["retired"]`), então o job
  # falharia sempre. Ver go-ci-cd.yml.
  deploy:
    needs: [discover, build-and-push]
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: image-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests

      - name: Record each digest in git
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `bump-digest.sh` só PREPARA (`git add`); o commit é um só, aqui.
          # Um commit por app daria N pushes concorrentes em `main`.
          for d in "$RUNNER_TEMP"/digests/digest-*/; do
            app=$(basename "$d"); app=${app#digest-}
            digest=$(tr -d '\r\n' < "${d}digest.txt")
            [ -n "$digest" ] || { echo "::error::digest vazio para $app"; exit 1; }
            echo "== $app -> $digest"
            .github/scripts/bump-digest.sh "$app" "$digest"
          done
          if git diff --cached --quiet; then
            echo "nenhum manifesto mudou"
            exit 0
          fi
          git commit -m "deploy: imagens arm64 do CI ($(date -u +%Y-%m-%dT%H:%MZ))"

      - name: Push the digest commits
        run: |
          set -euo pipefail
          if [ -z "$(git log "origin/${GITHUB_REF_NAME}..HEAD" --oneline)" ]; then
            echo "nada a publicar (digests já estavam no git)"; exit 0
          fi
          for i in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "digest publicado"; exit 0
            fi
            echo "  push falhou (tentativa $i); rebase e repete"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 3))
          done
          echo "::error::não consegui publicar o commit dos digests"
          exit 1
