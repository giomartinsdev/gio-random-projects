name: Cloudflare (Terraform)

# infra/terraform is the source of truth for everything Cloudflare in
# this repo: DNS records and Zero Trust Access, both derived from
# infra/cloudflared/config.yml's hostname list (see that config's
# locals.tf). Plans on PRs touching either; applies on push to main.
# State lives in Cloudflare R2 (bucket created once via
# infra/terraform-bootstrap) — see infra/terraform/README.md for the
# one-time setup this still depends on (account ID, zone ID, Google
# identity provider ID, an R2 API token, and a CLOUDFLARE_API_TOKEN
# scoped for both DNS and Access).

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "infra/cloudflared/config.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/cloudflared/config.yml"

defaults:
  run:
    working-directory: infra/terraform

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_google_idp_identity_provider_id: ${{ secrets.CLOUDFLARE_GOOGLE_IDP_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Init
        run: terraform init -backend-config="endpoints={s3=\"${{ secrets.TF_STATE_R2_ENDPOINT }}\"}"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
