name: One-time bridge response check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Start Cloudflare Access header-injecting proxy for dockerd
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_SECRET }}
        run: |
          cat > /tmp/default.conf.template <<'EOF'
          server {
              listen 2475;
              client_max_body_size 0;
              location / {
                  proxy_pass https://docker.giomartins.dev;
                  proxy_set_header Host docker.giomartins.dev;
                  proxy_set_header CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}";
                  proxy_set_header CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}";
                  proxy_ssl_server_name on;
                  proxy_http_version 1.1;
              }
          }
          EOF
          docker run -d --name access-proxy --network host \
            -e CF_ACCESS_CLIENT_ID \
            -e CF_ACCESS_CLIENT_SECRET \
            -v /tmp/default.conf.template:/etc/nginx/templates/default.conf.template:ro \
            nginx:alpine
          sleep 2

      - name: Check uptime and query the bridge directly
        env:
          DOCKER_HOST: tcp://localhost:2475
        run: |
          echo "=== container uptime/restart counts ==="
          docker inspect domain-api --format 'domain-api StartedAt={{.State.StartedAt}} RestartCount={{.RestartCount}}'
          docker inspect domain-worker --format 'domain-worker StartedAt={{.State.StartedAt}} RestartCount={{.RestartCount}}'
          docker inspect vaultwarden-api --format 'vaultwarden-api StartedAt={{.State.StartedAt}} RestartCount={{.RestartCount}}'

          echo "=== live query to the bridge from inside the apps network (status + presence only, never the value) ==="
          docker run --rm --network apps -e BRIDGE_KEY="${{ secrets.TF_VAULTWARDEN_BRIDGE_API_KEY }}" curlimages/curl:latest \
            sh -c '
              CODE=$(curl -s -o /tmp/r.json -w "%{http_code}" -H "Authorization: Bearer $BRIDGE_KEY" http://vaultwarden-api:8080/secret/DATABASE_URL)
              echo "HTTP $CODE"
              if grep -q "\"value\"" /tmp/r.json; then
                echo "response has a non-empty value field"
              else
                echo "no value field in response -- body was:"
                cat /tmp/r.json
              fi
            '

          echo "=== bridge's own logs ==="
          docker logs --tail 80 vaultwarden-api 2>&1
