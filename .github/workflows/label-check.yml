name: One-time label check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Start Cloudflare Access header-injecting proxy for dockerd
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_SECRET }}
        run: |
          cat > /tmp/default.conf.template <<'EOF'
          server {
              listen 2475;
              client_max_body_size 0;
              location / {
                  proxy_pass https://docker.giomartins.dev;
                  proxy_set_header Host docker.giomartins.dev;
                  proxy_set_header CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}";
                  proxy_set_header CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}";
                  proxy_ssl_server_name on;
                  proxy_http_version 1.1;
              }
          }
          EOF
          docker run -d --name access-proxy --network host \
            -e CF_ACCESS_CLIENT_ID \
            -e CF_ACCESS_CLIENT_SECRET \
            -v /tmp/default.conf.template:/etc/nginx/templates/default.conf.template:ro \
            nginx:alpine
          sleep 2

      - name: Remove the watchtower-labeled domain-api/domain-worker containers
        env:
          DOCKER_HOST: tcp://localhost:2475
        run: |
          # Terraform's label-removal apply never actually took effect
          # on these two (confirmed live: still carry
          # com.centurylinklabs.watchtower.enable=true) -- the docker
          # provider's labels diffing on an EXISTING tracked resource
          # is unreliable. A fresh create never hits that bug since
          # there's nothing to diff away, so remove them once here and
          # let the next `terraform apply` create both from scratch
          # with the current (labelless) config -- brief downtime for
          # both until that apply lands, seconds afterward.
          docker rm -f domain-api domain-worker
