name: Sync Cloudflare DNS from tunnel config

# Every hostname in infra/cloudflared/config.yml's ingress list gets a
# CNAME pointed at this tunnel, upserted via the Cloudflare API directly
# — not `cloudflared tunnel route dns`, which needs a cert.pem the
# tunnel container doesn't persist across recreates (that's why DNS
# stopped getting applied automatically partway through this repo's
# history: the cert was only ever in the container's ephemeral
# filesystem). Running this from CI means DNS sync no longer depends on
# any state living on the server at all.

on:
  push:
    branches: [main]
    paths:
      - "infra/cloudflared/config.yml"
      - ".github/workflows/dns-sync.yml"

jobs:
  sync-dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      # TUNNEL_ID isn't a GitHub secret (it's already public, committed in
      # infra/cloudflared/config.yml) so Actions won't auto-redact it —
      # this repo is public, mask it in logs anyway rather than have the
      # sync script's own output repeat it.
      - run: echo "::add-mask::36f8270d-52a2-4635-b9f2-f5174307e76e"

      # Requires two repo secrets (Settings → Secrets → Actions):
      #   CLOUDFLARE_API_TOKEN — create at Cloudflare → My Profile → API
      #     Tokens → Create Token, permission Zone / DNS / Edit, scoped
      #     to the giomartins.dev zone.
      #   CLOUDFLARE_ZONE_ID — Cloudflare dashboard → giomartins.dev →
      #     Overview page, right sidebar ("Zone ID").
      - name: Upsert DNS records for every ingress hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TUNNEL_ID: "36f8270d-52a2-4635-b9f2-f5174307e76e"
        run: python3 .github/scripts/sync_cloudflare_dns.py infra/cloudflared/config.yml
