name: Terraform deploy

# modules/infra/terraform is the source of truth for everything
# Cloudflare AND for postgres/redis/api/worker container definitions
# in this repo — all driven from that config's locals.tf and
# compute.tf. Plans on PRs touching it; applies on push to main. State
# lives in Cloudflare R2 (bucket created once via
# modules/infra/terraform-bootstrap) — see
# modules/infra/terraform/README.md for the one-time setup this still
# depends on (account ID, zone ID, Google identity provider ID, an R2
# API token, a CLOUDFLARE_API_TOKEN scoped for both DNS and Access, and
# the docker.giomartins.dev Access service token compute.tf's provider
# "docker" connects through).

on:
  push:
    branches: [main]
    paths:
      - "modules/infra/terraform/**"
  pull_request:
    paths:
      - "modules/infra/terraform/**"

defaults:
  run:
    working-directory: modules/infra/terraform

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_google_idp_identity_provider_id: ${{ secrets.CLOUDFLARE_GOOGLE_IDP_ID }}
  TF_VAR_postgres_password: ${{ secrets.TF_POSTGRES_PASSWORD }}
  TF_VAR_domain_api_keys: ${{ secrets.TF_DOMAIN_API_KEYS }}
  TF_VAR_registry_password: ${{ secrets.TF_REGISTRY_PASSWORD }}
  TF_VAR_beszel_agent_key: ${{ secrets.TF_BESZEL_AGENT_KEY }}
  TF_VAR_docker_host: "tcp://localhost:2475"
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The docker provider (compute.tf) can't attach the
      # CF-Access-Client-Id/Secret headers docker.giomartins.dev's
      # Access service-token policy requires — same limitation the
      # registry push workaround this repo used to have ran into. This
      # sidecar terminates plain HTTP on localhost, injects those two
      # headers on every request, forwards to the real (HTTPS,
      # Access-protected) daemon. Terraform only ever talks to
      # localhost:2475.
      - name: Start Cloudflare Access header-injecting proxy for dockerd
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_SECRET }}
        run: |
          cat > /tmp/default.conf.template <<'EOF'
          server {
              listen 2475;
              client_max_body_size 0;
              location / {
                  proxy_pass https://docker.giomartins.dev;
                  proxy_set_header Host docker.giomartins.dev;
                  proxy_set_header CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}";
                  proxy_set_header CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}";
                  proxy_ssl_server_name on;
                  proxy_http_version 1.1;
              }
          }
          EOF
          docker run -d --name access-proxy --network host \
            -e CF_ACCESS_CLIENT_ID \
            -e CF_ACCESS_CLIENT_SECRET \
            -v /tmp/default.conf.template:/etc/nginx/templates/default.conf.template:ro \
            nginx:alpine
          sleep 2
          docker logs access-proxy

      # ONE-TIME cleanup, remove after this runs successfully once.
      # b21e62e2-... (an orphan from a failed create_before_destroy
      # retry, now removed from the .tf entirely) turned out to be
      # unused and deleted cleanly. fdeb1afa-... (the original ED25519
      # cert) is the one actually still associated with
      # registry.giomartins.dev — clears that association and deletes
      # it, so the next apply can create the real ECDSA replacement
      # from a clean slate instead of hitting "in use".
      - name: One-time cleanup of the stale ED25519 mTLS CA cert
        run: |
          echo "Clearing fdeb1afa's hostname association"
          curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/certificate_authorities/hostname_associations" \
            -d '{"mtls_certificate_id":"fdeb1afa-7e5d-4d32-b425-7c94baaee4cd","hostnames":[]}'
          echo
          echo "Deleting fdeb1afa"
          curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/mtls_certificates/fdeb1afa-7e5d-4d32-b425-7c94baaee4cd"
          echo

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Init
        run: terraform init -backend-config="endpoints={s3=\"${{ secrets.TF_STATE_R2_ENDPOINT }}\"}"

      # ONE-TIME cleanup, remove after this runs successfully once:
      # module.cloudflare.cloudflare_mtls_certificate.registry_ca's
      # state still points at b21e62e2 (deleted via the API in an
      # earlier cleanup attempt, before this file's history settled),
      # so a plain refresh 400s ("Certificate not found") and blocks
      # even `terraform plan`. Untracking it here lets the next apply
      # create a fresh one against the already-stable local CA
      # (tls_private_key/tls_self_signed_cert.registry_ca, untouched —
      # only the Cloudflare-side upload was ever the problem).
      - name: One-time untrack the broken cloudflare_mtls_certificate state entry
        run: terraform state rm 'module.cloudflare.cloudflare_mtls_certificate.registry_ca' || true

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
