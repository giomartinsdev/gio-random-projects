name: Build and push API images

# Discovers every subfolder of api/ that has a Dockerfile — see
# api/README.md — and builds+pushes each one as its own image. Adding a
# new API under api/<name>/ with a Dockerfile is the only thing needed to
# get it building here; nothing in this file names a specific service.

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-build-push.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: |
          services=$(find api -mindepth 2 -maxdepth 2 -name Dockerfile \
            -exec dirname {} \; | xargs -n1 basename | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Discovered services: $services"
          echo "services=$services" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - working-directory: api/${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: api/${{ matrix.service }}
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (pyright)
        working-directory: api/${{ matrix.service }}
        run: pyright .

      - name: Test (pytest)
        working-directory: api/${{ matrix.service }}
        run: pytest -v

  build-and-push:
    needs: [discover, test]
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      # registry.giomartins.dev sits behind Cloudflare Access (Service
      # Auth), same as prefect.giomartins.dev — but unlike Prefect's own
      # HTTP client (which can be told to attach custom headers via
      # PREFECT_CLIENT_CUSTOM_HEADERS, see flows-ci.yml's deploy job), the Docker
      # client has no equivalent option: it can't send CF-Access-Client-Id
      # /Secret on push/pull. This nginx sidecar is the workaround —
      # terminates plain HTTP on localhost, injects those two headers on
      # every request via envsubst'd config, forwards to the real
      # (HTTPS, Access-protected) registry. Docker only ever talks to
      # localhost:5050; nginx is what actually reaches Cloudflare.
      - name: Start Cloudflare Access header-injecting proxy
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cat > /tmp/default.conf.template <<'EOF'
          server {
              listen 5050;
              client_max_body_size 0;
              location / {
                  proxy_pass https://registry.giomartins.dev;
                  proxy_set_header Host registry.giomartins.dev;
                  proxy_set_header CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}";
                  proxy_set_header CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}";
                  proxy_ssl_server_name on;
              }
          }
          EOF
          docker run -d --name access-proxy --network host \
            -e CF_ACCESS_CLIENT_ID \
            -e CF_ACCESS_CLIENT_SECRET \
            -v /tmp/default.conf.template:/etc/nginx/templates/default.conf.template:ro \
            nginx:alpine
          sleep 2
          docker logs access-proxy

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host
          config-inline: |
            [registry."localhost:5050"]
              http = true
              insecure = true

      - name: Log in to registry (via the local Access-proxy)
        uses: docker/login-action@v3
        with:
          registry: localhost:5050
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          # Context is api/ (not api/<service>/) so each Dockerfile can
          # COPY the shared/ telemetry package — see api/README.md.
          context: api
          file: api/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            localhost:5050/${{ matrix.service }}:latest
            localhost:5050/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
