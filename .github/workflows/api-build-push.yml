name: Build and push API image

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-build-push.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Unlike prefect.giomartins.dev/otel.giomartins.dev, this registry is
      # NOT behind Cloudflare Access — `docker login` sends plain HTTP
      # Basic Auth, which is exactly what the registry's own htpasswd auth
      # expects (see infra/arcane-templates/templates/registry). Create
      # these two secrets in this repo's Settings → Secrets → Actions,
      # matching whatever REGISTRY_USER/REGISTRY_PASSWORD the registry
      # deployment itself was given.
      - name: Log in to registry.giomartins.dev
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            registry.giomartins.dev/domain-api:latest
            registry.giomartins.dev/domain-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
