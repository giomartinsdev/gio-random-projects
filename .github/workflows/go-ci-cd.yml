name: Go deploy

# CI/CD for the Go apps under modules/apps/*/ (has both a Dockerfile
# and a go.mod) — touch only modules/apps/domain-api/** and only the
# domain-api image rebuilds, gets pushed, and redeploys; same for
# domain-worker. TypeScript apps go through ts-frontend-ci-cd.yml,
# Python ones through python-ci-cd.yml — see either workflow's own
# header for why this isn't one generic pipeline for every language.
#
# Deploys: este workflow só BUILD e PUSH da imagem pro registry. O
# redeploy é do Dockhand (stacks persistidas em `stacks/`, ver
# stacks/README.md) — o antigo deploy job que rodava `terraform apply`
# foi removido na migração. Enquanto o Dockhand não dispara deploy por
# webhook, um push novo atualiza a imagem `:latest` e o redeploy é feito
# no Dockhand (ou `docker compose up -d` no stack).

on:
  push:
    branches: [main]
    paths:
      - "modules/apps/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all apps under modules/apps/)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        run: |
          all_apps=$(find modules/apps -mindepth 2 -maxdepth 2 -name go.mod \
            -exec dirname {} \; | xargs -n1 basename | sort)

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
              fi
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    # Um push novo cancela o build do anterior: dois pushes seguidos não devem
    # gastar dois builds completos quando o segundo já os substitui. O grupo
    # inclui o APP (matrix.app) -- sem ele, os jobs da mesma matrix entram no
    # mesmo grupo e cancelam UNS AOS OUTROS ("Canceling since a higher priority
    # waiting request exists"), deixando só um app buildar. O DEPLOY não entra
    # nisto (tem o próprio concurrency, mais abaixo, compartilhado com os outros
    # workflows e com cancel-in-progress: false) -- matar um `terraform apply` no
    # meio é o que deixa container pela metade.
    concurrency:
      group: go-build-${{ matrix.app }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        with:
          go-version: "1.25"
          cache-dependency-path: modules/apps/${{ matrix.app }}/go.sum

      - name: Test (Go apps only — skipped for anything without a go.mod)
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        working-directory: modules/apps/${{ matrix.app }}
        # `-count=1` desliga o cache de RESULTADO de teste. Sem ele, o
        # `actions/setup-go` acima restaura GOCACHE entre runs e um teste de
        # integração pode aparecer "ok (cached)" sem ter rodado -- o
        # testcontainers nunca sobe e o CI dá verde sobre um teste que não
        # executou. O cache de COMPILAÇÃO continua valendo (é o que deixa o
        # passo rápido); o que se força é a execução.
        #
        # `go build ./...` era redundante: `go vet` já compila cada pacote, e o
        # cache de build do Go é compartilhado entre os comandos, então o `go
        # test` seguinte reaproveita o que o vet compilou.
        run: go vet ./... && go test -count=1 ./...

      # The VPS is arm64 (Oracle's free-tier Ampere instances), but this
      # runner is amd64 -- QEMU is what lets BuildKit actually produce
      # an arm64 image here instead of one that immediately crash-loops
      # on the VPS with "exec format error" (confirmed live: that's
      # exactly what happened to vaultwarden_bridge's amd64 image on
      # first deploy).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # registry.giomartins.dev:5000 is plain HTTP (Phase 1 — see
      # modules/infra/terraform/README.md), which dockerd rejects by
      # default unless explicitly allow-listed as insecure. `docker
      # login` itself is routed through the runner's own dockerd, so it
      # needs this regardless of which buildx driver builds the image.
      - name: Allow the runner's dockerd to talk to the registry over plain HTTP
        run: |
          echo '{"insecure-registries": ["registry.giomartins.dev:5000"]}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker

      # Cross-arch builds need BuildKit's own isolated docker-container
      # driver (the "docker" driver used before this could only ever
      # target the runner's own architecture) -- which runs its own
      # BuildKit daemon, so the insecure-registry trust above has to be
      # repeated here in BuildKit's own config format.
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."registry.giomartins.dev:5000"]
              http = true
              insecure = true

      # SSH access + fetch are only for reaching the vault below --
      # this job doesn't touch Terraform or var.docker_host at all.
      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          echo "DOCKER_HOST=ssh://ubuntu@$VPS_HOST" >> "$GITHUB_ENV"

      # registry_password isn't secret zero -- it's a regular
      # Terraform resource input Terraform already keeps mirrored in
      # Vaultwarden (secrets.tf's "registry" vault_seed group), so CI
      # reads it from there instead of also holding its own
      # GitHub-secret copy.
      - name: Fetch registry credentials from Vaultwarden
        env:
          NETWORK_NAME: apps
          VAULTWARDEN_CLIENT_ID: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
          VAULTWARDEN_CLIENT_SECRET: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
          VAULTWARDEN_MASTER_PASSWORD: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
          ITEM_MAP: "REGISTRY_USERNAME=REGISTRY_USERNAME REGISTRY_PASSWORD=REGISTRY_PASSWORD"
        run: |
          set -o pipefail
          modules/infra/terraform/scripts/fetch_vault_secret.sh | while IFS='=' read -r k v; do
            echo "::add-mask::$v"
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done

      - name: Log in to registry.giomartins.dev:5000
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev:5000
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: modules/apps/${{ matrix.app }}
          push: true
          platforms: linux/arm64
          # Cache de camadas no cache do Actions. Sem isto, cada push reconstrói
          # do zero: baixa a imagem base, roda `go mod download` e compila tudo
          # de novo, mesmo num commit que só mexeu em um arquivo. `mode=max`
          # cacheia todas as camadas (não só a final), que é o que interessa
          # aqui -- a camada de dependências é a cara e quase nunca muda.
          cache-from: type=gha,scope=go-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=go-${{ matrix.app }}
          tags: |
            registry.giomartins.dev:5000/${{ matrix.app }}:latest
            registry.giomartins.dev:5000/${{ matrix.app }}:${{ github.sha }}

  # Redeploy da stack no Dockhand depois de buildar/pushar a imagem. O
  # webhook é do git stack (por id), chamado pelo loopback do VPS via SSH --
  # não passa pelo Cloudflare Access e não precisa de API token, só do
  # DOCKHAND_WEBHOOK_SECRET (GitHub secret). O stack tem force_redeploy +
  # repull_images ligados, então puxa a :latest nova e recria. Mapa app->stack:
  # domain=4, clubs=5, tela=6.
  deploy:
    needs: [discover, build-and-push]
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: dockhand-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Trigger Dockhand redeploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
          APPS: ${{ needs.discover.outputs.apps }}
        run: |
          if [ -z "$DOCKHAND_WEBHOOK_SECRET" ]; then
            echo "::warning::DOCKHAND_WEBHOOK_SECRET não configurado; pulando redeploy (a :latest já foi publicada)."
            exit 0
          fi
          declare -A STACK=( [domain-api]=4 [domain-worker]=4 [tela-api]=6 [clubs-api]=5 )
          ids=$(echo "$APPS" | jq -r '.[]' | while read -r a; do echo "${STACK[$a]}"; done | grep -v '^$' | sort -u)
          [ -z "$ids" ] && { echo "nada a deployar"; exit 0; }
          for id in $ids; do
            echo "== redeploy stack id=$id"
            out=$(ssh "ubuntu@$VPS_HOST" "curl -sS -m 900 'http://127.0.0.1:8093/api/git/stacks/$id/webhook?secret=$DOCKHAND_WEBHOOK_SECRET'")
            echo "$out" | head -c 600; echo
            echo "$out" | grep -q '"success":true' || { echo "::error::webhook falhou para o stack $id"; exit 1; }
          done

