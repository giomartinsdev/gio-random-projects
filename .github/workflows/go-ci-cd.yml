name: Go deploy

# CI/CD for the Go apps under modules/apps/*/ (has both a Dockerfile
# and a go.mod) — touch only modules/apps/domain-api/** and only the
# domain-api image rebuilds, gets pushed, and redeploys; same for
# domain-worker. TypeScript apps (post-api) go through ts-ci-cd.yml
# instead — see that workflow's own header for why this isn't one
# generic pipeline for every language.
#
# Deploys go through Terraform, not watchtower: after pushing, the
# deploy job runs `terraform apply` against modules/infra/terraform,
# talking to the VPS dockerd over the same SSH connection tf-ci-cd.yml
# uses (no exposed Docker API port at all). domain_api/domain_worker's
# watchtower label defaults to false now:
# watchtower recreating those containers behind Terraform's back (a
# new container ID every redeploy) fought Terraform for ownership of
# the same name on every subsequent apply. See
# modules/compute/app/variables.tf's watchtower_enabled.

on:
  push:
    branches: [main]
    paths:
      - "modules/apps/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all apps under modules/apps/)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        run: |
          all_apps=$(find modules/apps -mindepth 2 -maxdepth 2 -name go.mod \
            -exec dirname {} \; | xargs -n1 basename | sort)

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
              fi
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        with:
          go-version: "1.25"
          cache-dependency-path: modules/apps/${{ matrix.app }}/go.sum

      - name: Test (Go apps only — skipped for anything without a go.mod)
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        working-directory: modules/apps/${{ matrix.app }}
        run: go build ./... && go vet ./...

      # The VPS is arm64 (Oracle's free-tier Ampere instances), but this
      # runner is amd64 -- QEMU is what lets BuildKit actually produce
      # an arm64 image here instead of one that immediately crash-loops
      # on the VPS with "exec format error" (confirmed live: that's
      # exactly what happened to vaultwarden_bridge's amd64 image on
      # first deploy).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # registry.giomartins.dev:5000 is plain HTTP (Phase 1 — see
      # modules/infra/terraform/README.md), which dockerd rejects by
      # default unless explicitly allow-listed as insecure. `docker
      # login` itself is routed through the runner's own dockerd, so it
      # needs this regardless of which buildx driver builds the image.
      - name: Allow the runner's dockerd to talk to the registry over plain HTTP
        run: |
          echo '{"insecure-registries": ["registry.giomartins.dev:5000"]}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker

      # Cross-arch builds need BuildKit's own isolated docker-container
      # driver (the "docker" driver used before this could only ever
      # target the runner's own architecture) -- which runs its own
      # BuildKit daemon, so the insecure-registry trust above has to be
      # repeated here in BuildKit's own config format.
      - uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."registry.giomartins.dev:5000"]
              http = true
              insecure = true

      - name: Log in to registry.giomartins.dev:5000
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: modules/apps/${{ matrix.app }}
          push: true
          platforms: linux/arm64
          tags: |
            registry.giomartins.dev:5000/${{ matrix.app }}:latest
            registry.giomartins.dev:5000/${{ matrix.app }}:${{ github.sha }}

  deploy:
    needs: [discover, build-and-push]
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/infra/terraform
    # Same secrets tf-ci-cd.yml uses — a real `terraform apply` needs
    # the full variable set regardless of what's actually changing, and
    # nothing here is new: see that workflow and
    # modules/infra/terraform/README.md's secrets table.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_google_idp_identity_provider_id: ${{ secrets.CLOUDFLARE_GOOGLE_IDP_ID }}
      TF_VAR_registry_password: ${{ secrets.TF_REGISTRY_PASSWORD }}
      TF_VAR_beszel_agent_key: ${{ secrets.TF_BESZEL_AGENT_KEY }}
      TF_VAR_vaultwarden_account_email: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_EMAIL }}
      TF_VAR_vaultwarden_account_master_password: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
      TF_VAR_vaultwarden_api_client_id: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
      TF_VAR_vaultwarden_api_client_secret: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Same SSH setup tf-ci-cd.yml does — the docker provider talks
      # straight to the VPS dockerd over ssh://.
      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          echo "TF_VAR_docker_host=ssh://ubuntu@$VPS_HOST" >> "$GITHUB_ENV"

      # Same reasoning as tf-ci-cd.yml's own step of the same name.
      - name: Discover the VPS's public IP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          SERVER_IP=$(ssh "ubuntu@$VPS_HOST" 'curl -4 -fsS --max-time 5 https://ifconfig.me || curl -4 -fsS --max-time 5 https://api.ipify.org')
          if [ -z "$SERVER_IP" ]; then
            echo "::error::could not determine the VPS's public IP"
            exit 1
          fi
          echo "TF_VAR_server_ip=$SERVER_IP" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Init
        run: terraform init -backend-config="endpoints={s3=\"${{ secrets.TF_STATE_R2_ENDPOINT }}\"}"

      # -replace below forces Terraform to destroy+recreate the
      # container, but that alone does NOT guarantee a fresh image:
      # dockerd only pulls on create if the tag is missing from its
      # local cache, and the VPS almost always already has SOME
      # image cached under registry.giomartins.dev/<app>:latest from
      # an earlier deploy. Confirmed live: a -replace-only apply
      # silently redeployed a stale, previously-cached build instead
      # of what build-and-push had just pushed. An explicit pull
      # against the remote daemon first is what actually guarantees
      # this -- but that pull still needs registry credentials.
      #
      # Docker resolves those credentials CLIENT-side regardless of
      # DOCKER_HOST: the `docker` CLI here (on the runner) reads its
      # OWN ~/.docker/config.json and sends the result as an
      # X-Registry-Auth header, which the remote daemon then uses to
      # actually fetch from the registry. The VPS's own config.json
      # (docker_config_install) is what lets ITS processes -- like
      # watchtower -- pull; it's irrelevant to a pull commanded from
      # here. A `docker login` on THIS runner is what's actually
      # needed, hence the daemon.json + login below (same as
      # build-and-push's, since `docker login` itself talks to
      # registry.giomartins.dev:5000 directly, not through DOCKER_HOST).
      - name: Allow the runner's dockerd to talk to the registry over plain HTTP
        run: |
          echo '{"insecure-registries": ["registry.giomartins.dev:5000"]}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker

      - name: Log in to registry.giomartins.dev:5000
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Pull the image(s) just pushed onto the VPS's own dockerd
        env:
          DOCKER_HOST: ${{ env.TF_VAR_docker_host }}
        run: |
          for app in $(echo '${{ needs.discover.outputs.apps }}' | jq -r '.[]'); do
            docker pull "registry.giomartins.dev:5000/${app}:latest"
          done

      - name: Deploy the image(s) just pushed
        run: |
          REPLACE_ARGS=()
          for app in $(echo '${{ needs.discover.outputs.apps }}' | jq -r '.[]'); do
            # An app missing from this list deploys as a silent no-op:
            # the image tag in state is always ":latest", so with no
            # -replace Terraform sees no diff and leaves the OLD
            # container running while the job still reports success.
            # Every new Go app needs an entry here. The mapping can't be
            # derived from the name -- domain-worker lives inside
            # domain-api's module -- so it stays explicit.
            case "$app" in
              domain-api) REPLACE_ARGS+=("-replace=module.compute_apps_domain_api.docker_container.domain_api") ;;
              domain-worker) REPLACE_ARGS+=("-replace=module.compute_apps_domain_api.docker_container.domain_worker") ;;
              tela) REPLACE_ARGS+=("-replace=module.compute_apps_tela.docker_container.tela") ;;
              *) echo "::warning::no -replace mapping for '$app'; its container will NOT be recreated" ;;
            esac
          done
          terraform apply -input=false -lock-timeout=300s -auto-approve "${REPLACE_ARGS[@]}"
