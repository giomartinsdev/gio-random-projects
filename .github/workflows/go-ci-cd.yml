name: Go deploy

# CI/CD for the Go apps under modules/apps/*/ (has both a Dockerfile
# and a go.mod) — touch only modules/apps/domain-api/** and only the
# domain-api image rebuilds, gets pushed, and redeploys; same for
# domain-worker. TypeScript apps (post-api) go through ts-ci-cd.yml
# instead — see that workflow's own header for why this isn't one
# generic pipeline for every language.
#
# Deploys go through Terraform, not watchtower: after pushing, the
# deploy job runs `terraform apply` against modules/infra/terraform
# with -var overriding the built app's image tag to this exact commit
# SHA, over the same docker.giomartins.dev Access-gated Docker Engine
# API tf-deploy.yml uses (no inbound access to gio-server needed —
# that connection is outbound-initiated by cloudflared either way).
# domain_api/domain_worker's watchtower label defaults to false now:
# watchtower recreating those containers behind Terraform's back (a
# new container ID every redeploy) fought Terraform for ownership of
# the same name on every subsequent apply. See
# modules/compute/app/variables.tf's watchtower_enabled.

on:
  push:
    branches: [main]
    paths:
      - "modules/apps/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all apps under modules/apps/)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        run: |
          all_apps=$(find modules/apps -mindepth 2 -maxdepth 2 -name go.mod \
            -exec dirname {} \; | xargs -n1 basename | sort)

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
              fi
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        with:
          go-version: "1.25"
          cache-dependency-path: modules/apps/${{ matrix.app }}/go.sum

      - name: Test (Go apps only — skipped for anything without a go.mod)
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        working-directory: modules/apps/${{ matrix.app }}
        run: go build ./... && go vet ./...

      # registry.giomartins.dev requires mTLS now (see
      # modules/infra/terraform/modules/cloudflare/registry_mtls.tf) —
      # htpasswd alone stopped being enough to get past the edge.
      # Docker has no way to attach a client certificate through
      # BuildKit's isolated docker-container driver (the default), so
      # this uses the classic "docker" driver instead: it delegates to
      # the runner's own dockerd, which resolves
      # /etc/docker/certs.d/<host>/{client.cert,client.key}
      # automatically, the same convention gio-server's dockerd uses
      # for watchtower's pulls. Trade-off: the "docker" driver doesn't
      # support the type=gha cache backend below, so pushes here build
      # without cross-run caching — acceptable for images this small.
      - name: Install registry.giomartins.dev's mTLS client certificate
        run: |
          sudo mkdir -p /etc/docker/certs.d/registry.giomartins.dev
          echo "${{ secrets.REGISTRY_CLIENT_CERT }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.cert > /dev/null
          echo "${{ secrets.REGISTRY_CLIENT_KEY }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.key > /dev/null

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to registry.giomartins.dev
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: modules/apps/${{ matrix.app }}
          push: true
          tags: |
            registry.giomartins.dev/${{ matrix.app }}:latest
            registry.giomartins.dev/${{ matrix.app }}:${{ github.sha }}

  deploy:
    needs: [discover, build-and-push]
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/infra/terraform
    # Same secrets tf-deploy.yml uses — a real `terraform apply` needs
    # the full variable set regardless of what's actually changing, and
    # nothing here is new: see that workflow and
    # modules/infra/terraform/README.md's secrets table.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_google_idp_identity_provider_id: ${{ secrets.CLOUDFLARE_GOOGLE_IDP_ID }}
      TF_VAR_registry_password: ${{ secrets.TF_REGISTRY_PASSWORD }}
      TF_VAR_beszel_agent_key: ${{ secrets.TF_BESZEL_AGENT_KEY }}
      TF_VAR_vaultwarden_account_email: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_EMAIL }}
      TF_VAR_vaultwarden_account_master_password: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
      TF_VAR_vaultwarden_api_client_id: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
      TF_VAR_vaultwarden_api_client_secret: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
      TF_VAR_docker_host: "tcp://localhost:2475"
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Cloudflare Access header-injecting proxy for dockerd
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_SECRET }}
        run: |
          cat > /tmp/default.conf.template <<'EOF'
          server {
              listen 2475;
              client_max_body_size 0;
              location / {
                  proxy_pass https://docker.giomartins.dev;
                  proxy_set_header Host docker.giomartins.dev;
                  proxy_set_header CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}";
                  proxy_set_header CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}";
                  proxy_ssl_server_name on;
                  proxy_http_version 1.1;
                  # docker exec/attach hijacks the connection into a raw
                  # TCP stream (an HTTP Upgrade) -- without these, nginx
                  # won't forward the upgrade and `docker exec` fails
                  # with "unable to upgrade to tcp, received 200".
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }
          }
          EOF
          docker run -d --name access-proxy --network host \
            -e CF_ACCESS_CLIENT_ID \
            -e CF_ACCESS_CLIENT_SECRET \
            -v /tmp/default.conf.template:/etc/nginx/templates/default.conf.template:ro \
            nginx:alpine
          sleep 2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Init
        run: terraform init -backend-config="endpoints={s3=\"${{ secrets.TF_STATE_R2_ENDPOINT }}\"}"

      # -replace below forces Terraform to destroy+recreate the
      # container, but that alone does NOT guarantee a fresh image:
      # dockerd only pulls on create if the tag is missing from its
      # local cache, and gio-server almost always already has SOME
      # image cached under registry.giomartins.dev/<app>:latest from
      # an earlier deploy. Confirmed live: a -replace-only apply
      # silently redeployed a stale, previously-cached build instead
      # of what build-and-push had just pushed. An explicit pull
      # against the remote daemon first is what actually guarantees
      # this -- but that pull still needs registry credentials.
      #
      # Docker resolves those credentials CLIENT-side regardless of
      # DOCKER_HOST: the `docker` CLI here (on the runner) reads its
      # OWN ~/.docker/config.json and sends the result as an
      # X-Registry-Auth header, which the remote daemon then uses to
      # actually fetch from the registry. gio-server's own config.json
      # (docker_config_install) is what lets ITS processes -- like
      # watchtower -- pull; it's irrelevant to a pull commanded from
      # here. A `docker login` on THIS runner is what's actually
      # needed, hence the mTLS cert install + login below (same as
      # build-and-push's, since `docker login` itself talks to
      # registry.giomartins.dev directly, not through DOCKER_HOST).
      - name: Install registry.giomartins.dev's mTLS client certificate
        run: |
          sudo mkdir -p /etc/docker/certs.d/registry.giomartins.dev
          echo "${{ secrets.REGISTRY_CLIENT_CERT }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.cert > /dev/null
          echo "${{ secrets.REGISTRY_CLIENT_KEY }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.key > /dev/null

      - name: Log in to registry.giomartins.dev
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Pull the image(s) just pushed onto gio-server's own dockerd
        env:
          DOCKER_HOST: tcp://localhost:2475
        run: |
          for app in $(echo '${{ needs.discover.outputs.apps }}' | jq -r '.[]'); do
            docker pull "registry.giomartins.dev/${app}:latest"
          done

      - name: Deploy the image(s) just pushed
        run: |
          REPLACE_ARGS=()
          for app in $(echo '${{ needs.discover.outputs.apps }}' | jq -r '.[]'); do
            case "$app" in
              domain-api) REPLACE_ARGS+=("-replace=module.compute_apps_domain_api.docker_container.domain_api") ;;
              domain-worker) REPLACE_ARGS+=("-replace=module.compute_apps_domain_api.docker_container.domain_worker") ;;
            esac
          done
          terraform apply -input=false -lock-timeout=300s -auto-approve "${REPLACE_ARGS[@]}"
