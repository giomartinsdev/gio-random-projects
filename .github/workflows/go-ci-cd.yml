name: Go deploy

# CI/CD for the Go apps under modules/apps/*/ (has both a Dockerfile
# and a go.mod) — touch only modules/apps/domain-api/** and only the
# domain-api image rebuilds, gets pushed, and redeploys; same for
# domain-worker. TypeScript apps go through ts-frontend-ci-cd.yml,
# Python ones through python-ci-cd.yml — see either workflow's own
# header for why this isn't one generic pipeline for every language.
#
# ## Build, push e deploy (reescrito em 2026-10-24)
#
# Antes: o build rodava no daemon do **Docker da VPS** (via
# `DOCKER_HOST=ssh://`), com QEMU porque o runner era amd64 e a VPS arm64.
# O deploy era um webhook do Dockhand.
#
# Agora, com o Docker da VPS descomissionado:
#
#   1. `runs-on: ubuntu-24.04-arm` — runner arm64 NATIVO (grátis e ilimitado
#      em repo público). Sem QEMU, sem `DOCKER_HOST`, sem o daemon da VPS.
#   2. push pelo **túnel SSH** (`ssh -L 5000:127.0.0.1:5000`), falando com
#      `localhost:5000`. A credencial nunca cruza a internet em claro — o
#      registry não precisa mais ficar aberto na :5000 (armadilha 31).
#   3. `deploy` grava o digest no manifesto e commita. O ArgoCD aplica.
#
# POR QUE O PASSO 3 EXISTE: todo manifesto fixa digest
# (`image: ...@sha256:...`), e fixar digest é o certo. Mas ninguém escrevia o
# digest novo — o webhook do Dockhand só mexe em Docker. Resultado: o CI
# ficava verde e o pod continuava na imagem velha. Medido antes de corrigir:
# `tela-api` rodava `@sha256:91f313c4...` com `:latest` já em
# `@sha256:52326c1d...`. Ver `.github/scripts/bump-digest.sh`.

# O default do repositório é `read` (verificado: default_workflow_permissions
# = "read"). O job de deploy commita o digest de volta em `main`, então precisa
# de `contents: write` — sem isto o push falha com 403 e a imagem publicada
# nunca chega ao pod.
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "modules/apps/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all apps under modules/apps/)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        run: |
          all_apps=$(find modules/apps -mindepth 2 -maxdepth 2 -name go.mod \
            -exec dirname {} \; | xargs -n1 basename | sort)

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
              fi
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    # Runner arm64 NATIVO. Grátis e ilimitado em repositório público (este é).
    # Substitui `ubuntu-latest` + `setup-qemu-action`: compilar arm64 em amd64
    # via QEMU era ~10x mais lento e existia só porque o build rodava no daemon
    # da VPS.
    runs-on: ubuntu-24.04-arm
    # Um push novo cancela o build do anterior: dois pushes seguidos não devem
    # gastar dois builds completos quando o segundo já os substitui. O grupo
    # inclui o APP (matrix.app) -- sem ele, os jobs da mesma matrix entram no
    # mesmo grupo e cancelam UNS AOS OUTROS ("Canceling since a higher priority
    # waiting request exists"), deixando só um app buildar. O DEPLOY não entra
    # nisto (tem o próprio concurrency, mais abaixo, compartilhado com os outros
    # workflows e com cancel-in-progress: false) -- matar um `terraform apply` no
    # meio é o que deixa container pela metade.
    concurrency:
      group: go-build-${{ matrix.app }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        with:
          go-version: "1.25"
          cache-dependency-path: modules/apps/${{ matrix.app }}/go.sum

      - name: Test (Go apps only — skipped for anything without a go.mod)
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        working-directory: modules/apps/${{ matrix.app }}
        # `-count=1` desliga o cache de RESULTADO de teste. Sem ele, o
        # `actions/setup-go` acima restaura GOCACHE entre runs e um teste de
        # integração pode aparecer "ok (cached)" sem ter rodado -- o
        # testcontainers nunca sobe e o CI dá verde sobre um teste que não
        # executou. O cache de COMPILAÇÃO continua valendo (é o que deixa o
        # passo rápido); o que se força é a execução.
        #
        # `go build ./...` era redundante: `go vet` já compila cada pacote, e o
        # cache de build do Go é compartilhado entre os comandos, então o `go
        # test` seguinte reaproveita o que o vet compilou.
        run: go vet ./... && go test -count=1 ./...

      # Build + push + digest. Toda a mecânica (túnel do registry, credencial
      # vinda do Secret do cluster, BuildKit com netns do host, cache no
      # Actions) vive em `.github/actions/build-push-cluster` — ver o
      # cabeçalho deste arquivo para o porquê de cada peça.
      #
      # O que saiu daqui: `setup-qemu` (runner agora é arm64 nativo), o
      # `daemon.json` com `insecure-registries`, `DOCKER_HOST=ssh://` (o build
      # era no daemon da VPS) e `fetch_vault_secret.sh` (fazia `docker run`).
      - name: Build and push ${{ matrix.app }}
        id: build
        uses: ./.github/actions/build-push-cluster
        with:
          vps-host: ${{ secrets.VPS_HOST }}
          vps-ssh-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          app: ${{ matrix.app }}
          context: modules/apps/${{ matrix.app }}
          dockerfile: modules/apps/${{ matrix.app }}/Dockerfile
          cache-scope: go-${{ matrix.app }}

      # O `digest` que o build-push-action devolve é o do manifesto que
      # ACABOU de subir — não precisa consultar o registry de novo (o que
      # exigiria credencial e túnel no job de deploy).
      - name: Hand the digest to the deploy job
        run: echo "${{ steps.build.outputs.digest }}" > "$RUNNER_TEMP/digest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.app }}
          path: ${{ runner.temp }}/digest.txt
          retention-days: 1

  # Deploy = gravar o digest publicado no manifesto e commitar. O ArgoCD
  # (auto-sync + selfHeal) aplica no cluster.
  #
  # Substituiu o webhook do Dockhand, que fazia `compose up` numa stack onde
  # todos os serviços já estavam `profiles: ["retired"]` — um no-op que ainda
  # provava o sucesso com `docker ps` (que nunca mais encontraria o container).
  # Ver o cabeçalho do arquivo.
  deploy:
    needs: [discover, build-and-push]
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-24.04-arm
    # Serializa com os outros workflows (python/ts/ai/excalidraw): todos
    # escrevem no MESMO repositório. Dois commits simultâneos em `main` dão
    # non-fast-forward. O rebase com retry abaixo cobre, mas evitar a corrida
    # é melhor que remediá-la.
    concurrency:
      group: image-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # O bump commita; o GITHUB_TOKEN padrão precisa de `contents: write`.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests

      - name: Record each digest in git
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `bump-digest.sh` só PREPARA (`git add`); o commit é um só, aqui.
          # Um commit por app daria N pushes concorrentes em `main`.
          for d in "$RUNNER_TEMP"/digests/digest-*/; do
            app=$(basename "$d"); app=${app#digest-}
            digest=$(tr -d '\r\n' < "${d}digest.txt")
            [ -n "$digest" ] || { echo "::error::digest vazio para $app"; exit 1; }
            echo "== $app -> $digest"
            .github/scripts/bump-digest.sh "$app" "$digest"
          done

          if git diff --cached --quiet; then
            echo "nenhum manifesto mudou"
            exit 0
          fi
          git commit -m "deploy: imagens arm64 do CI ($(date -u +%Y-%m-%dT%H:%MZ))"

      - name: Push the digest commits
        run: |
          set -euo pipefail
          if [ -z "$(git log "origin/${GITHUB_REF_NAME}..HEAD" --oneline)" ]; then
            echo "nada a publicar (digests já estavam no git)"; exit 0
          fi
          for i in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "digest publicado"; exit 0
            fi
            echo "  push falhou (tentativa $i); rebase e repete"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 3))
          done
          echo "::error::não consegui publicar o commit dos digests"
          exit 1
