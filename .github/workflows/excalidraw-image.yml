name: Excalidraw image

# Builda e publica a imagem do stack `excalidraw` (stacks/excalidraw.yml) e
# dispara o redeploy.
#
# Por que este workflow existe: o upstream excalidraw/excalidraw não publica
# imagem, e a VPS é arm64 (Oracle Ampere). O runner é amd64 → QEMU monta a
# imagem arm64 (mesmo desenho do maus-image.yml/ai-image.yml). A stack só puxa
# `registry.giomartins.dev:5000/excalidraw:latest`.
#
# Trigger manual de propósito (como maus/ai): até a primeira imagem existir no
# registry interno, um push automático só dispararia um build QEMU longo. Para
# bumps automáticos depois, adicione um arquivo stacks/excalidraw/VERSION e um
# push trigger nesse path.
#
# Depois do primeiro build: no Dockhand, deixe a stack `excalidraw` com
# repull_images + force_redeploy ligados (default), pra o webhook puxar a
# :latest nova.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream Excalidraw tag to build (e.g. v0.18.1)"
        required: true
        default: "v0.18.1"

env:
  EXCALIDRAW_VERSION: ${{ inputs.version || 'v0.18.1' }}

jobs:
  build-and-push:
    # arm64 NATIVO -- sem QEMU, sem daemon da VPS (ver go-ci-cd.yml).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"

      # O Dockerfile do tag pinado builda o SPA (yarn) e copia o build pro
      # nginx, mas fixa node:18 — que não instala mais (uma dep transitiva
      # exige node >= 20). Sobrescrevemos com stacks/excalidraw/Dockerfile
      # (node:22). Clone no tag pinado e builda de lá.
      - name: Fetch upstream at the pinned tag
        run: |
          git clone --depth 1 --branch "$EXCALIDRAW_VERSION" \
            https://github.com/excalidraw/excalidraw.git _excalidraw-upstream
          cp stacks/excalidraw/Dockerfile _excalidraw-upstream/Dockerfile

      # Mesma action dos outros: túnel do registry + credencial do cluster +
      # BuildKit com netns do host + cache no Actions.
      #
      # ATENÇÃO: aqui NÃO há bump de digest. O manifesto do excalidraw usa TAG
      # fixa (`excalidraw:v0.18.1`), não digest — a versão é escolhida por
      # input, então o deploy é "escolher a tag no manifesto e commitar", não
      # "seguir o :latest". Por isso o workflow só publica e não tem job de
      # deploy (ver a nota no fim do arquivo).
      - name: Build and push excalidraw (arm64)
        uses: ./.github/actions/build-push-cluster
        with:
          vps-host: ${{ secrets.VPS_HOST }}
          app: excalidraw
          context: _excalidraw-upstream
          dockerfile: _excalidraw-upstream/Dockerfile
          cache-scope: excalidraw

  # SEM job de deploy: o excalidraw é a exceção do parque. O manifesto fixa
  # TAG (`excalidraw:v0.18.1`), escolhida por input deste workflow — não
  # `:latest`. Publicar a imagem não deve mexer no que está no ar: a troca de
  # versão é uma decisão explícita (editar a tag no manifesto + commit), e é o
  # ArgoCD que aplica.
  #
  # Antes havia um webhook do Dockhand aqui, que recriava um container
  # `profiles: ["retired"]` — no-op desde a migração.
