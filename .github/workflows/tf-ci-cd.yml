name: Terraform deploy

# modules/infra/terraform is the source of truth for everything
# Cloudflare AND for postgres/redis/api/worker container definitions
# in this repo — all driven from that config's locals.tf and
# main.tf. Plans on PRs touching it; applies on push to main. State
# lives in Cloudflare R2 (bucket created once via
# modules/infra/terraform-bootstrap) — see
# modules/infra/terraform/README.md for the one-time setup this still
# depends on (account ID, zone ID, Google identity provider ID, an R2
# API token, a CLOUDFLARE_API_TOKEN scoped for both DNS and Access,
# and VPS_SSH_PRIVATE_KEY for the docker provider's SSH connection to
# the VPS).

on:
  push:
    branches: [main]
    paths:
      - "modules/infra/terraform/**"
  pull_request:
    paths:
      - "modules/infra/terraform/**"
  workflow_dispatch:
    inputs:
      replace_vault_seed_group:
        description: "Optional: secrets.tf vault_item_groups key to force-rerun (e.g. domain_api_keys, after a lost concurrent write -- see incident notes on that local). The quoted null_resource.vault_seed[\"...\"] address is built from this, not typed directly -- GitHub's dispatch-input plumbing strips embedded quotes before Terraform ever sees them."
        required: false
      replace_target:
        description: "Optional: any other full Terraform resource address to force-replace (e.g. module.compute_services_vaultwarden_bridge.docker_container.vaultwarden_bridge, when the bridge's own in-memory secret cache goes stale and env vars alone don't force a recreate). Passed through as-is to -replace=."
        required: false
      state_rm_vault_seed_group:
        description: "Optional, use with care: same secrets.tf vault_item_groups key replace_vault_seed_group takes, but drops null_resource.vault_seed[...] from state entirely (terraform state rm) before planning, instead of -replace-ing it -- for when a stale/duplicate Vaultwarden item keeps getting upserted by name and destroy+recreate of the SAME tracked resource isn't enough. Just the bare key, e.g. domain_api_keys -- no quotes/brackets (same reason replace_vault_seed_group's own description gives)."
        required: false

defaults:
  run:
    working-directory: modules/infra/terraform

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_google_idp_identity_provider_id: ${{ secrets.CLOUDFLARE_GOOGLE_IDP_ID }}
  TF_VAR_registry_password: ${{ secrets.TF_REGISTRY_PASSWORD }}
  TF_VAR_beszel_agent_key: ${{ secrets.TF_BESZEL_AGENT_KEY }}
  TF_VAR_vaultwarden_account_email: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_EMAIL }}
  TF_VAR_vaultwarden_account_master_password: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
  TF_VAR_vaultwarden_api_client_id: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
  TF_VAR_vaultwarden_api_client_secret: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
  TF_VAR_discord_client_id: ${{ secrets.DISCORD_CLIENT_ID }}
  TF_VAR_discord_client_secret: ${{ secrets.DISCORD_CLIENT_SECRET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The docker provider talks straight to the VPS dockerd over SSH
      # (var.docker_host's default, ssh://ubuntu@<server-ip>) — moby's
      # ssh connhelper shells out to the system `ssh`, so this step
      # just installs the deploy key and pins the host key. No exposed
      # Docker TCP port, no Access service token, no proxy sidecar
      # anywhere in the path.
      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Init
        run: terraform init -backend-config="endpoints={s3=\"${{ secrets.TF_STATE_R2_ENDPOINT }}\"}"

      - name: Validate
        run: terraform validate

      - name: State rm (optional)
        if: github.event.inputs.state_rm_vault_seed_group != ''
        env:
          STATE_RM_GROUP: ${{ github.event.inputs.state_rm_vault_seed_group }}
        run: terraform state rm "null_resource.vault_seed[\"${STATE_RM_GROUP}\"]"

      - name: Plan
        env:
          REPLACE_GROUP: ${{ github.event.inputs.replace_vault_seed_group }}
          REPLACE_TARGET: ${{ github.event.inputs.replace_target }}
        run: |
          REPLACE_ARGS=()
          if [ -n "$REPLACE_GROUP" ]; then
            REPLACE_ADDR="null_resource.vault_seed[\"${REPLACE_GROUP}\"]"
            REPLACE_ARGS+=("-replace=${REPLACE_ADDR}")
          fi
          if [ -n "$REPLACE_TARGET" ]; then
            REPLACE_ARGS+=("-replace=${REPLACE_TARGET}")
          fi
          terraform plan -input=false -lock-timeout=300s -out=tfplan "${REPLACE_ARGS[@]}"

      - name: Apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: terraform apply -input=false -lock-timeout=300s -auto-approve tfplan

      # Backs up the "secret zero" credentials Terraform itself needs
      # to authenticate -- by definition it can't fetch these FROM the
      # vault to configure itself, so this is a plain backup copy, not
      # part of any runtime read path. Excludes the vault's own unlock
      # credentials (TF_VAULTWARDEN_*) -- storing the vault's key
      # inside the vault it unlocks is circular -- and
      # TF_REGISTRY_PASSWORD, already covered by secrets.tf's
      # vault_seed as REGISTRY_PASSWORD. These basically never change,
      # so this only runs when manually dispatched (Actions tab → Run
      # workflow) -- not worth ~1-2min of every single apply just to
      # re-upsert values that are already correct.
      - name: Back up bootstrap secrets to Vaultwarden
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCKER_HOST: ssh://ubuntu@168.138.135.6
          NETWORK_NAME: apps
          VAULTWARDEN_CLIENT_ID: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
          VAULTWARDEN_CLIENT_SECRET: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
          VAULTWARDEN_MASTER_PASSWORD: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_GOOGLE_IDP_ID: ${{ secrets.CLOUDFLARE_GOOGLE_IDP_ID }}
          TF_STATE_R2_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          TF_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          TF_STATE_R2_ENDPOINT: ${{ secrets.TF_STATE_R2_ENDPOINT }}
          TF_BESZEL_AGENT_KEY: ${{ secrets.TF_BESZEL_AGENT_KEY }}
        run: |
          # seed_vault.sh expects each VALUE already base64-encoded
          # (so a multi-line value like a PEM cert survives the
          # newline-per-pair framing) -- b64 here, not just the outer
          # blob at the end.
          b64() { printf '%s' "$1" | base64 -w0; }
          ITEMS_B64=$(printf '%s\t%s\n' \
            "CLOUDFLARE_ACCESS_API_TOKEN" "$(b64 "$CLOUDFLARE_ACCESS_API_TOKEN")" \
            "CLOUDFLARE_ACCOUNT_ID" "$(b64 "$CLOUDFLARE_ACCOUNT_ID")" \
            "CLOUDFLARE_ZONE_ID" "$(b64 "$CLOUDFLARE_ZONE_ID")" \
            "CLOUDFLARE_GOOGLE_IDP_ID" "$(b64 "$CLOUDFLARE_GOOGLE_IDP_ID")" \
            "TF_STATE_R2_ACCESS_KEY_ID" "$(b64 "$TF_STATE_R2_ACCESS_KEY_ID")" \
            "TF_STATE_R2_SECRET_ACCESS_KEY" "$(b64 "$TF_STATE_R2_SECRET_ACCESS_KEY")" \
            "TF_STATE_R2_ENDPOINT" "$(b64 "$TF_STATE_R2_ENDPOINT")" \
            "TF_BESZEL_AGENT_KEY" "$(b64 "$TF_BESZEL_AGENT_KEY")" \
            | base64 -w0)
          export ITEMS_B64
          ./scripts/seed_vault.sh
