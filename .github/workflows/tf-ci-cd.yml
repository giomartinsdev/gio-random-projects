name: Terraform deploy

# modules/infra/terraform is the source of truth for everything
# Cloudflare AND for postgres/redis/api/worker container definitions
# in this repo — all driven from that config's locals.tf and
# main.tf. Plans on PRs touching it; applies on push to main. State
# lives in Cloudflare R2 (bucket created once via
# modules/infra/terraform-bootstrap) — see
# modules/infra/terraform/README.md for the one-time setup this still
# depends on (account ID, zone ID, Google identity provider ID, an R2
# API token, a CLOUDFLARE_API_TOKEN scoped for both DNS and Access,
# and VPS_SSH_PRIVATE_KEY for the docker provider's SSH connection to
# the VPS).
#
# Two jobs, not one: `plan` always runs (PRs included) and uploads the
# binary plan as an artifact; `apply` downloads that same plan and
# applies it verbatim, gated behind the `production` GitHub
# Environment. Add a required reviewer to that environment (repo
# Settings → Environments → production → Required reviewers) to make
# every apply wait for a manual approval -- with none configured,
# `environment:` here is a no-op and apply runs straight through, same
# as before this split.

on:
  push:
    branches: [main]
    paths:
      - "modules/infra/terraform/**"
  pull_request:
    paths:
      - "modules/infra/terraform/**"
  workflow_dispatch:
    inputs:
      replace_vault_seed_group:
        description: "Optional: secrets.tf vault_item_groups key to force-rerun (e.g. domain_api_keys, after a lost concurrent write -- see incident notes on that local). The quoted null_resource.vault_seed[\"...\"] address is built from this, not typed directly -- GitHub's dispatch-input plumbing strips embedded quotes before Terraform ever sees them."
        required: false
      replace_target:
        description: "Optional: any other full Terraform resource address to force-replace (e.g. module.compute_services_vaultwarden_bridge.docker_container.vaultwarden_bridge, when the bridge's own in-memory secret cache goes stale and env vars alone don't force a recreate). Passed through as-is to -replace=."
        required: false
      state_rm_vault_seed_group:
        description: "Optional, use with care: same secrets.tf vault_item_groups key replace_vault_seed_group takes, but drops null_resource.vault_seed[...] from state entirely (terraform state rm) before planning, instead of -replace-ing it -- for when a stale/duplicate Vaultwarden item keeps getting upserted by name and destroy+recreate of the SAME tracked resource isn't enough. Just the bare key, e.g. domain_api_keys -- no quotes/brackets (same reason replace_vault_seed_group's own description gives)."
        required: false
      force_unlock_id:
        description: "Optional: state lock ID to force-unlock before planning -- for when a run gets cancelled (gh run cancel) mid-apply and never releases its own lock, leaving every later run blocked on 'Error acquiring the state lock'. Copy the ID from that error's own output."
        required: false

defaults:
  run:
    working-directory: modules/infra/terraform

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_google_idp_identity_provider_id: ${{ secrets.CLOUDFLARE_GOOGLE_IDP_ID }}
  TF_VAR_beszel_agent_key: ${{ secrets.TF_BESZEL_AGENT_KEY }}
  TF_VAR_vaultwarden_account_email: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_EMAIL }}
  TF_VAR_vaultwarden_account_master_password: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
  TF_VAR_vaultwarden_api_client_id: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
  TF_VAR_vaultwarden_api_client_secret: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
  # TF_VAR_registry_password/TF_VAR_discord_client_id/TF_VAR_discord_client_secret
  # are NOT here -- they're fetched from Vaultwarden below instead of
  # kept as their own GitHub secret. See "Fetch secrets from
  # Vaultwarden"'s own comment for why.

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The docker provider talks straight to the VPS dockerd over SSH
      # (var.docker_host's default, ssh://ubuntu@<server-ip>) — moby's
      # ssh connhelper shells out to the system `ssh`, so this step
      # just installs the deploy key and pins the host key. No exposed
      # Docker TCP port, no Access service token, no proxy sidecar
      # anywhere in the path.
      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          echo "TF_VAR_docker_host=ssh://ubuntu@$VPS_HOST" >> "$GITHUB_ENV"

      # var.server_ip drives every DNS A record (dns.tf) and tela's SFU
      # advertisement -- asking the VPS itself for its own public IP
      # means giomartins.dev's records stay correct even if the VPS's
      # address ever changes, with nothing to update by hand.
      - name: Discover the VPS's public IP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          SERVER_IP=$(ssh "ubuntu@$VPS_HOST" 'curl -4 -fsS --max-time 5 https://ifconfig.me || curl -4 -fsS --max-time 5 https://api.ipify.org')
          if [ -z "$SERVER_IP" ]; then
            echo "::error::could not determine the VPS's public IP"
            exit 1
          fi
          echo "Discovered server_ip=$SERVER_IP"
          echo "TF_VAR_server_ip=$SERVER_IP" >> "$GITHUB_ENV"

      # registry_password and discord_client_id/secret aren't secret
      # zero (nothing about bootstrapping Terraform itself needs
      # them) -- they're regular resource inputs Terraform already
      # keeps mirrored in Vaultwarden (secrets.tf's "registry" and
      # "discord" vault_seed groups), so CI reads them from there
      # instead of also holding its own GitHub-secret copy.
      # The deals SOURCE_BASE_URLs and Discord webhook are here too:
      # without TF_VAR_s at apply time, a tf-only apply would rewrite
      # them to blank DEFAULTS -- SOURCE_BASE_URL blank leaves the
      # scrapers crash-looping on purpose (a silent no-op poller would
      # be worse). PLD/PHB_SOURCE_URL are therefore REQUIRED (no "?"),
      # while the webhook is optional (blank = announcer stays silent
      # but still drains the queue).
      - name: Fetch secrets from Vaultwarden
        env:
          DOCKER_HOST: ${{ env.TF_VAR_docker_host }}
          NETWORK_NAME: apps
          VAULTWARDEN_CLIENT_ID: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
          VAULTWARDEN_CLIENT_SECRET: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
          VAULTWARDEN_MASTER_PASSWORD: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
          ITEM_MAP: "TF_VAR_registry_password=REGISTRY_PASSWORD TF_VAR_discord_client_id=DISCORD_CLIENT_ID TF_VAR_discord_client_secret=DISCORD_CLIENT_SECRET TF_VAR_discord_announce_webhook_url=DISCORD_ANNOUNCE_WEBHOOK_URL? TF_VAR_pld_source_url=PLD_SOURCE_URL TF_VAR_phb_source_url=PHB_SOURCE_URL TF_VAR_deals_discord_webhook_url=DEALS_DISCORD_WEBHOOK_URL?"
        run: |
          set -o pipefail
          ./scripts/fetch_vault_secret.sh | while IFS='=' read -r k v; do
            echo "::add-mask::$v"
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Init
        run: terraform init -backend-config="endpoints={s3=\"${{ secrets.TF_STATE_R2_ENDPOINT }}\"}"

      - name: Validate
        run: terraform validate

      - name: Force unlock (optional)
        if: github.event.inputs.force_unlock_id != ''
        env:
          LOCK_ID: ${{ github.event.inputs.force_unlock_id }}
        run: terraform force-unlock -force "$LOCK_ID"

      - name: State rm (optional)
        if: github.event.inputs.state_rm_vault_seed_group != ''
        env:
          STATE_RM_GROUP: ${{ github.event.inputs.state_rm_vault_seed_group }}
        run: terraform state rm "null_resource.vault_seed[\"${STATE_RM_GROUP}\"]"

      - name: Plan
        env:
          REPLACE_GROUP: ${{ github.event.inputs.replace_vault_seed_group }}
          REPLACE_TARGET: ${{ github.event.inputs.replace_target }}
        run: |
          REPLACE_ARGS=()
          if [ -n "$REPLACE_GROUP" ]; then
            REPLACE_ADDR="null_resource.vault_seed[\"${REPLACE_GROUP}\"]"
            REPLACE_ARGS+=("-replace=${REPLACE_ADDR}")
          fi
          if [ -n "$REPLACE_TARGET" ]; then
            REPLACE_ARGS+=("-replace=${REPLACE_TARGET}")
          fi
          terraform plan -input=false -lock-timeout=300s -out=tfplan "${REPLACE_ARGS[@]}"

      # Binary plan file, not the human-readable summary -- carries
      # fully-resolved attribute values (including ones the CLI's own
      # text output redacts as "(sensitive value)"), since `apply`
      # needs those to actually run. Short retention: this only needs
      # to survive long enough for the apply job below to pick it up.
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: modules/infra/terraform/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    # Deliberately NOT in the shared "terraform-apply" concurrency
    # group the three app-deploy workflows use: this job pauses on a
    # human approval (environment: production above), and a GitHub
    # Actions concurrency group only holds one *running* job plus one
    # *queued* one -- a run sitting in "waiting for approval" occupies
    # that queued slot for as long as the approval takes, which can be
    # hours. Sharing the group would mean every automatic app deploy
    # backs up behind whoever hasn't clicked approve yet, which is
    # worse than the lock-contention problem the group exists to fix.
    # Terraform's own state lock (use_lockfile, versions.tf) still
    # protects a genuine collision here; it's just not FIFO-queued
    # against the app pipelines the way those three are against each
    # other.
    steps:
      - uses: actions/checkout@v4

      # Only for DOCKER_HOST -- applying a saved plan doesn't
      # re-evaluate any variable (server_ip, registry_password, ...),
      # just the providers' own connections, which the docker provider
      # still needs a live SSH session for.
      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          echo "TF_VAR_docker_host=ssh://ubuntu@$VPS_HOST" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Init
        run: terraform init -backend-config="endpoints={s3=\"${{ secrets.TF_STATE_R2_ENDPOINT }}\"}"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: modules/infra/terraform

      - name: Apply
        run: terraform apply -input=false -lock-timeout=300s -auto-approve tfplan
