name: Terraform deploy

# modules/infra/terraform is the source of truth for everything
# Cloudflare AND for postgres/redis/api/worker container definitions
# in this repo — all driven from that config's locals.tf and
# compute.tf. Plans on PRs touching it; applies on push to main. State
# lives in Cloudflare R2 (bucket created once via
# modules/infra/terraform-bootstrap) — see
# modules/infra/terraform/README.md for the one-time setup this still
# depends on (account ID, zone ID, Google identity provider ID, an R2
# API token, a CLOUDFLARE_API_TOKEN scoped for both DNS and Access, and
# the docker.giomartins.dev Access service token compute.tf's provider
# "docker" connects through).

on:
  push:
    branches: [main]
    paths:
      - "modules/infra/terraform/**"
  pull_request:
    paths:
      - "modules/infra/terraform/**"
  workflow_dispatch:
    inputs:
      replace_vault_seed_group:
        description: "Optional: secrets.tf vault_item_groups key to force-rerun (e.g. domain_api_keys, after a lost concurrent write -- see incident notes on that local). The quoted null_resource.vault_seed[\"...\"] address is built from this, not typed directly -- GitHub's dispatch-input plumbing strips embedded quotes before Terraform ever sees them."
        required: false

defaults:
  run:
    working-directory: modules/infra/terraform

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_google_idp_identity_provider_id: ${{ secrets.CLOUDFLARE_GOOGLE_IDP_ID }}
  TF_VAR_registry_password: ${{ secrets.TF_REGISTRY_PASSWORD }}
  TF_VAR_beszel_agent_key: ${{ secrets.TF_BESZEL_AGENT_KEY }}
  TF_VAR_vaultwarden_account_email: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_EMAIL }}
  TF_VAR_vaultwarden_account_master_password: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
  TF_VAR_vaultwarden_api_client_id: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
  TF_VAR_vaultwarden_api_client_secret: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
  TF_VAR_docker_host: "tcp://localhost:2475"
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The docker provider (compute.tf) can't attach the
      # CF-Access-Client-Id/Secret headers docker.giomartins.dev's
      # Access service-token policy requires — same limitation the
      # registry push workaround this repo used to have ran into. This
      # sidecar terminates plain HTTP on localhost, injects those two
      # headers on every request, forwards to the real (HTTPS,
      # Access-protected) daemon. Terraform only ever talks to
      # localhost:2475.
      - name: Start Cloudflare Access header-injecting proxy for dockerd
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_SECRET }}
        run: |
          cat > /tmp/default.conf.template <<'EOF'
          server {
              listen 2475;
              client_max_body_size 0;
              location / {
                  proxy_pass https://docker.giomartins.dev;
                  proxy_set_header Host docker.giomartins.dev;
                  proxy_set_header CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}";
                  proxy_set_header CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}";
                  proxy_ssl_server_name on;
                  proxy_http_version 1.1;
                  # docker exec/attach hijacks the connection into a raw
                  # TCP stream (an HTTP Upgrade) -- without these, nginx
                  # won't forward the upgrade and `docker exec` fails
                  # with "unable to upgrade to tcp, received 200".
                  # Plain docker_container CRUD never needed this.
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  # nginx's 60s default read timeout kills long-polling
                  # calls like `docker wait` before a slow container
                  # (e.g. one doing npm install) finishes, with a 504.
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }
          }
          EOF
          docker run -d --name access-proxy --network host \
            -e CF_ACCESS_CLIENT_ID \
            -e CF_ACCESS_CLIENT_SECRET \
            -v /tmp/default.conf.template:/etc/nginx/templates/default.conf.template:ro \
            nginx:alpine
          sleep 2
          docker logs access-proxy

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Init
        run: terraform init -backend-config="endpoints={s3=\"${{ secrets.TF_STATE_R2_ENDPOINT }}\"}"

      - name: Validate
        run: terraform validate

      # TEMPORARY incident-recovery scoping: the previous apply destroyed
      # the tunnel's ingress config and rotated the "docker" Access
      # service token without completing, leaving public routing down
      # and the Docker provider unauthenticated. -refresh=false skips
      # refreshing docker_* resources (which would fail with the stale
      # token before we can fix it) and -target limits this run to just
      # the two Cloudflare-only resources needed to restore routing.
      # Revert this block once the outage is confirmed fixed.
      - name: Plan
        env:
          REPLACE_GROUP: ${{ github.event.inputs.replace_vault_seed_group }}
        run: |
          REPLACE_ARGS=()
          if [ -n "$REPLACE_GROUP" ]; then
            REPLACE_ADDR="null_resource.vault_seed[\"${REPLACE_GROUP}\"]"
            REPLACE_ARGS+=("-replace=${REPLACE_ADDR}")
          fi
          terraform plan -input=false -lock-timeout=300s -refresh=false \
            -target=module.cloud_cloudflare.cloudflare_zero_trust_tunnel_cloudflared.homelab \
            -target=module.cloud_cloudflare.cloudflare_zero_trust_tunnel_cloudflared_config.homelab \
            -target='module.compute_app.docker_container.domain_api' \
            -target='module.compute_app.docker_container.domain_worker' \
            -target='module.compute_apps_bookclub_api.docker_container.bookclub_api_migrate' \
            -target='module.compute_apps_domain_api.docker_container.domain_api' \
            -target='module.compute_apps_domain_api.docker_container.domain_worker' \
            -target='module.compute_apps_post_api.docker_container.post_api_migrate' \
            -target='module.compute_bookclub_api.docker_container.bookclub_api_migrate' \
            -target='module.compute_data.docker_container.postgres' \
            -target='module.compute_data.docker_container.redis' \
            -target='module.compute_data.docker_network.apps' \
            -target='module.compute_data.docker_volume.postgres_data' \
            -target='module.compute_post_api.docker_container.post_api_migrate' \
            -target='module.compute_services_vaultwarden.docker_container.vaultwarden' \
            -target='module.compute_services_vaultwarden.docker_volume.vaultwarden_data' \
            -target='module.compute_services_vaultwarden_bridge[0].docker_container.vaultwarden_bridge' \
            -target='module.compute_vaultwarden.docker_container.vaultwarden' \
            -target='module.compute_vaultwarden.docker_volume.vaultwarden_data' \
            -target='module.compute_vaultwarden_bridge[0].docker_container.vaultwarden_bridge' \
            -target='module.network_docker_apps.docker_network.apps' \
            -target='module.storage_postgres.docker_container.postgres' \
            -target='module.storage_postgres.docker_volume.postgres_data' \
            -target='module.storage_redis.docker_container.redis' \
            -out=tfplan "${REPLACE_ARGS[@]}"

      - name: Apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: terraform apply -input=false -lock-timeout=300s -auto-approve tfplan

      # Deliberately unmasked: this run is deleted immediately after
      # gh secret set picks these up (see the git history for this
      # commit -- reverted right after use).
      - name: Show new docker service token (incident recovery only)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          echo "docker_client_id=$(terraform output -json service_token_client_ids | jq -r .docker)"
          echo "docker_client_secret=$(terraform output -json service_token_client_secrets | jq -r .docker)"

      # Backs up the "secret zero" credentials Terraform itself needs
      # to authenticate -- by definition it can't fetch these FROM the
      # vault to configure itself, so this is a plain backup copy, not
      # part of any runtime read path. Excludes the vault's own unlock
      # credentials (TF_VAULTWARDEN_*) -- storing the vault's key
      # inside the vault it unlocks is circular -- and
      # TF_REGISTRY_PASSWORD, already covered by secrets.tf's
      # vault_seed as REGISTRY_PASSWORD. These basically never change,
      # so this only runs when manually dispatched (Actions tab → Run
      # workflow) -- not worth ~1-2min of every single apply just to
      # re-upsert values that are already correct.
      - name: Back up bootstrap secrets to Vaultwarden
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCKER_HOST: tcp://localhost:2475
          NETWORK_NAME: apps
          VAULTWARDEN_CLIENT_ID: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
          VAULTWARDEN_CLIENT_SECRET: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
          VAULTWARDEN_MASTER_PASSWORD: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_GOOGLE_IDP_ID: ${{ secrets.CLOUDFLARE_GOOGLE_IDP_ID }}
          CLOUDFLARE_DOCKER_CLIENT_ID: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_ID }}
          CLOUDFLARE_DOCKER_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_SECRET }}
          TF_STATE_R2_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          TF_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          TF_STATE_R2_ENDPOINT: ${{ secrets.TF_STATE_R2_ENDPOINT }}
          TF_BESZEL_AGENT_KEY: ${{ secrets.TF_BESZEL_AGENT_KEY }}
        run: |
          # seed_vault.sh expects each VALUE already base64-encoded
          # (so a multi-line value like a PEM cert survives the
          # newline-per-pair framing) -- b64 here, not just the outer
          # blob at the end.
          b64() { printf '%s' "$1" | base64 -w0; }
          ITEMS_B64=$(printf '%s\t%s\n' \
            "CLOUDFLARE_ACCESS_API_TOKEN" "$(b64 "$CLOUDFLARE_ACCESS_API_TOKEN")" \
            "CLOUDFLARE_ACCOUNT_ID" "$(b64 "$CLOUDFLARE_ACCOUNT_ID")" \
            "CLOUDFLARE_ZONE_ID" "$(b64 "$CLOUDFLARE_ZONE_ID")" \
            "CLOUDFLARE_GOOGLE_IDP_ID" "$(b64 "$CLOUDFLARE_GOOGLE_IDP_ID")" \
            "CLOUDFLARE_DOCKER_CLIENT_ID" "$(b64 "$CLOUDFLARE_DOCKER_CLIENT_ID")" \
            "CLOUDFLARE_DOCKER_CLIENT_SECRET" "$(b64 "$CLOUDFLARE_DOCKER_CLIENT_SECRET")" \
            "TF_STATE_R2_ACCESS_KEY_ID" "$(b64 "$TF_STATE_R2_ACCESS_KEY_ID")" \
            "TF_STATE_R2_SECRET_ACCESS_KEY" "$(b64 "$TF_STATE_R2_SECRET_ACCESS_KEY")" \
            "TF_STATE_R2_ENDPOINT" "$(b64 "$TF_STATE_R2_ENDPOINT")" \
            "TF_BESZEL_AGENT_KEY" "$(b64 "$TF_BESZEL_AGENT_KEY")" \
            | base64 -w0)
          export ITEMS_B64
          ./scripts/seed_vault.sh
