name: Flows CI

on:
  push:
    branches: [main]
    paths:
      - "flows/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "prefect.yaml"
      - ".github/workflows/flows-ci.yml"
  pull_request:
    paths:
      - "flows/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "prefect.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check flows
      - run: ruff format --check flows

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: pyright flows

  test:
    # Every scenario here is a .feature (Gherkin/GWT) integration test
    # backed by real testcontainers where a flow has real infrastructure
    # to test against (see api/domain's and api/gateway's own CI job for
    # the heavier testcontainers use — Postgres, MinIO, a real upstream
    # server); ubuntu-latest ships Docker already running, no extra setup
    # needed. --cov-fail-under=90 is set in the root pyproject.toml, so
    # this step fails the job on its own if coverage drops below 90%.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: Integration tests (pytest-bdd, 90% coverage gate)
        run: pytest flows -v

  deploy:
    # Only on an actual push to main, never for a pull_request build —
    # and only once lint/typecheck/test all pass, so a broken flow never
    # gets deployed even if this push also touched prefect.yaml.
    if: github.event_name == 'push'
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install "prefect>=3,<4"

      - name: Deploy flows
        env:
          PREFECT_API_URL: https://prefect.giomartins.dev/api
          # Prefect is behind Cloudflare Access — CI authenticates as a
          # service via these headers. Create the Service Token under
          # Zero Trust → Access → Service Auth → Service Tokens, then set
          # both secrets in this repo's Settings → Secrets → Actions.
          PREFECT_CLIENT_CUSTOM_HEADERS: >-
            {"CF-Access-Client-Id": "${{ secrets.CF_ACCESS_CLIENT_ID }}",
            "CF-Access-Client-Secret": "${{ secrets.CF_ACCESS_CLIENT_SECRET }}"}
        run: prefect deploy --all

      - name: Prune deployments removed from prefect.yaml
        # `prefect deploy --all` above only creates/updates deployments —
        # it never deletes one whose flow (or prefect.yaml entry) was
        # removed from the repo. See prune_prefect_deployments.py's own
        # docstring for why that matters.
        env:
          PREFECT_API_URL: https://prefect.giomartins.dev/api
          PREFECT_CLIENT_CUSTOM_HEADERS: >-
            {"CF-Access-Client-Id": "${{ secrets.CF_ACCESS_CLIENT_ID }}",
            "CF-Access-Client-Secret": "${{ secrets.CF_ACCESS_CLIENT_SECRET }}"}
        run: python .github/scripts/prune_prefect_deployments.py prefect.yaml
