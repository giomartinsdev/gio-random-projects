name: Flows CI

on:
  push:
    branches: [main]
    paths:
      - "flows/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
  pull_request:
    paths:
      - "flows/**"
      - "pyproject.toml"
      - "requirements-dev.txt"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: mypy flows

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest flows -v
