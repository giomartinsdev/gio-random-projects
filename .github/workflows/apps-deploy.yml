name: Deploy apps

# Generic CI/CD for anything under modules/apps/*/ that has a
# Dockerfile — touch only modules/apps/domain-api/** and only the
# domain-api image rebuilds, gets pushed, and redeploys; same for
# domain-worker or (once it exists) front. Nothing here names a
# specific app.
#
# CD is pull-based, not push-based: this workflow's job ends at
# pushing registry.giomartins.dev/<app>:latest — gio-server has no
# inbound access GitHub-hosted runners could SSH into. Watchtower on
# the server (modules/infra/watchtower) polls the registry and
# redeploys any container labeled for it as soon as a new :latest
# lands. See modules/infra/README.md.

on:
  push:
    branches: [main]
    paths:
      - "modules/apps/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all apps under modules/apps/)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        run: |
          all_apps=$(find modules/apps -mindepth 2 -maxdepth 2 -name Dockerfile \
            -exec dirname {} \; | xargs -n1 basename | sort)

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
              fi
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        with:
          go-version: "1.25"
          cache-dependency-path: modules/apps/${{ matrix.app }}/go.sum

      - name: Test (Go apps only — skipped for anything without a go.mod)
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        working-directory: modules/apps/${{ matrix.app }}
        run: go build ./... && go vet ./...

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry.giomartins.dev
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: modules/apps/${{ matrix.app }}
          push: true
          tags: |
            registry.giomartins.dev/${{ matrix.app }}:latest
            registry.giomartins.dev/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
