name: Deploy apps

# Generic CI/CD for anything under modules/apps/*/ that has a
# Dockerfile — touch only modules/apps/domain-api/** and only the
# domain-api image rebuilds, gets pushed, and redeploys; same for
# domain-worker or (once it exists) front. Nothing here names a
# specific app.
#
# CD is pull-based, not push-based: this workflow's job ends at
# pushing registry.giomartins.dev/<app>:latest — gio-server has no
# inbound access GitHub-hosted runners could SSH into. Watchtower on
# the server (modules/infra/watchtower) polls the registry and
# redeploys any container labeled for it as soon as a new :latest
# lands. See modules/infra/README.md.

on:
  push:
    branches: [main]
    paths:
      - "modules/apps/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all apps under modules/apps/)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        run: |
          all_apps=$(find modules/apps -mindepth 2 -maxdepth 2 -name Dockerfile \
            -exec dirname {} \; | xargs -n1 basename | sort)

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
              fi
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        with:
          go-version: "1.25"
          cache-dependency-path: modules/apps/${{ matrix.app }}/go.sum

      - name: Test (Go apps only — skipped for anything without a go.mod)
        if: hashFiles(format('modules/apps/{0}/go.mod', matrix.app)) != ''
        working-directory: modules/apps/${{ matrix.app }}
        run: go build ./... && go vet ./...

      # registry.giomartins.dev requires mTLS now (see
      # modules/infra/terraform/modules/cloudflare/registry_mtls.tf) —
      # htpasswd alone stopped being enough to get past the edge.
      # Docker has no way to attach a client certificate through
      # BuildKit's isolated docker-container driver (the default), so
      # this uses the classic "docker" driver instead: it delegates to
      # the runner's own dockerd, which resolves
      # /etc/docker/certs.d/<host>/{client.cert,client.key}
      # automatically, the same convention gio-server's dockerd uses
      # for watchtower's pulls. Trade-off: the "docker" driver doesn't
      # support the type=gha cache backend below, so pushes here build
      # without cross-run caching — acceptable for images this small.
      - name: Install registry.giomartins.dev's mTLS client certificate
        run: |
          sudo mkdir -p /etc/docker/certs.d/registry.giomartins.dev
          echo "${{ secrets.REGISTRY_CLIENT_CERT }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.cert > /dev/null
          echo "${{ secrets.REGISTRY_CLIENT_KEY }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.key > /dev/null

      # Pushes go dockerd -> Cloudflare edge -> tunnel ->
      # registry.giomartins.dev, and the tunnel's disable_chunked_encoding
      # (modules/infra/terraform/modules/cloudflare/tunnel.tf) buffers
      # each request body to compute a real Content-Length for the
      # origin. Confirmed live: a single sequential blob upload (curl,
      # matching buildkit's own chunked-PATCH pattern exactly) always
      # succeeds; letting build-push-action push directly always failed
      # right as several of its concurrent layer uploads finished
      # around the same moment (digest mismatch, or a 502) — consistent
      # with that buffering not being isolated per-stream under
      # concurrent load. Capping dockerd to one upload at a time avoids
      # triggering it, but only actually applies to a real `docker
      # push` -- buildx's own registry exporter (even on the "docker"
      # driver) doesn't route through it, hence building with --load
      # (local only) and pushing separately below instead of doing it
      # all in one build-push-action step.
      - name: Limit dockerd to one concurrent upload (works around a tunnel bug under concurrent pushes)
        run: |
          echo '{"max-concurrent-uploads": 1}' | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
          sleep 2
          docker info --format '{{.ID}}' > /dev/null

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to registry.giomartins.dev
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: modules/apps/${{ matrix.app }}
          load: true
          tags: |
            registry.giomartins.dev/${{ matrix.app }}:latest
            registry.giomartins.dev/${{ matrix.app }}:${{ github.sha }}

      - name: Push ${{ matrix.app }} (classic docker push, honors max-concurrent-uploads)
        run: |
          docker push registry.giomartins.dev/${{ matrix.app }}:latest
          docker push registry.giomartins.dev/${{ matrix.app }}:${{ github.sha }}
