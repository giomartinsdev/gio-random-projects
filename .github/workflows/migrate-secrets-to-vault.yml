name: One-time migrate GH secrets into Vaultwarden

# Every value below is referenced via ${{ secrets.X }}, which means
# GitHub Actions' automatic log masking covers it regardless of how it
# flows through this job -- unlike a value fetched at runtime from an
# HTTP response (which GH has no way to know is sensitive), anything
# sourced from `secrets.*` gets redacted from logs automatically if it
# ever surfaces in output. `bw create item`'s own stdout (which echoes
# the created item back, including its password field) is still
# explicitly redirected to /dev/null below regardless, as defense in
# depth.
#
# Vaultwarden's own unlock credentials (TF_VAULTWARDEN_ACCOUNT_EMAIL/
# PASSWORD/API_CLIENT_ID/SECRET) are deliberately NOT migrated --
# storing the vault's own key inside the vault it unlocks is circular
# and useless, not an oversight.
#
# Remove this workflow once it's been run successfully once.

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install Bitwarden CLI
        run: npm install -g @bitwarden/cli

      # vault.giomartins.dev sits behind Cloudflare Access, which intercepts
      # every request (including the bw CLI's API/identity calls) and
      # redirects to the CF Access login page. bw CLI has no way to attach
      # the CF-Access-Client-Id/Secret headers needed to bypass that, so we
      # run a tiny local proxy that injects those headers and forward all
      # bw traffic through it instead of hitting the hostname directly.
      - name: Start local Cloudflare Access proxy
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cat > /tmp/cf_access_proxy.py <<'PYEOF'
          import http.server, http.client, os, ssl, sys

          LOCAL_PORT = 8087
          UPSTREAM_HOST = "vault.giomartins.dev"
          CF_ID = os.environ["CF_ACCESS_CLIENT_ID"]
          CF_SECRET = os.environ["CF_ACCESS_CLIENT_SECRET"]

          class Proxy(http.server.BaseHTTPRequestHandler):
              def _forward(self):
                  body_len = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(body_len) if body_len else None

                  headers = {k: v for k, v in self.headers.items()
                             if k.lower() not in ("host", "content-length", "accept-encoding")}
                  headers["CF-Access-Client-Id"] = CF_ID
                  headers["CF-Access-Client-Secret"] = CF_SECRET
                  headers["Accept-Encoding"] = "identity"
                  if body is not None:
                      headers["Content-Length"] = str(len(body))

                  ctx = ssl.create_default_context()
                  conn = http.client.HTTPSConnection(UPSTREAM_HOST, 443, context=ctx, timeout=30)
                  conn.request(self.command, self.path, body=body, headers=headers)
                  resp = conn.getresponse()
                  resp_body = resp.read()

                  self.send_response(resp.status)
                  for k, v in resp.getheaders():
                      if k.lower() in ("transfer-encoding", "content-encoding", "connection", "content-length"):
                          continue
                      self.send_header(k, v)
                  self.send_header("Content-Length", str(len(resp_body)))
                  self.end_headers()
                  self.wfile.write(resp_body)
                  conn.close()

              do_GET = do_POST = do_PUT = do_DELETE = do_PATCH = _forward

              def log_message(self, fmt, *args):
                  sys.stderr.write("%s\n" % (fmt % args))

          server = http.server.HTTPServer(("127.0.0.1", LOCAL_PORT), Proxy)
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain("/tmp/proxy.crt", "/tmp/proxy.key")
          server.socket = ctx.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          PYEOF
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/proxy.key -out /tmp/proxy.crt \
            -days 1 -nodes -subj "/CN=localhost" 2>/dev/null
          nohup python3 /tmp/cf_access_proxy.py > /tmp/proxy.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sk -o /dev/null https://127.0.0.1:8087/; then
              echo "proxy is up"
              break
            fi
            sleep 0.5
          done
          cat /tmp/proxy.log || true

      - name: Log in and unlock the vault
        id: bw
        env:
          # bw's own HTTPS calls all go to our loopback proxy at
          # 127.0.0.1:8087, which presents a self-signed cert -- disabling
          # verification only affects that loopback hop; the proxy itself
          # still verifies TLS on its outbound connection to the real
          # vault.giomartins.dev.
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          BW_CLIENTID: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
          BW_CLIENTSECRET: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
          BW_PASSWORD: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
        run: |
          bw config server https://127.0.0.1:8087
          bw login --apikey
          SESSION=$(bw unlock --passwordenv BW_PASSWORD --raw)
          echo "::add-mask::$SESSION"
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"

      - name: Create one vault item per secret
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          BW_SESSION: ${{ steps.bw.outputs.session }}
          DATABASE_URL_VALUE: postgresql://domain:${{ secrets.TF_POSTGRES_PASSWORD }}@postgres:5432/domain
          DOMAIN_API_KEYS_VALUE: ${{ secrets.TF_DOMAIN_API_KEYS }}
          REGISTRY_CLIENT_CERT_VALUE: ${{ secrets.REGISTRY_CLIENT_CERT }}
          REGISTRY_CLIENT_KEY_VALUE: ${{ secrets.REGISTRY_CLIENT_KEY }}
          REGISTRY_USERNAME_VALUE: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD_VALUE: ${{ secrets.TF_REGISTRY_PASSWORD }}
          CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_DOCKER_CLIENT_ID_VALUE: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_ID }}
          CLOUDFLARE_DOCKER_CLIENT_SECRET_VALUE: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_SECRET }}
          CF_ACCESS_CLIENT_ID_VALUE: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET_VALUE: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          TF_BESZEL_AGENT_KEY_VALUE: ${{ secrets.TF_BESZEL_AGENT_KEY }}
          TF_STATE_R2_ACCESS_KEY_ID_VALUE: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          TF_STATE_R2_SECRET_ACCESS_KEY_VALUE: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          TF_VAULTWARDEN_ADMIN_TOKEN_VALUE: ${{ secrets.TF_VAULTWARDEN_ADMIN_TOKEN }}
          TF_VAULTWARDEN_BRIDGE_API_KEY_VALUE: ${{ secrets.TF_VAULTWARDEN_BRIDGE_API_KEY }}
        run: |
          create_item() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "skip $name (empty)"
              return
            fi
            bw get template item 2>/dev/null \
              | jq --arg n "$name" --arg v "$value" \
                  '.type=1 | .name=$n | .login={"username":null,"password":$v}' \
              | bw encode \
              | bw create item >/dev/null
            echo "created $name"
          }

          create_item "DATABASE_URL" "$DATABASE_URL_VALUE"
          create_item "DOMAIN_API_KEYS" "$DOMAIN_API_KEYS_VALUE"
          create_item "REGISTRY_CLIENT_CERT" "$REGISTRY_CLIENT_CERT_VALUE"
          create_item "REGISTRY_CLIENT_KEY" "$REGISTRY_CLIENT_KEY_VALUE"
          create_item "REGISTRY_USERNAME" "$REGISTRY_USERNAME_VALUE"
          create_item "REGISTRY_PASSWORD" "$REGISTRY_PASSWORD_VALUE"
          create_item "CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_API_TOKEN_VALUE"
          create_item "CLOUDFLARE_ACCESS_API_TOKEN" "$CLOUDFLARE_ACCESS_API_TOKEN_VALUE"
          create_item "CLOUDFLARE_DOCKER_CLIENT_ID" "$CLOUDFLARE_DOCKER_CLIENT_ID_VALUE"
          create_item "CLOUDFLARE_DOCKER_CLIENT_SECRET" "$CLOUDFLARE_DOCKER_CLIENT_SECRET_VALUE"
          create_item "CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_ID_VALUE"
          create_item "CF_ACCESS_CLIENT_SECRET" "$CF_ACCESS_CLIENT_SECRET_VALUE"
          create_item "TF_BESZEL_AGENT_KEY" "$TF_BESZEL_AGENT_KEY_VALUE"
          create_item "TF_STATE_R2_ACCESS_KEY_ID" "$TF_STATE_R2_ACCESS_KEY_ID_VALUE"
          create_item "TF_STATE_R2_SECRET_ACCESS_KEY" "$TF_STATE_R2_SECRET_ACCESS_KEY_VALUE"
          create_item "TF_VAULTWARDEN_ADMIN_TOKEN" "$TF_VAULTWARDEN_ADMIN_TOKEN_VALUE"
          create_item "TF_VAULTWARDEN_BRIDGE_API_KEY" "$TF_VAULTWARDEN_BRIDGE_API_KEY_VALUE"
