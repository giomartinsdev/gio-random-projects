# Validação dos manifestos GitOps.
#
# Não valida Dockerfile nem testa código: isso é papel dos pipelines por
# linguagem. Aqui o escopo é estreito — garantir que o que vai para
# `gitops/` é YAML de Kubernetes sintaticamente válido e que o kustomize
# renderiza. Um manifesto quebrado mergeado em `main` não "falha o deploy"
# de forma visível: o ArgoCD fica em `OutOfSync`/`SyncFailed` em silêncio e
# o cluster continua na versão anterior. Este check é o que torna isso um
# erro de CI em vez de um mistério semanas depois.
name: gitops-validate

on:
  pull_request:
    paths:
      - 'gitops/**'
      - 'stacks/**'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'gitops/**'
      - 'stacks/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # kubectl embute o kustomize, então não há binário extra para instalar
      # e a versão do validador acompanha a do cliente.
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.5

      # kubeconform e não `kubectl apply --dry-run=client`: o kubectl busca o
      # OpenAPI no API server mesmo em dry-run client, então sem kubeconfig
      # ele falha com "dial tcp [::1]:8080: connection refused". kubeconform
      # valida contra schemas baixados, sem cluster.
      - name: Install kubeconform
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=v0.6.7
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Renderiza cada app e valida o schema
        run: |
          set -euo pipefail
          # `bootstrap/` é um ApplicationSet (CRD do ArgoCD): não existe no
          # schema do Kubernetes puro, então validá-lo aqui falharia. Ele é
          # aplicado uma vez, à mão, e é validado pelo próprio ArgoCD.
          dirs=$(find gitops/apps -name kustomization.yaml -exec dirname {} \; | sort)
          if [ -z "$dirs" ]; then
            echo "nenhum app em gitops/apps/ — nada a validar"
            exit 0
          fi
          for d in $dirs; do
            echo "::group::$d"
            kubectl kustomize "$d" > /tmp/rendered.yaml
            if [ ! -s /tmp/rendered.yaml ]; then
              echo "::error::$d renderizou vazio"
              exit 1
            fi
            # `-strict` trata campo desconhecido como erro, e não só como
            # aviso: um typo em `readinessProbe` seria aceito em silêncio
            # pelo API server e ignorado no cluster.
            kubeconform -strict -summary -kubernetes-version 1.36.0 \
              -output text /tmp/rendered.yaml
            echo "::endgroup::"
          done

      # Guarda contra o erro mais caro deste setup: tag móvel em GitOps.
      # Com `latest` o ArgoCD não detecta build novo e o cluster fica
      # silenciosamente defasado.
      - name: Proíbe tag `latest` nos manifestos
        run: |
          set -euo pipefail
          # Procura `image:` com `:latest` ou sem tag (que implica latest).
          if grep -rnE '^\s*image:\s*[^[:space:]]+' gitops/apps \
               | grep -E ':latest(\s|$)' ; then
            echo "::error::Use tag imutável (semver/sha) em gitops/. 'latest' impede o ArgoCD de detectar builds novos."
            exit 1
          fi
          echo "nenhuma tag móvel encontrada"

      # A armadilha mais cara da faxina (36 no README): o Dockhand roda
      # `docker compose up -d` SEM `--profile` às 03:00 UTC. Serviço migrado
      # sem `profiles: ["retired"]` ressuscita e briga por porta com o pod.
      # Isso já aconteceu de verdade — `excalidraw` voltou ao vivo durante um
      # redeploy — então virou gate, não comentário.
      - name: Todo serviço migrado tem profiles retired
        run: |
          set -euo pipefail
          # yq v4 (mikefarah) do runner, sem instalar nada.
          sudo wget -qO /usr/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.52.5/yq_linux_amd64
          sudo chmod +x /usr/bin/yq
          ./gitops/bootstrap/checa-profiles.sh stacks

      # `bump-digest.sh` e `cluster-secret-env.sh` rodam em TODO deploy de
      # imagem. Um erro de sintaxe aqui so apareceria no proximo push de app --
      # ou pior, no meio de um deploy, depois do registry ja ter recebido a
      # imagem. `bash -n` e barato e pega isso no PR.
      - name: Sintaxe dos scripts de CI
        run: |
          set -euo pipefail
          for f in .github/scripts/*.sh; do
            bash -n "$f"
            echo "ok: $f"
          done

      - name: A action composta esta coerente
        run: |
          set -euo pipefail
          python3 .github/scripts/valida-action.py

      # Guarda contra o acoplamento que o descomissionamento removeu: nenhum
      # workflow pode voltar a depender do daemon Docker da VPS (build agora e
      # no runner; push vai por tunel SSH) nem do webhook do Dockhand (o deploy
      # e o commit do digest; o ArgoCD aplica).
      - name: Nenhum workflow depende do Docker da VPS nem do Dockhand
        run: |
          set -euo pipefail
          if grep -rn 'DOCKER_HOST=ssh://' .github/workflows/ 2>/dev/null; then
            echo "::error::O Docker da VPS foi descomissionado. Build no runner (ubuntu-24.04-arm) + push por tunel SSH."
            exit 1
          fi
          if grep -rn 'api/git/stacks/.*/webhook' .github/workflows/ 2>/dev/null; then
            echo "::error::O Dockhand foi descomissionado. O deploy e o commit do digest; o ArgoCD aplica."
            exit 1
          fi
          echo "nenhum acoplamento com o daemon da VPS"
