name: TypeScript frontend deploy

# CI/CD for the TypeScript frontend apps under modules/apps/*/ --
# buteco-class-frontend (the Buteco dos Devs SPA) and tela-frontend
# (screen sharing's own page, split from tela-api). Split from the
# backend pipeline (ts-backend-ci-cd.yml) because the two build
# differently in a way that's easy to get wrong sharing one workflow:
# only a frontend needs VITE_* env vars baked into the bundle at build
# time. go-ci-cd.yml/tf-ci-cd.yml are their own pipelines for the same
# reason -- one pipeline per language+layer, not one generic pipeline
# branching on every difference between them.
#
# Neither app runs as a container: both are plain static builds
# mirrored into their own MinIO bucket (modules/infra/terraform's
# static_sites.tf/locals.tf), served by compute/services/ingress
# proxying straight to MinIO's S3 API. There's nothing here for
# Terraform to apply on a routine content deploy -- the bucket, the
# ingress route, and the public-read policy are all infra, created
# once by tf-ci-cd.yml, not per push. This workflow just replaces a
# bucket's contents with the latest build.
#
# ALLOWED_APPS below is the actual pipeline boundary -- add a new
# frontend app there (and nowhere else) to bring it under this
# pipeline; a package.json alone isn't enough, since that's equally
# true of every backend app in modules/apps/*/.

on:
  push:
    branches: [main]
    paths:
      - "modules/apps/buteco-class-frontend/**"
      - "modules/apps/tela-frontend/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all frontend apps)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        env:
          ALLOWED_APPS: "buteco-class-frontend tela-frontend"
        run: |
          all_apps=$(echo "$ALLOWED_APPS" | tr ' ' '\n')

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
              fi
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  # The bucket mirrored into below is always named after the app
  # itself (matrix.app) -- see root locals.tf's static_sites list,
  # where that name<->bucket pairing actually lives.
  deploy:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/apps/${{ matrix.app }}/package-lock.json

      - name: Install and test
        working-directory: modules/apps/${{ matrix.app }}
        run: |
          npm ci
          npx tsc -p tsconfig.json --noEmit
          npm test

      # Every VITE_* below is set for every app in the matrix -- Vite
      # only ever inlines the ones a given app's own code actually
      # references (import.meta.env.VITE_X), so an unused one here is
      # a harmless no-op, same convention the old Docker build-args
      # followed. buteco-class-frontend uses VITE_POST_API_URL/etc;
      # tela-frontend uses only VITE_TELA_API_URL. Both also get
      # VITE_OTEL_EXPORTER_OTLP_ENDPOINT (the browser telemetry in each
      # app's src/telemetry.ts).
      - name: Build ${{ matrix.app }}
        working-directory: modules/apps/${{ matrix.app }}
        env:
          VITE_POST_API_URL: https://post-api.giomartins.dev
          VITE_BOOKCLUB_API_URL: https://bookclub-api.giomartins.dev
          VITE_CLASSROOM_API_URL: https://classroom-api.giomartins.dev
          VITE_PUBLIC_APP_URL: https://buteco-class.giomartins.dev
          VITE_TELA_API_URL: https://tela-api.giomartins.dev
          VITE_OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.giomartins.dev
        run: npm run build

      # scp (not the docker provider/API) because the files have to
      # land on the VPS's own filesystem before "mc mirror" below can
      # bind-mount them into a container -- DOCKER_HOST=ssh://... runs
      # containers remotely, but a -v source path is still resolved on
      # that remote host, not this runner.
      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=ssh://ubuntu@$VPS_HOST" >> "$GITHUB_ENV"

      - name: Copy the build onto the VPS
        run: |
          REMOTE_DIR="/tmp/${{ matrix.app }}-dist-${{ github.run_id }}"
          ssh "ubuntu@$VPS_HOST" "rm -rf '$REMOTE_DIR'"
          scp -r "modules/apps/${{ matrix.app }}/dist" "ubuntu@$VPS_HOST:$REMOTE_DIR"
          echo "REMOTE_DIR=$REMOTE_DIR" >> "$GITHUB_ENV"

      # MinIO's own root credentials, already mirrored into Vaultwarden
      # by secrets.tf's "minio" vault_seed group -- same reasoning as
      # every other Terraform-generated secret this repo's CI reads
      # from the vault instead of holding its own copy.
      - name: Fetch secrets from Vaultwarden
        env:
          NETWORK_NAME: apps
          VAULTWARDEN_CLIENT_ID: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
          VAULTWARDEN_CLIENT_SECRET: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
          VAULTWARDEN_MASTER_PASSWORD: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
          ITEM_MAP: "MINIO_ROOT_USER=MINIO_ROOT_USER MINIO_ROOT_PASSWORD=MINIO_ROOT_PASSWORD"
        run: |
          set -o pipefail
          modules/infra/terraform/scripts/fetch_vault_secret.sh | while IFS='=' read -r k v; do
            echo "::add-mask::$v"
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done

      # --remove makes this a true mirror, not just an upload: an
      # asset from a previous build that's no longer referenced (Vite
      # content-hashes filenames, so every build's chunks are new
      # names) gets deleted from the bucket instead of accumulating
      # forever. --entrypoint sh works around minio/mc's own
      # ENTRYPOINT (["mc"]), the same as static_sites.tf's bucket
      # creation does.
      - name: Mirror the build into MinIO
        run: |
          docker run --rm --network apps \
            -e MC_HOST_local="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000" \
            -v "$REMOTE_DIR:/dist" \
            --entrypoint sh minio/mc -c '
              mc mirror --overwrite --remove /dist "local/${{ matrix.app }}"
            '

      - name: Clean up the copy on the VPS
        if: always()
        run: ssh "ubuntu@$VPS_HOST" "rm -rf '$REMOTE_DIR'"
