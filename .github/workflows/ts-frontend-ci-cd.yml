name: TypeScript frontend deploy

# CI/CD for the TypeScript frontend apps under modules/apps/*/ --
# tela-frontend (screen sharing's own page, split from tela-api),
# finance-frontend and hub-frontend (the shell that renders the others).
# go-ci-cd.yml/python-ci-cd.yml/tf-ci-cd.yml
# are their own pipelines -- one per language+layer, not one generic
# pipeline branching on every difference between them; in particular
# only a frontend needs VITE_* env vars baked into the bundle at build
# time.
#
# None of these runs as a container: all are plain static builds
# mirrored into their own MinIO bucket, served by the ingress
# (stacks/ingress/default.conf) proxying straight to MinIO's S3 API.
# The bucket and its public-read policy are infra, created once by the
# minio-buckets one-shot in stacks/persistence.yml, not per push --
# same for the ingress route. This workflow just replaces a bucket's
# contents with the latest build.
#
# ALLOWED_APPS below is the actual pipeline boundary -- add a new
# frontend app there (and nowhere else) to bring it under this
# pipeline; a package.json alone isn't enough, since that's equally
# true of every non-frontend app in modules/apps/*/.

on:
  push:
    branches: [main]
    paths:
      - "modules/apps/tela-frontend/**"
      - "modules/apps/hub-frontend/**"
      - "modules/apps/finance-frontend/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all frontend apps)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        env:
          ALLOWED_APPS: "tela-frontend hub-frontend finance-frontend"
        run: |
          all_apps=$(echo "$ALLOWED_APPS" | tr ' ' '\n')

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
              fi
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  # The bucket mirrored into below is always named after the app
  # itself (matrix.app) -- see root locals.tf's static_sites list,
  # where that name<->bucket pairing actually lives.
  deploy:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    # Um push novo cancela o anterior. Aqui o "deploy" é espelhar o build no
    # MinIO (`mc mirror --overwrite --remove`), idempotente -- diferente dos
    # outros workflows, este job não roda terraform apply, então cancelar não
    # deixa container pela metade. Se um mirror for interrompido, o run novo
    # (que é quem dispara o cancel) remirrora por cima.
    concurrency:
      group: ts-frontend-${{ matrix.app }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/apps/${{ matrix.app }}/package-lock.json

      - name: Install and test
        working-directory: modules/apps/${{ matrix.app }}
        run: |
          npm ci
          npx tsc -p tsconfig.json --noEmit
          npm test

      # Every VITE_* below is set for every app in the matrix -- Vite
      # only ever inlines the ones a given app's own code actually
      # references (import.meta.env.VITE_X), so an unused one here is
      # a harmless no-op, same convention the old Docker build-args
      # followed. tela-frontend uses only VITE_TELA_API_URL.
      # The SPAs with browser
      # telemetry also get VITE_OTEL_EXPORTER_OTLP_ENDPOINT (unused here
      # is a no-op -- see src/telemetry.ts in each app).
      #
      # VITE_GOOGLE_CLIENT_ID is resolved per app. The client ID is PUBLIC
      # (it ships in the bundle either way). A single Google OAuth client can serve several
      # origins as long as each is in its "authorized JavaScript origins";
      # the secret overrides exist for when a product gets its OWN client.
      - name: Resolve the app's Google OAuth client ID
        working-directory: modules/apps/${{ matrix.app }}
        run: |
          # The public fallback: the shared client whose JS origins include
          # finance.
          shared="45441571832-4vldrm5h9ef87c82m1spuu6g8foa0k8c.apps.googleusercontent.com"
          case "${{ matrix.app }}" in
            finance-frontend) id="${{ secrets.FINANCE_GOOGLE_OAUTH_CLIENT_ID }}" ;;
            *)                id="" ;;
          esac
          # Fall back to the shared public client so a product whose own
          # secret isn't set still gets a working sign-in button.
          case "${{ matrix.app }}" in
            finance-frontend) [ -n "$id" ] || id="$shared" ;;
          esac
          echo "VITE_GOOGLE_CLIENT_ID=$id" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.app }}
        working-directory: modules/apps/${{ matrix.app }}
        env:
          VITE_TELA_API_URL: https://tela-api.giomartins.dev
          VITE_OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.giomartins.dev
          # A API do financeiro vive em finance-API., não no host da SPA
          # (finance.) -- apontar para o próprio host faria a SPA chamar a si
          # mesma e todo request virar 404.
          VITE_FINANCE_API_URL: https://finance-api.giomartins.dev
        run: npm run build

      # scp (not the docker provider/API) because the files have to
      # land on the VPS's own filesystem before "mc mirror" below can
      # bind-mount them into a container -- DOCKER_HOST=ssh://... runs
      # containers remotely, but a -v source path is still resolved on
      # that remote host, not this runner.
      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=ssh://ubuntu@$VPS_HOST" >> "$GITHUB_ENV"

      - name: Copy the build onto the VPS
        run: |
          REMOTE_DIR="/tmp/${{ matrix.app }}-dist-${{ github.run_id }}"
          ssh "ubuntu@$VPS_HOST" "rm -rf '$REMOTE_DIR'"
          scp -r "modules/apps/${{ matrix.app }}/dist" "ubuntu@$VPS_HOST:$REMOTE_DIR"
          echo "REMOTE_DIR=$REMOTE_DIR" >> "$GITHUB_ENV"

      # MinIO's own root credentials, already mirrored into Vaultwarden
      # by secrets.tf's "minio" vault_seed group -- same reasoning as
      # every other Terraform-generated secret this repo's CI reads
      # from the vault instead of holding its own copy.
      - name: Fetch secrets from Vaultwarden
        env:
          NETWORK_NAME: apps
          # Vaultwarden e POD desde 2026-10-23; o nome `vaultwarden` na rede
          # `apps` so resolve para o container de ROLLBACK (parado). NodePort
          # fixo do Service em `persistence` -- ver fetch_vault_secret.sh.
          VAULTWARDEN_UPSTREAM: host.docker.internal:30822
          VAULTWARDEN_CLIENT_ID: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
          VAULTWARDEN_CLIENT_SECRET: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
          VAULTWARDEN_MASTER_PASSWORD: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
          ITEM_MAP: "MINIO_ROOT_USER=MINIO_ROOT_USER MINIO_ROOT_PASSWORD=MINIO_ROOT_PASSWORD"
        run: |
          set -o pipefail
          modules/infra/terraform/scripts/fetch_vault_secret.sh | while IFS='=' read -r k v; do
            echo "::add-mask::$v"
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done

      # --delete makes this a true mirror, not just an upload: an
      # asset from a previous build that's no longer referenced (Vite
      # content-hashes filenames, so every build's chunks are new
      # names) gets deleted from the bucket instead of accumulating
      # forever.
      #
      # aws-cli, not minio/mc: `minio/mc` saiu do Docker Hub (404) e o
      # `quay.io/minio/*` responde 401, então não há mais imagem de `mc`
      # puxável. O `amazon/aws-cli` é público -- e isso importa aqui, porque
      # este `docker run` roda no daemon da VPS (DOCKER_HOST=ssh), sem
      # credencial de registry: o pull só passa sendo anônimo. Fala a mesma
      # API S3 e também adivinha o Content-Type pela extensão, que é do que o
      # ingress depende ao servir os objetos direto do MinIO.
      - name: Mirror the build into MinIO
        env:
          AWS_ACCESS_KEY_ID: ${{ env.MINIO_ROOT_USER }}
          AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_ROOT_PASSWORD }}
          AWS_DEFAULT_REGION: us-east-1
          # NodePort do Service `minio` no k3s (9000 -> 30900).
          #
          # Por que não `http://minio:9000`: esse nome resolve pelo DNS do
          # Docker para o CONTAINER, que desde 2026-10-23 é só o rollback. O CI
          # continuaria publicando num container ocioso enquanto o site serve do
          # pod — verde, sem erro, e o bucket servido nunca recebia o build.
          # `172.18.0.1` é o gateway da rede `apps` no host, então o NodePort
          # é alcançável de dentro dela (verificado: resposta S3 real).
          #
          # Quando o container do minio sair de vez, o nome `minio` volta a ser
          # resolvível pelo Service do cluster para pods — mas continuaria NÃO
          # resolvendo para containers Docker, porque o DNS do Docker não conhece
          # o cluster. Por isso o endereço explícito, e não o nome.
          MINIO_ENDPOINT: http://172.18.0.1:30900
        run: |
          docker run --rm --network apps \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION \
            -v "$REMOTE_DIR:/dist" \
            amazon/aws-cli:latest \
            s3 sync /dist "s3://${{ matrix.app }}" \
              --endpoint-url "$MINIO_ENDPOINT" --delete

      - name: Clean up the copy on the VPS
        if: always()
        run: ssh "ubuntu@$VPS_HOST" "rm -rf '$REMOTE_DIR'"
