name: TypeScript frontend deploy

# CI/CD for the TypeScript frontend apps under modules/apps/*/ --
# tela-frontend (screen sharing's own page, split from tela-api),
# finance-frontend and hub-frontend (the shell that renders the others).
# go-ci-cd.yml/python-ci-cd.yml/tf-ci-cd.yml
# are their own pipelines -- one per language+layer, not one generic
# pipeline branching on every difference between them; in particular
# only a frontend needs VITE_* env vars baked into the bundle at build
# time.
#
# None of these runs as a container: all are plain static builds
# mirrored into their own MinIO bucket, served by the ingress
# (stacks/ingress/default.conf) proxying straight to MinIO's S3 API.
# The bucket and its public-read policy are infra, created once by the
# minio-buckets one-shot in stacks/persistence.yml, not per push --
# same for the ingress route. This workflow just replaces a bucket's
# contents with the latest build.
#
# ALLOWED_APPS below is the actual pipeline boundary -- add a new
# frontend app there (and nowhere else) to bring it under this
# pipeline; a package.json alone isn't enough, since that's equally
# true of every non-frontend app in modules/apps/*/.

on:
  push:
    branches: [main]
    paths:
      - "modules/apps/tela-frontend/**"
      - "modules/apps/hub-frontend/**"
      - "modules/apps/finance-frontend/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all frontend apps)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        env:
          ALLOWED_APPS: "tela-frontend hub-frontend finance-frontend"
        run: |
          all_apps=$(echo "$ALLOWED_APPS" | tr ' ' '\n')

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
              fi
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  # The bucket mirrored into below is always named after the app
  # itself (matrix.app) -- see root locals.tf's static_sites list,
  # where that name<->bucket pairing actually lives.
  deploy:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    # Um push novo cancela o anterior. Aqui o "deploy" é espelhar o build no
    # MinIO (`aws s3 sync --delete`), idempotente -- diferente dos
    # outros workflows, este job não roda terraform apply, então cancelar não
    # deixa container pela metade. Se um mirror for interrompido, o run novo
    # (que é quem dispara o cancel) remirrora por cima.
    concurrency:
      group: ts-frontend-${{ matrix.app }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/apps/${{ matrix.app }}/package-lock.json

      - name: Install and test
        working-directory: modules/apps/${{ matrix.app }}
        run: |
          npm ci
          npx tsc -p tsconfig.json --noEmit
          npm test

      # Every VITE_* below is set for every app in the matrix -- Vite
      # only ever inlines the ones a given app's own code actually
      # references (import.meta.env.VITE_X), so an unused one here is
      # a harmless no-op, same convention the old Docker build-args
      # followed. tela-frontend uses only VITE_TELA_API_URL.
      # The SPAs with browser
      # telemetry also get VITE_OTEL_EXPORTER_OTLP_ENDPOINT (unused here
      # is a no-op -- see src/telemetry.ts in each app).
      #
      # VITE_GOOGLE_CLIENT_ID is resolved per app. The client ID is PUBLIC
      # (it ships in the bundle either way). A single Google OAuth client can serve several
      # origins as long as each is in its "authorized JavaScript origins";
      # the secret overrides exist for when a product gets its OWN client.
      - name: Resolve the app's Google OAuth client ID
        working-directory: modules/apps/${{ matrix.app }}
        run: |
          # The public fallback: the shared client whose JS origins include
          # finance.
          shared="45441571832-4vldrm5h9ef87c82m1spuu6g8foa0k8c.apps.googleusercontent.com"
          case "${{ matrix.app }}" in
            finance-frontend) id="${{ secrets.FINANCE_GOOGLE_OAUTH_CLIENT_ID }}" ;;
            *)                id="" ;;
          esac
          # Fall back to the shared public client so a product whose own
          # secret isn't set still gets a working sign-in button.
          case "${{ matrix.app }}" in
            finance-frontend) [ -n "$id" ] || id="$shared" ;;
          esac
          echo "VITE_GOOGLE_CLIENT_ID=$id" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.app }}
        working-directory: modules/apps/${{ matrix.app }}
        env:
          VITE_TELA_API_URL: https://tela-api.giomartins.dev
          VITE_OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.giomartins.dev
          # A API do financeiro vive em finance-API., não no host da SPA
          # (finance.) -- apontar para o próprio host faria a SPA chamar a si
          # mesma e todo request virar 404.
          VITE_FINANCE_API_URL: https://finance-api.giomartins.dev
        run: npm run build

      # SSH só para ler o Secret do MinIO no cluster (kubectl). Não há mais
      # `scp`: o build fica no runner e o `s3 sync` fala com o MinIO pela rede.
      - name: Set up SSH access to the VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          echo "VPS_HOST=$VPS_HOST" >> "$GITHUB_ENV"

      # O build NÃO é copiado para a VPS. Antes, `scp` existia só porque o
      # `docker run -v` do `mc mirror` era resolvido no daemon REMOTO — com o
      # daemon fora, o caminho do bind-mount não faz mais sentido. O `s3 sync`
      # abaixo roda local no runner e fala com o MinIO pela rede.

      # Credenciais do MinIO vêm do Secret do CLUSTER (fonte da verdade), não
      # do Vaultwarden: o `fetch_vault_secret.sh` fazia `docker run` no daemon
      # da VPS. Ver `.github/scripts/cluster-secret-env.sh`.
      - name: Fetch MinIO credentials from the cluster
        env:
          CLUSTER_SECRET: minio
        run: |
          set -o pipefail
          .github/scripts/cluster-secret-env.sh | while IFS='=' read -r k v; do
            echo "::add-mask::$v"
            echo "${k}=${v}" >> "$GITHUB_ENV"
          done

      # --delete makes this a true mirror, not just an upload: an asset from a
      # previous build that's no longer referenced (Vite content-hashes
      # filenames, so every build's chunks are new names) gets deleted from the
      # bucket instead of accumulating forever.
      #
      # `aws` CLI NATIVO no runner, não `docker run amazon/aws-cli`: o
      # container era a única forma porque o `-v` do bind-mount era resolvido no
      # daemon da VPS (que morreu). O runner é Ubuntu e já traz o `aws` CLI
      # instalado. Ele também adivinha o Content-Type pela extensão, que é do
      # que o ingress depende ao servir os objetos direto do MinIO.
      #
      # O endpoint é o NOME PÚBLICO do MinIO (via ingress/Cloudflare), não o
      # NodePort: `172.18.0.1:30900` só existia de dentro da rede Docker `apps`,
      # e o NodePort é bloqueado pelo firewall para origens externas.
      - name: Mirror the build into MinIO
        env:
          AWS_ACCESS_KEY_ID: ${{ env.MINIO_ROOT_USER }}
          AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_ROOT_PASSWORD }}
          AWS_DEFAULT_REGION: us-east-1
          MINIO_ENDPOINT: https://minio.giomartins.dev
        run: |
          aws s3 sync "modules/apps/${{ matrix.app }}/dist" "s3://${{ matrix.app }}" \
            --endpoint-url "$MINIO_ENDPOINT" --delete

