name: Build and push web image

# Separate from api-build-push.yml because web/ isn't under api/ — it's
# the frontend, not a Python service, and doesn't need the shared/
# telemetry package api-build-push.yml's shared build context exists
# for. Builds registry.giomartins.dev/web with VITE_GATEWAY_URL baked in
# at build time (see web/Dockerfile's own note on why that can't be a
# runtime env var).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-build-push.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      - name: Type check + build
        working-directory: web
        run: npm run build

      - name: Lint (oxlint)
        working-directory: web
        run: npm run lint

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See api-build-push.yml's identical, more heavily commented
      # version of this step — registry.giomartins.dev sits behind
      # Cloudflare Access, which plain `docker login`/push can't satisfy
      # on its own, so this nginx sidecar injects the Service Token
      # headers Access needs.
      - name: Start Cloudflare Access header-injecting proxy
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cat > /tmp/default.conf.template <<'EOF'
          server {
              listen 5050;
              client_max_body_size 0;
              location / {
                  proxy_pass https://registry.giomartins.dev;
                  proxy_set_header Host registry.giomartins.dev;
                  proxy_set_header CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}";
                  proxy_set_header CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}";
                  proxy_ssl_server_name on;
              }
          }
          EOF
          docker run -d --name access-proxy --network host \
            -e CF_ACCESS_CLIENT_ID \
            -e CF_ACCESS_CLIENT_SECRET \
            -v /tmp/default.conf.template:/etc/nginx/templates/default.conf.template:ro \
            nginx:alpine
          sleep 2
          docker logs access-proxy

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host
          config-inline: |
            [registry."localhost:5050"]
              http = true
              insecure = true

      - name: Log in to registry (via the local Access-proxy)
        uses: docker/login-action@v3
        with:
          registry: localhost:5050
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          build-args: |
            VITE_GATEWAY_URL=https://gateway.giomartins.dev
          tags: |
            localhost:5050/web:latest
            localhost:5050/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
