name: Prune orphaned Cloudflare DNS records

# Manual only — deletes DNS records, unlike dns-sync.yml's upsert-only
# behavior. Run from the Actions tab when infra/cloudflared/config.yml
# has dropped a hostname and the leftover CNAME should go too.

on:
  workflow_dispatch: {}

jobs:
  prune-dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - run: echo "::add-mask::36f8270d-52a2-4635-b9f2-f5174307e76e"

      - name: Delete DNS records with no matching ingress hostname
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TUNNEL_ID: "36f8270d-52a2-4635-b9f2-f5174307e76e"
        run: python3 .github/scripts/prune_cloudflare_dns.py infra/cloudflared/config.yml
