name: One-time registry push failure diagnostic

# Reproduces the "digest invalid: provided digest did not match
# uploaded content" failure apps-deploy.yml hits on every push, then
# immediately pulls the registry and cloudflared containers' own logs
# via docker.giomartins.dev (the same Cloudflare Access-protected
# Docker Engine API modules/infra/terraform's docker provider already
# uses) -- gio-server has no SSH path reachable from a GitHub-hosted
# runner, but this control-plane path is already wired up and
# Access-gated, so it gives real server-side visibility without one.
# Remove this workflow once the real root cause is found.

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install registry.giomartins.dev's mTLS client certificate
        run: |
          sudo mkdir -p /etc/docker/certs.d/registry.giomartins.dev
          echo "${{ secrets.REGISTRY_CLIENT_CERT }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.cert > /dev/null
          echo "${{ secrets.REGISTRY_CLIENT_KEY }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.key > /dev/null

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to registry.giomartins.dev
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Record start time
        run: date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/start_time.txt

      - name: Reproduce the failure (small throwaway image, expected to fail)
        id: repro
        continue-on-error: true
        run: |
          mkdir /tmp/diagctx
          cat > /tmp/diagctx/Dockerfile <<'EOF'
          FROM alpine:3.20
          RUN dd if=/dev/urandom of=/pad.bin bs=1M count=11
          EOF
          docker buildx build --push \
            -t registry.giomartins.dev/diag-repro:latest \
            /tmp/diagctx

      - name: Start Cloudflare Access header-injecting proxy for dockerd
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_SECRET }}
        run: |
          cat > /tmp/default.conf.template <<'EOF'
          server {
              listen 2475;
              client_max_body_size 0;
              location / {
                  proxy_pass https://docker.giomartins.dev;
                  proxy_set_header Host docker.giomartins.dev;
                  proxy_set_header CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}";
                  proxy_set_header CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}";
                  proxy_ssl_server_name on;
                  proxy_http_version 1.1;
              }
          }
          EOF
          docker run -d --name access-proxy --network host \
            -e CF_ACCESS_CLIENT_ID \
            -e CF_ACCESS_CLIENT_SECRET \
            -v /tmp/default.conf.template:/etc/nginx/templates/default.conf.template:ro \
            nginx:alpine
          sleep 2

      - name: Pull registry container logs since the repro attempt
        env:
          DOCKER_HOST: tcp://localhost:2475
        run: |
          SINCE=$(cat /tmp/start_time.txt)
          echo "=== registry container logs since $SINCE ==="
          docker logs --since "$SINCE" registry 2>&1 | tail -200 || echo "(no 'registry' container or fetch failed)"

      - name: Pull cloudflared container logs since the repro attempt
        env:
          DOCKER_HOST: tcp://localhost:2475
        run: |
          SINCE=$(cat /tmp/start_time.txt)
          echo "=== cloudflared container logs since $SINCE ==="
          docker logs --since "$SINCE" cloudflared 2>&1 | tail -200 || echo "(no 'cloudflared' container or fetch failed)"

      - name: Fail if repro didn't reproduce
        if: steps.repro.outcome == 'success'
        run: |
          echo "Repro push succeeded -- bug didn't reproduce this time, logs above are for a clean run."

      - name: Cleanup temp cert files
        if: always()
        run: rm -f /tmp/client.cert /tmp/client.key 2>/dev/null || true
