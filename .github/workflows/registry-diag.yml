name: One-time registry push diagnostic

# Temporary: isolating why apps-deploy.yml's docker push started failing
# at the final manifest step with "digest invalid: provided digest did
# not match uploaded content" right after the mTLS client cert refresh.
# Bypasses docker/buildx entirely and speaks the registry v2 HTTP API
# directly with curl, so we can tell whether this is a buildx quirk or
# genuine content corruption in transit (the same class of bug as the
# Cloudflare Tunnel HTTP/2->1.1 translation issue fixed for Beszel).
# Remove this workflow once the real issue is found.

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install mTLS client cert
        run: |
          echo "${{ secrets.REGISTRY_CLIENT_CERT }}" > /tmp/client.cert
          echo "${{ secrets.REGISTRY_CLIENT_KEY }}" > /tmp/client.key

      - name: Small blob (100KB) round-trip
        run: |
          dd if=/dev/urandom of=/tmp/small.bin bs=1024 count=100 2>/dev/null
          DIGEST="sha256:$(sha256sum /tmp/small.bin | cut -d' ' -f1)"
          echo "expected: $DIGEST"

          LOC=$(curl -s -D - -o /dev/null --cert /tmp/client.cert --key /tmp/client.key \
            -u "admin:${{ secrets.REGISTRY_PASSWORD }}" \
            -X POST "https://registry.giomartins.dev/v2/diag-test/blobs/uploads/" \
            | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
          case "$LOC" in
            http*) URL="$LOC" ;;
            *) URL="https://registry.giomartins.dev${LOC}" ;;
          esac
          echo "upload url: $URL"

          SEP="&"; case "$URL" in *\?*) ;; *) SEP="?" ;; esac

          curl -s -o /tmp/small-resp.txt -w "HTTP %{http_code}\n" \
            --cert /tmp/client.cert --key /tmp/client.key \
            -u "admin:${{ secrets.REGISTRY_PASSWORD }}" \
            -X PUT -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/small.bin \
            "${URL}${SEP}digest=${DIGEST}"
          cat /tmp/small-resp.txt

      - name: Large blob (11MB, matching the failing layer's size) round-trip
        run: |
          dd if=/dev/urandom of=/tmp/large.bin bs=1M count=11 2>/dev/null
          DIGEST="sha256:$(sha256sum /tmp/large.bin | cut -d' ' -f1)"
          echo "expected: $DIGEST"

          LOC=$(curl -s -D - -o /dev/null --cert /tmp/client.cert --key /tmp/client.key \
            -u "admin:${{ secrets.REGISTRY_PASSWORD }}" \
            -X POST "https://registry.giomartins.dev/v2/diag-test/blobs/uploads/" \
            | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
          case "$LOC" in
            http*) URL="$LOC" ;;
            *) URL="https://registry.giomartins.dev${LOC}" ;;
          esac
          echo "upload url: $URL"

          SEP="&"; case "$URL" in *\?*) ;; *) SEP="?" ;; esac

          curl -s -o /tmp/large-resp.txt -w "HTTP %{http_code}\n" \
            --cert /tmp/client.cert --key /tmp/client.key \
            -u "admin:${{ secrets.REGISTRY_PASSWORD }}" \
            -X PUT -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/large.bin \
            "${URL}${SEP}digest=${DIGEST}"
          cat /tmp/large-resp.txt

      - name: Cleanup temp cert files
        if: always()
        run: rm -f /tmp/client.cert /tmp/client.key
