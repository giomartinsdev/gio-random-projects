name: TypeScript deploy

# CI/CD for the TypeScript/Node apps under modules/apps/*/ (has both a
# Dockerfile and a package.json) — today just post-api. Separate from
# go-ci-cd.yml on purpose: different toolchain (npm vs go), different
# test command, different failure modes worth keeping isolated rather
# than one pipeline branching on language per step.
#
# Deploys go through Terraform, not watchtower — same reasoning as
# go-ci-cd.yml's own header comment. post-api's own watchtower label
# defaults to false for the same reason domain_api/domain_worker's
# does; see modules/compute/post_api/variables.tf's watchtower_enabled.

on:
  push:
    branches: [main]
    paths:
      - "modules/apps/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Build only this app (blank = all TypeScript apps under modules/apps/)"
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: list
        run: |
          all_apps=$(find modules/apps -mindepth 2 -maxdepth 2 -name package.json \
            -exec dirname {} \; | xargs -n1 basename | sort)

          if [ -n "${{ inputs.app }}" ]; then
            apps=$(echo "$all_apps" | grep -x "${{ inputs.app }}" || true)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            apps="$all_apps"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            apps=""
            for a in $all_apps; do
              if echo "$changed" | grep -q "^modules/apps/$a/"; then
                apps="$apps $a"
              fi
            done
          fi

          json=$(echo "$apps" | xargs -n1 | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Building: $json"
          echo "apps=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/apps/${{ matrix.app }}/package-lock.json

      - name: Install and test
        working-directory: modules/apps/${{ matrix.app }}
        run: |
          npm ci
          npx tsc -p tsconfig.json --noEmit
          npm test

      # registry.giomartins.dev requires mTLS now (see
      # modules/infra/terraform/modules/cloudflare/registry_mtls.tf) —
      # htpasswd alone stopped being enough to get past the edge.
      # Docker has no way to attach a client certificate through
      # BuildKit's isolated docker-container driver (the default), so
      # this uses the classic "docker" driver instead: it delegates to
      # the runner's own dockerd, which resolves
      # /etc/docker/certs.d/<host>/{client.cert,client.key}
      # automatically, the same convention gio-server's dockerd uses
      # for watchtower's pulls. Trade-off: the "docker" driver doesn't
      # support the type=gha cache backend below, so pushes here build
      # without cross-run caching — acceptable for images this small.
      - name: Install registry.giomartins.dev's mTLS client certificate
        run: |
          sudo mkdir -p /etc/docker/certs.d/registry.giomartins.dev
          echo "${{ secrets.REGISTRY_CLIENT_CERT }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.cert > /dev/null
          echo "${{ secrets.REGISTRY_CLIENT_KEY }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.key > /dev/null

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to registry.giomartins.dev
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: modules/apps/${{ matrix.app }}
          push: true
          tags: |
            registry.giomartins.dev/${{ matrix.app }}:latest
            registry.giomartins.dev/${{ matrix.app }}:${{ github.sha }}

  deploy:
    needs: [discover, build-and-push]
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/infra/terraform
    # Same secrets go-ci-cd.yml/tf-ci-cd.yml use — a real
    # `terraform apply` needs the full variable set regardless of
    # what's actually changing, and nothing here is new.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_google_idp_identity_provider_id: ${{ secrets.CLOUDFLARE_GOOGLE_IDP_ID }}
      TF_VAR_registry_password: ${{ secrets.TF_REGISTRY_PASSWORD }}
      TF_VAR_beszel_agent_key: ${{ secrets.TF_BESZEL_AGENT_KEY }}
      TF_VAR_vaultwarden_account_email: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_EMAIL }}
      TF_VAR_vaultwarden_account_master_password: ${{ secrets.TF_VAULTWARDEN_ACCOUNT_PASSWORD }}
      TF_VAR_vaultwarden_api_client_id: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_ID }}
      TF_VAR_vaultwarden_api_client_secret: ${{ secrets.TF_VAULTWARDEN_API_CLIENT_SECRET }}
      TF_VAR_docker_host: "tcp://localhost:2475"
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Start Cloudflare Access header-injecting proxy for dockerd
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_DOCKER_CLIENT_SECRET }}
        run: |
          cat > /tmp/default.conf.template <<'EOF'
          server {
              listen 2475;
              client_max_body_size 0;
              location / {
                  proxy_pass https://docker.giomartins.dev;
                  proxy_set_header Host docker.giomartins.dev;
                  proxy_set_header CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}";
                  proxy_set_header CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}";
                  proxy_ssl_server_name on;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }
          }
          EOF
          docker run -d --name access-proxy --network host \
            -e CF_ACCESS_CLIENT_ID \
            -e CF_ACCESS_CLIENT_SECRET \
            -v /tmp/default.conf.template:/etc/nginx/templates/default.conf.template:ro \
            nginx:alpine
          sleep 2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Init
        run: terraform init -backend-config="endpoints={s3=\"${{ secrets.TF_STATE_R2_ENDPOINT }}\"}"

      # See go-ci-cd.yml's own "Pull the image(s) just pushed" step for
      # why this pull (with its own registry login) is what actually
      # guarantees a fresh image, not just -replace.
      - name: Install registry.giomartins.dev's mTLS client certificate
        run: |
          sudo mkdir -p /etc/docker/certs.d/registry.giomartins.dev
          echo "${{ secrets.REGISTRY_CLIENT_CERT }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.cert > /dev/null
          echo "${{ secrets.REGISTRY_CLIENT_KEY }}" | sudo tee /etc/docker/certs.d/registry.giomartins.dev/client.key > /dev/null

      - name: Log in to registry.giomartins.dev
        uses: docker/login-action@v3
        with:
          registry: registry.giomartins.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Pull the image(s) just pushed onto gio-server's own dockerd
        env:
          DOCKER_HOST: tcp://localhost:2475
        run: |
          for app in $(echo '${{ needs.discover.outputs.apps }}' | jq -r '.[]'); do
            docker pull "registry.giomartins.dev/${app}:latest"
          done

      - name: Deploy the image(s) just pushed
        run: |
          REPLACE_ARGS=()
          for app in $(echo '${{ needs.discover.outputs.apps }}' | jq -r '.[]'); do
            case "$app" in
              post-api) REPLACE_ARGS+=("-replace=module.compute_post_api.docker_container.post_api") ;;
            esac
          done
          terraform apply -input=false -auto-approve "${REPLACE_ARGS[@]}"
