# Prefect deployment config.
#
# Flows live under flows/, one folder per flow (see flows/README.md for
# the ETL pattern each folder follows). No image build/push: the worker
# clones this repo fresh from git on every run (see the `pull` step),
# so a new deployment is just a git push + `prefect deploy`.
#
# CI runs `prefect deploy --all` (and prunes any deployment whose entry
# was removed from here — see .github/scripts/prune_prefect_deployments.py)
# on every push to flows/** or this file — see .github/workflows/flows-ci.yml.
#
# No OTel here anymore, on any flow — the otel-collector they used to
# export to was removed from the host after it crash-looped and took
# the whole host down with it. Turning exporters off wasn't enough on
# its own: the old `opentelemetry-bootstrap -a install` pull step ran a
# live pip install on every single flow-run container (no cache between
# runs), which took long enough that at bus-gps-poller/brt-gps-poller's
# 1-minute cadence, a new run started before the previous one finished
# bootstrapping — confirmed live as three dozen stuck containers piled
# up on the host, none ever completing. With nothing left to
# instrument, that whole step (and `opentelemetry-instrument` wrapping
# the run command) is just gone rather than fixed in place.

name: gio-random-projects
prefect-version: "3"

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      id: pull_code
      repository: https://github.com/giomartinsdev/gio-random-projects.git
      branch: main
  - prefect.deployments.steps.pip_install_requirements:
      directory: "{{ pull_code.directory }}/flows"
      requirements_file: requirements.txt

deployments:
  - name: bus-gps-poller
    entrypoint: flows/bus_gps_poller/flow.py:bus_gps_poller
    parameters:
      gateway_url: https://gateway.giomartins.dev
      api_key: "{{ prefect.blocks.secret.gateway-api-key }}"
    work_pool:
      name: docker-pool
      job_variables:
        networks: ["prefect-net"]
        # Without this, DockerWorker leaves every finished run's
        # container behind (confirmed live: hundreds had piled up,
        # exited but never removed) — same effect as `docker run --rm`.
        auto_remove: true
    # Every minute, business hours only (08h-18h, every day) — bumped
    # from every 5 minutes after riders watching the live map noticed
    # stale bus positions. window_seconds (still 300, i.e. last 5
    # minutes of SPPO pings) is now wider than the poll interval on
    # purpose: RecordVehiclePositions upserts by vehicle_id, so the
    # heavier overlap between consecutive runs is redundant work, not a
    # correctness issue, and keeping the window wide means one
    # slow/late upstream response still gets fully covered by the very
    # next run. Was Mon-Fri only ("1-5") until a rider on a Saturday
    # noticed every bus showing "sem previsão" — buses (and SuperVia
    # trains) run every day, so restricting the poller to weekdays was
    # never correct, just unnoticed until someone actually rode on a
    # weekend.
    schedule:
      cron: "*/1 8-18 * * *"
      timezone: "America/Sao_Paulo"

  - name: brt-gps-poller
    entrypoint: flows/brt_gps_poller/flow.py:brt_gps_poller
    parameters:
      gateway_url: https://gateway.giomartins.dev
      api_key: "{{ prefect.blocks.secret.gateway-api-key }}"
    work_pool:
      name: docker-pool
      job_variables:
        networks: ["prefect-net"]
        # Without this, DockerWorker leaves every finished run's
        # container behind (confirmed live: hundreds had piled up,
        # exited but never removed) — same effect as `docker run --rm`.
        auto_remove: true
    # Same cadence as bus-gps-poller — BRT has no window to align to
    # (it's always a live snapshot), so this is just "keep it
    # reasonably fresh during business hours" rather than "cover a
    # window with no gap". Every day, not just weekdays — see
    # bus-gps-poller's own schedule comment for why.
    schedule:
      cron: "*/1 8-18 * * *"
      timezone: "America/Sao_Paulo"

  - name: vehicle-position-archiver
    entrypoint: flows/vehicle_position_archiver/flow.py:vehicle_position_archiver
    parameters:
      gateway_url: https://gateway.giomartins.dev
      api_key: "{{ prefect.blocks.secret.gateway-api-key }}"
    work_pool:
      name: docker-pool
      job_variables:
        networks: ["prefect-net"]
        # Without this, DockerWorker leaves every finished run's
        # container behind (confirmed live: hundreds had piled up,
        # exited but never removed) — same effect as `docker run --rm`.
        auto_remove: true
    # Hourly — independent of the 5-minute poll cadence, this just
    # needs to run often enough that VehiclePositionHistory never
    # grows unbounded between archives.
    schedule:
      cron: "0 * * * *"
      timezone: "America/Sao_Paulo"

  - name: gtfs-importer
    entrypoint: flows/gtfs_importer/flow.py:gtfs_importer
    parameters:
      gateway_url: https://gateway.giomartins.dev
      api_key: "{{ prefect.blocks.secret.gateway-api-key }}"
    work_pool:
      name: docker-pool
      job_variables:
        networks: ["prefect-net"]
        # Without this, DockerWorker leaves every finished run's
        # container behind (confirmed live: hundreds had piled up,
        # exited but never removed) — same effect as `docker run --rm`.
        auto_remove: true
    # Monthly, matching the SMTR feed's own update cadence (see
    # flows/gtfs_importer/etl/extract.py) — a tighter schedule would
    # just re-import identical data.
    schedule:
      cron: "0 6 1 * *"
      timezone: "America/Sao_Paulo"
